<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>support-agent console</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--dim:#6b6b66;--line:#e2e2dd;--card:#fff;--sunk:#f4f4f1;
      --ok:#1f7a4d;--warn:#9a6a00;--bad:#a32b2b;--accent:#2f5fd0;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
      --r:10px;--r-sm:7px;--t:170ms cubic-bezier(.2,.7,.3,1);
      --sh1:0 1px 2px rgba(20,20,18,.06),0 1px 3px rgba(20,20,18,.05);
      --sh2:0 6px 16px rgba(20,20,18,.10),0 2px 5px rgba(20,20,18,.07);
      --sh3:0 14px 30px rgba(20,20,18,.16),0 4px 8px rgba(20,20,18,.08);
      --tint:rgba(47,95,208,.09);--tint-w:rgba(154,106,0,.11);--ring:rgba(47,95,208,.28)}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#e8e8e4;--dim:#9a9a94;--line:#2c2e33;
      --card:#1d1f23;--sunk:#141518;--ok:#5fd39b;--warn:#e0b050;--bad:#f08a8a;--accent:#7aa2f7;
      --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 6px 18px rgba(0,0,0,.5);--sh3:0 16px 34px rgba(0,0,0,.6);
      --tint:rgba(122,162,247,.14);--tint-w:rgba(224,176,80,.14);--ring:rgba(122,162,247,.4)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,sans-serif;
     margin:0;padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:20px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.pill{font:11px/1 var(--mono);padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.mock{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
nav{display:flex;gap:2px;margin:14px 0 18px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:6px 12px;
  font:inherit;color:var(--dim);cursor:pointer;transition:background var(--t),color var(--t),border-color var(--t)}
nav button:hover{color:var(--fg);background:var(--tint)}
nav button[aria-selected=true]{background:var(--card);border-color:var(--line);color:var(--fg);
  font-weight:600;box-shadow:var(--sh1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh1)}
.card h3{margin:0 0 8px;font-size:13px;font-weight:650;letter-spacing:.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=password],textarea{flex:1;min-width:0;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font:inherit;transition:border-color var(--t),box-shadow var(--t)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;
  border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input[type=text]{min-width:200px}
textarea{font:12.5px/1.5 var(--mono);width:100%;min-height:260px}
button.go{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:9px 16px;
  font:inherit;font-weight:600;cursor:pointer;box-shadow:var(--sh1);transition:filter var(--t),box-shadow var(--t),transform var(--t)}
button.go:hover:not(:disabled){filter:brightness(1.08);box-shadow:var(--sh2);transform:translateY(-1px)}
button.go:active:not(:disabled){transform:translateY(0)}
button.go:disabled{opacity:.45;cursor:not-allowed}
button.sm{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font:inherit;cursor:pointer;transition:background var(--t),border-color var(--t),color var(--t)}
button.sm:hover{background:var(--tint);border-color:var(--accent)}
button.sm.yes:hover{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:var(--ok)}
button.sm.no:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
button.sm.yes{border-color:var(--ok);color:var(--ok)}
button.sm.no{border-color:var(--bad);color:var(--bad)}
code,pre{font-family:var(--mono)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;
  overflow-x:auto;font-size:12.5px;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.step{display:inline-block;padding:3px 9px;border-radius:6px;border:1px solid var(--line);
  margin:2px 4px 2px 0;font:12px/1.4 var(--mono)}
.step.done{border-color:var(--ok);color:var(--ok)}
.step.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.note{font-size:12.5px;color:var(--dim);margin-top:6px}
.tfilt{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.tfilt label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--dim)}
.tfilt select,.tfilt input[type=date]{padding:5px 7px;font:inherit;font-size:13px;min-width:120px;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);
  color-scheme:light dark}
.tfilt button.sm[aria-pressed=true]{border-color:var(--accent);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tsum{padding:10px 4px 6px}
.tblk{margin-top:12px}
.tblk h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.tblk p{margin:2px 0}.tblk ul{margin:2px 0;padding-left:18px}
.scroll{overflow-x:auto}
ul.tight{margin:6px 0;padding-left:20px}
.sec{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px;padding-top:16px;
  border-top:3px solid var(--fg);font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em}
.sec:first-of-type{margin-top:8px}
.sec em{font:400 12px/1 system-ui;color:var(--dim);text-transform:none;letter-spacing:0;
  font-style:normal;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
label.chk{display:inline-flex;align-items:center;gap:5px;margin:0 10px 4px 0;font:12.5px var(--mono)}
textarea.p{min-height:92px}
textarea.prose{font:13.5px/1.6 system-ui,-apple-system,sans-serif}
.danger{border-color:var(--bad)}
.badge{font:10.5px/1 var(--mono);padding:3px 6px;border-radius:5px;border:1px solid var(--warn);
  color:var(--warn);margin-left:6px}
.saved{color:var(--ok);font-size:12px;margin-left:8px}
/* ---------- execution diagram ---------- */
svg.g{width:100%;height:auto;display:block;overflow:visible;margin:0 auto}
svg.g text{font:11.5px/1 ui-monospace,Menlo,monospace;fill:var(--fg);font-weight:600;letter-spacing:-.01em}
svg.g .lbl{font-size:9.5px;fill:var(--dim);font-weight:400;letter-spacing:0}
svg.g g.n rect{fill:var(--card);stroke:var(--line);stroke-width:1.25;
  transition:stroke var(--t),filter var(--t),opacity var(--t)}
svg.g g.n{filter:drop-shadow(0 1px 1.5px rgba(20,20,18,.10));transition:filter var(--t)}
svg.g g.n:hover{filter:drop-shadow(0 5px 12px rgba(20,20,18,.20))}
svg.g g.n rect.bar{stroke:none;fill:var(--dim);opacity:.85}
svg.g g.n.ag rect.card{stroke:var(--accent)}
svg.g g.n.ag rect.bar{fill:var(--accent)}
svg.g g.n.post rect.card{stroke:var(--ok)}
svg.g g.n.post rect.bar{fill:var(--ok)}
svg.g g.n.gate rect.card{stroke:var(--warn);stroke-dasharray:5 3}
svg.g g.n.gate rect.bar{fill:var(--warn)}
svg.g g.n.off rect{stroke:var(--line);stroke-dasharray:3 3;opacity:.5}
svg.g g.n.off text{opacity:.6}
svg.g g.n.term rect{fill:var(--sunk);stroke:var(--line)}
svg.g path,svg.g line{stroke:var(--dim);fill:none;stroke-width:1.35;stroke-linecap:round;
  opacity:.75;transition:opacity var(--t),stroke-width var(--t)}
svg.g .req{stroke:var(--warn);stroke-dasharray:4 3;opacity:.9}
svg.g .rail{opacity:.42;stroke-width:1.15}
svg.g:hover .rail{opacity:.6}
svg.g .yes{stroke:var(--ok);opacity:.95}
svg.g .no{stroke:var(--bad);opacity:.95}
@media(prefers-color-scheme:dark){
  svg.g g.n{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  svg.g g.n:hover{filter:drop-shadow(0 6px 14px rgba(0,0,0,.65))}}

/* ---------- flow editor: draggable chips ---------- */
.lane{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;min-height:58px;padding:9px;
  border:1.5px dashed var(--line);border-radius:var(--r);background:var(--sunk);
  transition:border-color var(--t),background var(--t),box-shadow var(--t)}
.lane.over{border-color:var(--accent);border-style:solid;background:var(--tint);
  box-shadow:inset 0 0 0 1px var(--ring)}
.lane .empty{color:var(--dim);font-size:12.5px;align-self:center;padding:0 4px}
.chip{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 13px;
  border-radius:9px;border:1px solid var(--accent);background:var(--card);cursor:grab;
  user-select:none;min-width:112px;box-shadow:var(--sh1);
  transition:transform var(--t),box-shadow var(--t),border-color var(--t),opacity var(--t)}
.chip::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;border-radius:9px 0 0 9px;
  background:var(--accent);opacity:.85;transition:opacity var(--t)}
.chip:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.chip:active{cursor:grabbing}
.chip.off{border-color:var(--line);border-style:dashed;opacity:.72}
.chip.off::before{background:var(--dim);opacity:.4}
.chip.dragging{opacity:.45;transform:scale(.97) rotate(-1.2deg);box-shadow:var(--sh3)}
.chip.ins-before{box-shadow:-3px 0 0 var(--accent),var(--sh1)}
.chip.ins-after{box-shadow:3px 0 0 var(--accent),var(--sh1)}
.chip b{font:12.5px/1.3 var(--mono);font-weight:650;letter-spacing:-.01em}
.chip small{font-size:10.5px;color:var(--dim)}

/* ---------- prerequisite editor ---------- */
svg.dep{width:100%;height:auto;display:block;touch-action:none;overflow:visible;margin:0 auto}
svg.dep g.dn{cursor:pointer;transition:filter var(--t)}
svg.dep g.dn rect.bar{stroke:none;fill:var(--accent);opacity:.9}
svg.dep g.dn rect.card{fill:var(--card);stroke:var(--accent);stroke-width:1.3;
  transition:stroke var(--t),stroke-width var(--t),fill var(--t)}
svg.dep g.dn:hover{filter:drop-shadow(0 4px 10px rgba(20,20,18,.18))}
svg.dep g.dn:hover rect.card{stroke-width:2}
svg.dep g.dn.sel rect.card{stroke:var(--warn);stroke-width:2.4;fill:var(--tint-w)}
svg.dep g.dn.sel rect.bar{fill:var(--warn)}
svg.dep g.dn.cand rect.card{stroke-dasharray:5 3}
svg.dep g.dn.cand:hover rect.card{fill:var(--tint);stroke-dasharray:none}
svg.dep text{font:11.5px var(--mono);font-weight:600;fill:var(--fg);pointer-events:none}
svg.dep .sub{font-size:9.5px;font-weight:400;fill:var(--dim)}
svg.dep path.dep{stroke:var(--warn);stroke-dasharray:5 3;fill:none;stroke-width:1.6;
  stroke-linecap:round;opacity:.85;transition:opacity var(--t),stroke-width var(--t)}
svg.dep g.edge:hover path.dep{opacity:1;stroke-width:2.6;stroke-dasharray:none}
svg.dep path.dep.bad{stroke:var(--bad);opacity:1}
svg.dep path.hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.alert{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);
  border-radius:var(--r-sm);padding:9px 12px;margin-top:10px;font-size:12.5px}
.alert b{color:var(--bad)}
/* Conversation thread. The bottom line is the only thing rendered at full size —
   everything else is one line until somebody asks for it. */
#thread{margin-bottom:12px}
#thread:empty{display:none}
.turn{border-top:1px solid var(--line);padding:12px 0}
#thread .turn:first-child{border-top:0;padding-top:0}
.ask{font-size:13.5px;color:var(--fg);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.ask b{font:10.5px/1.5 var(--mono);color:var(--dim);flex:none;text-transform:uppercase;
  letter-spacing:.06em}
.say{font-size:14px;line-height:1.55;margin:0}
.tmeta{font:11px/1.5 var(--mono);color:var(--dim);margin-top:6px;display:flex;
  gap:10px;flex-wrap:wrap;align-items:center}
.kind{border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:10px}
.kind.run{color:var(--accent);border-color:var(--accent)}
.kind.follow_up{color:var(--ok);border-color:var(--ok)}
.kind.error{color:var(--bad);border-color:var(--bad)}
.kind.chat{color:var(--warn);border-color:var(--warn)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
details.more{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-sm)}
details.more+details.more{margin-top:5px}
details.more>summary{cursor:pointer;padding:7px 10px;font-size:12.5px;color:var(--dim);
  list-style:none;display:flex;gap:8px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'▶';font-size:8px;transition:transform .12s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary:hover{color:var(--fg)}
details.more .body{padding:0 12px 10px 12px;font-size:13px}
details.more .body ul{margin:4px 0 0;padding-left:18px}
.working{font:12px/1.5 var(--mono);color:var(--dim)}
/* BiDi. <bdi> already isolates, but the CHROME around it must stay left-to-right or a
   Hebrew answer flips the label, the badge and the token counts that sit beside it.
   Pinning direction here rather than on <html> keeps the console LTR while each piece
   of operator or model text picks its own. */
.ask,.say,details.more .body{unicode-bidi:isolate}
.ask b,.tmeta,.kind,#convmeta,.working,.mono,details.more>summary{direction:ltr;
  unicode-bidi:isolate}
/* An RTL question should sit against the right edge of its own line, not be dragged
   back by the LTR "you" label beside it. No :dir() rules needed: text-align defaults to
   `start`, which follows whatever dir="auto" resolved to. */
.ask span{flex:1;min-width:0}
#attbar{margin-top:6px}
.attchip{border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;margin-top:5px;
  font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.attchip.error{border-color:var(--bad)}
.attchip details.more{flex-basis:100%;margin-top:2px}
.attsent{margin:-2px 0 8px}
.attsent details.more{margin-top:4px}
.attimg{max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:var(--r-sm);margin:4px 0}
/* The permission ask. Warn-coloured rather than bad: nothing is broken, something is
   withheld — and it is an action for the reader, not a failure of the run. */
.askperm{margin-top:10px;border:1px solid var(--warn);border-left-width:3px;
  border-radius:var(--r-sm);padding:9px 12px;
  background:color-mix(in srgb,var(--warn) 7%,transparent)}
.askperm p{margin:0;font-size:13px}
.askperm b{color:var(--warn)}
.askperm ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.askperm li{margin:2px 0}
.askperm .note{margin-top:7px}
/* Credentials live in the header now: set once, then out of the way. The panel hangs
   under the pill rather than sitting in the page, so it never competes with the thing
   the tab is actually for. */
header{position:relative}
button.pill{cursor:pointer;background:transparent;font-family:var(--mono)}
button.pill:hover{color:var(--fg);border-color:var(--fg)}
button.pill[aria-expanded="true"]{color:var(--fg);border-color:var(--fg)}
#creds,#modemenu,#modelmenu{position:absolute;top:calc(100% + 6px);z-index:30;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh2);padding:14px}
#creds{right:0;width:min(520px,92vw)}
#modemenu{left:0;width:min(440px,92vw);padding:6px}
#modelmenu{left:0;width:min(420px,92vw);padding:6px;max-height:62vh;overflow:auto}
#modelmenu .note{padding:6px 11px 2px;margin:0}
#creds[hidden],#modemenu[hidden],#modelmenu[hidden]{display:none}
#creds h3{margin:0 0 8px}
/* Each option carries the consequence that distinguishes it — recorded fixtures versus
   the real bench. That fact used to live in the pill as the word "mock"; it has to stay
   somewhere the reader meets it at the moment of choosing, or the safer-sounding label
   hides the less safe behaviour. */
.modeopt{display:block;width:100%;text-align:left;background:transparent;border:0;
  border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;color:var(--fg);font:inherit}
.modeopt:hover{background:var(--bg)}
.modeopt b{display:block;font-size:13px;margin-bottom:2px}
.modeopt.on b::after{content:' ✓';color:var(--ok)}
.modeopt span{display:block;font-size:12px;color:var(--dim);line-height:1.45}
.modeopt.on{background:var(--bg);box-shadow:inset 2px 0 0 var(--accent)}
/* A required field has to look different from an optional one BEFORE the save is
   refused, which is the whole reason the hardware type kept getting missed. */
.fd .req{font:9.5px/1 var(--mono);color:var(--warn);border:1px solid var(--warn);
  border-radius:4px;padding:2px 4px;margin-left:6px;font-weight:400;letter-spacing:.02em}
.fd input.missing{border-color:var(--warn)}
button.sm:disabled{opacity:.45;cursor:not-allowed}
button.sm:disabled:hover{background:var(--bg);border-color:var(--line)}

/* ---------- dense field grid ---------- */
.fg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px 10px}
.fd{display:flex;flex-direction:column;gap:3px;min-width:0}
.fd>span{font-size:10.5px;color:var(--dim);letter-spacing:.02em;text-transform:uppercase;font-weight:600}
.fd input,.fd select{width:100%;min-width:0;padding:7px 9px;font-size:13px}
.comp{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;
  background:var(--card);transition:border-color var(--t),box-shadow var(--t)}
.comp:hover{border-color:var(--ring);box-shadow:var(--sh1)}
.comp>header{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.comp>header b{font:12.5px var(--mono);font-weight:650}
.comp>header .grow{margin-left:auto}
.rolet{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;
  border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.rolet.sensor{border-color:var(--accent);color:var(--accent)}
.rolet.compute{border-color:var(--ok);color:var(--ok)}
.rolet.network{border-color:var(--warn);color:var(--warn)}
.rolet.laptop,.rolet.power,.rolet.other{border-color:var(--dim)}
.pwrow{display:flex;gap:5px;align-items:center}
.pwrow input{flex:1;min-width:0}
.sym{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.sym input{flex:1}
.ro{opacity:.62}
.ro input,.ro textarea,.ro select{cursor:not-allowed}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font:inherit;transition:border-color var(--t),box-shadow var(--t)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
fieldset>input[type=text]{width:100%;min-width:0}
legend{font:11px/1 var(--mono);color:var(--dim);padding:0 6px;text-transform:uppercase;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center}
.kv label{font-size:12px;color:var(--dim)}
.kv input,.kv select{width:100%;min-width:0}
.hint{font-size:12px;color:var(--dim);margin:8px 0 4px}
/* system model: last on the page, folded away, read-only */
details.sysmodel{padding:10px 14px}
details.sysmodel>summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  cursor:pointer;list-style:none;font-size:12.5px}
details.sysmodel>summary::-webkit-details-marker{display:none}
details.sysmodel>summary::before{content:'▶';color:var(--dim);font-size:10px;
  transition:transform var(--t)}
details.sysmodel[open]>summary::before{transform:rotate(90deg)}
details.sysmodel>summary b{font-size:13px;font-weight:650}
details.sysmodel>summary .dim{margin-left:auto;font:11px var(--mono)}
details.sysmodel pre{max-height:340px;overflow:auto;font-size:11.5px;line-height:1.5}
/* collapsible entries on Agents & permissions */
.ent header{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  margin:0 0 2px}
.ent header b{font:13px var(--mono);font-weight:650;letter-spacing:-.01em}
.ent header .grow{margin-left:auto}
.ent.ro header{cursor:default}

  .fg>*{grid-column:span 4!important}}
</style></head><body><div class="wrap">

<header>
  <h1>support-agent console</h1>
  <button class="pill mock" id="mode" aria-expanded="false">…</button>
  <div id="modemenu" hidden></div>
  <button class="pill" id="model" aria-expanded="false">…</button>
  <div id="modelmenu" hidden></div>
  <button class="pill" id="keystate" aria-expanded="false">…</button>
  <div id="creds" hidden></div>
</header>

<nav id="tabs">
  <button data-t="run" aria-selected="true">Run</button>
  <button data-t="chat" aria-selected="false">Live with chat <span id="chatcount"></span></button>
  <button data-t="approvals" aria-selected="false">Approvals <span id="apcount"></span></button>
  <button data-t="traces" aria-selected="false">Traces</button>
  <button data-t="kb" aria-selected="false">Knowledge</button>
  <button data-t="perms" aria-selected="false">Agents &amp; permissions</button>
  <button data-t="inv" aria-selected="false">Inventory &amp; systems</button>
</nav>

<section id="run">
  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h3 style="margin:0">Diagnose</h3><span class="grow"></span>
      <span class="note mono" id="convmeta"></span>
      <button class="sm" id="newconv" hidden>New conversation</button>
    </div>
    <div class="row">
      <select id="qsys" title="the system this conversation is about — 'named in the message' picks it from what you write, and the conversation keeps it"
        style="max-width:190px"><option value="">system: named in the message</option></select>
      <input type="text" id="q" dir="auto" placeholder="e.g. the acoustic sensor shows no tracks">
      <button class="sm" id="attach" type="button"
        title="attach a screenshot, PDF or log — you can also paste a screenshot or drop files here">📎 Attach</button>
      <input type="file" id="attfile" multiple hidden
        accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.txt,.log,.json,.yaml,.yml,.md,.csv,.xml,.ini,.conf,.cfg,.toml,.out,.err">
      <button class="go" id="go">Send</button>
    </div>
    <div id="attbar"></div>
    <!-- Rewritten by renderMode(): in chat mode "no device touched" is FALSE, and a
         stale reassurance is worse than none. -->
    <p class="note" id="modenote"></p>
    <p class="note bad" id="credhint" hidden></p>
    <p class="note" id="usage"></p>
    <!-- Below the box, newest first: the input stays put as the conversation grows, so
         it never walks down the page and the last answer is the one you are looking at. -->
    <div id="thread"></div>
  </div>
</section>

<section id="chat" hidden></section>
<section id="approvals" hidden></section>
<section id="traces" hidden></section>
<section id="kb" hidden></section>
<section id="perms" hidden></section>
<section id="inv" hidden></section>

</div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// BIDI ISOLATION. Tickets arrive in Hebrew, the system they describe is named in
// English, and the two get interpolated into one LTR template. Without isolation the
// Unicode bidi algorithm resolves the whole line as one paragraph, so a Hebrew sentence
// ending in "PID 291846." renders the full stop at the wrong end, an English node name
// inside a Hebrew clause drags its neighbouring punctuation across, and a Hebrew answer
// beside an English label reorders the label.
//
// `dir="auto"` gives each value its OWN paragraph direction from its first strong
// character; `unicode-bidi: isolate` (see the stylesheet) stops it reordering anything
// around it. Applied per VALUE rather than per block, because a block is exactly the
// thing that holds both languages at once.
// TWO CASES, and they need opposite treatment:
//
//  1. The value IS the whole element (a question, an answer, one evidence item).
//     `dir="auto"` on that element resolves direction from the text AND aligns it, so
//     a Hebrew paragraph sits against the right edge. Do NOT wrap it in <bdi>:
//     dir="auto" skips isolated descendants when it looks for the first strong
//     character, so a <bdi> wrapper makes the paragraph fall back to LTR and the
//     Hebrew ends up left-aligned with a ragged gap down the right.
//
//  2. The value is EMBEDDED beside other text (`what — why`, `escalate — reason`).
//     There <bdi> is exactly right: it stops the value reordering its neighbours.
const ml=s=>esc(s).replace(/\n/g,'<br>');
const bdi=s=>`<bdi>${esc(s)}</bdi>`;
const api=(p,o)=>fetch('/api'+p,o).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()});
var META=null, TIMER=null;

const TABS=['run','chat','approvals','traces','kb','perms','inv'];

// The open tab lives in the URL hash rather than in storage. Surviving a refresh is the
// point, but the hash also makes a tab linkable and gives back/forward for free — and
// it is visible, so where you are is never a hidden preference you cannot explain.
var _hashLock=false;

function selectTab(name,push){
  document.querySelectorAll('#tabs button').forEach(x=>
    x.setAttribute('aria-selected',x.dataset.t===name?'true':'false'));
  TABS.forEach(t=>{const el=$('#'+t); if(el)el.hidden=(t!==name);});
  if(push!==false&&typeof location!=='undefined'&&location.hash!=='#'+name){
    _hashLock=true;                       // our own write must not re-enter via hashchange
    location.hash=name;
    setTimeout(()=>{_hashLock=false;},0);
  }
  ({chat:loadChat,approvals:loadApprovals,traces:loadTraces,kb:loadKb,
    inv:loadInv,perms:loadPerms}[name]||(()=>{}))();
}

// Which tab a fresh load should open: the hash if it names one that exists and the
// current mode actually offers, else that mode's own tab. A stale #run bookmarked in
// token mode must not strand a chat-mode operator on a hidden section.
function tabFromHash(){
  const want=(typeof location!=='undefined'?location.hash:'').replace(/^#/,'');
  const btn=[...document.querySelectorAll('#tabs button')].find(b=>b.dataset.t===want);
  if(TABS.includes(want)&&(!btn||!btn.hidden))return want;
  return MODE==='chat'?'chat':'run';
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>selectTab(b.dataset.t));
if(typeof window!=='undefined'&&window.addEventListener)
  window.addEventListener('hashchange',()=>{ if(!_hashLock)selectTab(tabFromHash(),false); });

$('#keystate').onclick=()=>toggleCreds();
$('#mode').onclick=()=>toggleMode();
$('#model').onclick=()=>toggleModel();
// Clicking anywhere else closes it. Without this the panel covers the tab bar until
// somebody thinks to click the pill a second time.
document.addEventListener('click',e=>{
  const box=$('#creds');
  if(!box||box.hidden)return;
  if(!box.contains(e.target)&&e.target!==$('#keystate'))toggleCreds(false);
});
document.addEventListener('click',e=>{
  const box=$('#modemenu');
  if(!box||box.hidden)return;
  if(!box.contains(e.target)&&e.target!==$('#mode'))toggleMode(false);
});
document.addEventListener('click',e=>{
  const box=$('#modelmenu');
  if(!box||box.hidden)return;
  if(!box.contains(e.target)&&e.target!==$('#model'))toggleModel(false);
});

api('/meta').then(m=>{
  META=m;
  fillSystemPicker(m.systems);
  // m.mode is AGENT_MODE, a server-side safety property, not the answering mode this
  // pill selects. It is stated inside the token option instead of on the pill face.
  MODES.token.blurb='The graph pipeline answers. Spends API tokens. Tools read recorded '
    +`fixtures (AGENT_MODE=${esc(m.mode)}) — never the real bench.`;
  renderMode();
  // After renderMode, because which tabs exist depends on the mode: reopening #traces
  // is fine in either, reopening #run is not when chat mode has hidden it.
  selectTab(tabFromHash());
  MODELS.current=m.model;
  $('#model').textContent=m.model;
  loadModels();
  renderCreds(m.credentials||{ready:false});
  loadUsage();
  loadApprovals();
});

// ---- credentials -----------------------------------------------------------
// The key is never echoed back: the server sends a mask, and the input is only ever
// written to, never populated from the response.
function renderCreds(c){
  META.credentials=c;
  const k=$('#keystate');
  k.textContent=(c.ready?('auth: '+c.source):'no credentials')+(c.warning?' \u26a0':'');
  k.className='pill'+(c.ready?'':' bad');
  k.title=c.warning||'click to set a key';
  $('#go').disabled=!c.ready;
  const hint=$('#credhint');
  if(hint){
    hint.hidden=c.ready;
    hint.innerHTML=c.ready?'':
      'Run needs Anthropic credentials. <a href="#" onclick="jumpToCreds();return false">Set a key &uarr;</a>';
  }
  $('#creds').innerHTML=`
    <h3>${c.ready?'Anthropic credentials':'Not ready — no Anthropic credentials'}</h3>
    ${c.ready
      ? `<p class="note">Resolving from <b>${esc(c.source)}</b>.${
           c.masked?` Stored key <span class="mono">${esc(c.masked)}</span>.`:''}</p>`
      : `<p class="note">The SDK looks for <code>ANTHROPIC_API_KEY</code>, then
           <code>ANTHROPIC_AUTH_TOKEN</code>, then an OAuth profile from
           <code>ant auth login</code>, then workload identity federation — any one is
           enough. Put one in <code>.env</code>, export it, or paste a key below.</p>`}
    ${c.warning?`<p class="note bad">${esc(c.warning)}</p>`:''}
    <div class="row" style="margin-top:8px">
      <input type="password" id="apikey" placeholder="sk-ant-api03-…" autocomplete="off">
      <button class="go" id="savekey">${c.stored?'Replace key':'Save key'}</button>
      ${c.stored?'<button id="clearkey">Clear</button>':''}
    </div>
    <p class="note">Stored in <code>secrets.local.env</code> (mode 0600, gitignored), never
      in the registry. Takes effect immediately — no restart.</p>
    <p class="note warn">${esc(c.localhost_only||'')}</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:11px 0">
    <p class="note" id="lifetime"></p>`;
  paintLifetime();
  $('#savekey').onclick=saveKey;
  if($('#clearkey'))$('#clearkey').onclick=clearKey;
  $('#apikey').onkeydown=e=>{if(e.key==='Enter')saveKey();};
}

// The panel is closed by default — a key is set once and then never touched. It opens
// from the pill, and from the hint beside a disabled Run button.
function toggleCreds(open){
  const box=$('#creds'), pill=$('#keystate');
  const show=open===undefined?box.hidden:open;
  box.hidden=!show;
  pill.setAttribute('aria-expanded',show?'true':'false');
  if(show){const f=$('#apikey'); if(f)f.focus();}
}
function jumpToCreds(){ toggleCreds(true); }

async function saveKey(){
  const el=$('#apikey'), key=el.value.trim();
  if(!key)return;
  $('#savekey').disabled=true;
  try{ renderCreds(await api('/credentials',{method:'PUT',
         headers:{'content-type':'application/json'},body:JSON.stringify({key})})); }
  catch(e){ $('#savekey').disabled=false;
            alert('Could not store that key: '+e.message); return; }
  el.value='';
}

async function clearKey(){
  if(!confirm('Remove the stored Anthropic key from secrets.local.env?'))return;
  try{ renderCreds(await api('/credentials',{method:'DELETE'})); }
  catch(e){ alert('Could not clear the key: '+e.message); }
}

// ---- token usage -----------------------------------------------------------
const nTok=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n??0);
const tokLine=u=>`in ${nTok(u?.input)} · out ${nTok(u?.output)} · cache read ${nTok(u?.cache_read)}`;
var LIFETIME=null;

async function loadUsage(){
  LIFETIME=await api('/usage').catch(()=>null);
  paintLifetime();
}

// The Run tab shows THIS conversation and nothing else. What the install has spent
// since it was set up is install-level bookkeeping, not something you need in front of
// you while diagnosing — it lives in the credentials panel with the other
// set-once-and-forget facts.
function paintUsage(sessionUsage){
  $('#usage').innerHTML=sessionUsage?('this session &nbsp;'+tokLine(sessionUsage)):'';
}

function paintLifetime(){
  const el=$('#lifetime');
  if(!el)return;                       // the panel is only in the DOM once rendered
  el.innerHTML=LIFETIME
    ? `Recorded usage &nbsp;${tokLine(LIFETIME.lifetime)} &nbsp;across `
      +`${LIFETIME.sessions} session${LIFETIME.sessions===1?'':'s'}. `
      +`<span class="dim">Cache reads are part of the input above, billed at about a `
      +`tenth. Summed from this machine's traces — not an account balance.</span>`
    : '';
}

// ---- model ------------------------------------------------------------------
// Which model answers is an install-level setting, so it is persisted server-side in
// overrides.json and written to the audit log — unlike the answering mode, which is a
// per-operator view preference and lives in the browser.
var MODELS={models:[],source:'',current:'',default:''};

async function loadModels(refresh){
  MODELS=await api('/models'+(refresh?'?refresh=true':'')).catch(()=>MODELS);
  renderModels();
}

function renderModels(){
  const cur=MODELS.current||'…';
  $('#model').textContent=cur;
  $('#model').title='click to change the model';
  const rows=(MODELS.models||[]).map(m=>{
    const on=m.id===cur;
    const ctx=m.max_input_tokens?`${nTok(m.max_input_tokens)} context`:'';
    return `<button class="modeopt ${on?'on':''}" onclick="setModel('${esc(m.id)}')">
      <b>${esc(m.display_name||m.id)}</b>
      <span class="mono">${esc(m.id)}${ctx?' · '+ctx:''}</span></button>`;
  }).join('');
  // Say where the list came from. A fallback list can be missing a model the account
  // actually has, and an operator hunting for one needs to know that is why.
  const note=MODELS.source==='fallback'
    ? '<p class="note warn">Could not read this account\'s models — showing the '
     +`built-in list. ${esc(MODELS.why||'')}</p>`
    : '<p class="note">Switching invalidates the prompt cache: the next run pays full '
     +'price for the system prompt once.</p>';
  $('#modelmenu').innerHTML=note+rows
    +(MODELS.default&&MODELS.current!==MODELS.default
      ? `<button class="modeopt" onclick="clearModel()"><b>Reset</b>
           <span>Back to ${esc(MODELS.default)}.</span></button>` : '');
}

async function setModel(id){
  if(id===MODELS.current){toggleModel(false);return;}
  try{
    await api('/model',{method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({model:id})});
    MODELS.current=id;
  }catch(e){ alert('Could not switch model: '+e.message); }
  toggleModel(false); renderModels();
}

async function clearModel(){
  try{ MODELS.current=(await api('/model',{method:'DELETE'})).current; }
  catch(e){ alert(e.message); }
  toggleModel(false); renderModels();
}

function toggleModel(open){
  const box=$('#modelmenu'), pill=$('#model');
  const show=open===undefined?box.hidden:open;
  box.hidden=!show;
  pill.setAttribute('aria-expanded',show?'true':'false');
}

// ---- answering mode --------------------------------------------------------
// Two ways to answer the same question, and they differ in what they can REACH, which
// is why each option states it rather than leaving it to a word on the pill:
//
//   token  the graph pipeline. Spends API tokens. Tools read tests/fixtures/ — the
//          console forces AGENT_MODE=mock, so this can never touch the bench.
//   chat   a ticket queued to disk, picked up in the Claude Code session. No API
//          tokens, but the checks it runs are against the REAL hardware, read-only.
//
// A per-operator UI preference, so it lives in the browser. AGENT_MODE is a separate,
// server-side safety property and is not what this switches.
var MODE='token';
try{ MODE=localStorage.getItem('answerMode')||'token'; }catch(e){}

// `var`, not `const`: the meta handler rewrites the token blurb once AGENT_MODE is known,
// and the render harness reaches it the same way it reaches FLOW and KBDOC.
var MODES={
  token:{label:'token mode',
    title:'Token mode',
    blurb:'The graph pipeline answers. Spends API tokens. Tools read recorded '
         +'fixtures — never the real bench.'},
  chat:{label:'chat mode',
    title:'Chat mode',
    blurb:'Queues a ticket to disk for the Claude Code session; type <code>go</code> '
         +'there to pick it up. No API tokens, but its read-only checks run against '
         +'the REAL hardware.'},
};

function renderMode(){
  const m=MODES[MODE]||MODES.token;
  const pill=$('#mode');
  pill.textContent=m.label;
  pill.className='pill'+(MODE==='chat'?' warn':' mock');
  pill.title='click to change how questions are answered';
  $('#modemenu').innerHTML=Object.entries(MODES).map(([k,v])=>
    `<button class="modeopt ${k===MODE?'on':''}" onclick="setMode('${k}')">
       <b>${esc(v.title)}</b><span>${v.blurb}</span></button>`).join('');
  $('#q').placeholder=MODE==='chat'
    ? 'describe the fault for the Claude Code session'
    : 'e.g. the acoustic sensor shows no tracks';
  // Run and Live-with-chat are the same job done two ways, so only the one that
  // matches the mode is offered. The other is hidden rather than disabled: a tab you
  // can click into and then cannot use is worse than one that is not there.
  const owner={run:'token',chat:'chat'};
  const tabs=[...document.querySelectorAll('#tabs button')];
  tabs.forEach(b=>{const need=owner[b.dataset.t]; if(need)b.hidden=(need!==MODE);});
  // If the switch just hid the tab you were looking at, move to its counterpart —
  // otherwise the page goes blank with every tab deselected.
  const cur=tabs.find(b=>b.getAttribute('aria-selected')==='true');
  if(cur&&cur.hidden)selectTab(MODE==='chat'?'chat':'run');

  const note=$('#modenote');
  if(note)note.innerHTML=MODE==='chat'
    ? 'Queued for the Claude Code session — nothing watches this queue, so type '
     +'<code>go</code> there to pick it up. Its checks are read-only but they run '
     +'against the <b>real hardware</b>, not fixtures.'
    : 'Runs against recorded fixtures. Live mode stays a deliberate command-line act. '
     +'Follow-up questions are answered from evidence already gathered — no tools, no '
     +'device touched.';
}

function setMode(k){
  if(!MODES[k])return;
  MODE=k;
  try{ localStorage.setItem('answerMode',k); }catch(e){}
  toggleMode(false);
  renderMode();
  // The two modes keep separate threads: a bridge ticket is not a conversation turn,
  // and splicing them into one history would make the token counts and the routing
  // read as if they applied to both.
  renderThread(threadFor());
}

function toggleMode(open){
  const box=$('#modemenu'), pill=$('#mode');
  const show=open===undefined?box.hidden:open;
  box.hidden=!show;
  pill.setAttribute('aria-expanded',show?'true':'false');
}

// ---- conversation ----------------------------------------------------------
// A conversation is a list of turns, each its own fresh graph session. The transcript
// lives on the server so a reload does not lose it; this only renders.
var CONV=null, TURN_OPEN=new Set();   // keys are `${turnIndex}:${section}`
// NOT `OPEN` — the permissions tab already owns that name, and a second
// `var OPEN` at the same scope silently replaces this Set with its object.

$('#go').onclick=send;
$('#q').onkeydown=e=>{if(e.key==='Enter')send();};
$('#attach').onclick=()=>$('#attfile').click();
$('#attfile').onchange=e=>{addFiles(e.target.files); e.target.value='';};
$('#q').onpaste=e=>{const fs=[...(e.clipboardData?.files||[])];
  if(fs.length){e.preventDefault(); addFiles(fs);}};
$('#run').ondragover=e=>e.preventDefault();
$('#run').ondrop=e=>{e.preventDefault(); addFiles(e.dataTransfer?.files);};
$('#newconv').onclick=()=>{CONV=null;TURN_OPEN=new Set();$('#thread').innerHTML='';
  $('#convmeta').textContent='';$('#newconv').hidden=true;$('#q').focus();};

// Chat-mode tickets, newest last. Held here rather than on the server because the
// bridge already owns them — this is only which ones this tab has queued.
var CHAT_IDS=[], CHAT_CACHE={};

function threadFor(){
  if(MODE!=='chat')return LAST_CONV||{turns:[],totals:{}};
  const turns=CHAT_IDS.map(id=>CHAT_CACHE[id]).filter(Boolean);
  return {turns,totals:{turns:turns.length,runs:turns.length,follow_ups:0,
                        duration_s:0,input:0,output:0,cache_read:0},
          status:'idle'};
}
var LAST_CONV=null;

// The system picker. Empty means "whatever the message names" — the server asks when
// that is ambiguous rather than guessing, so the empty choice is always safe.
function fillSystemPicker(list){
  const sel=$('#qsys'); if(!sel)return;
  const keep=sel.value;
  sel.innerHTML='<option value="">system: named in the message</option>'
    +(list||[]).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if((list||[]).includes(keep)) sel.value=keep;
}

// ---- attachments in the Diagnose box
// Each file is uploaded and turned into text AS SOON AS it is added, not on Send: the
// description is what the agents will read, so it is shown here first — a screenshot
// the model misread is dropped before it costs a run.
var ATT=[];                 // {key, name, state: describing|ready|error, rec, error}
var ATT_N=0;
const ATT_KIND={image:'image',pdf:'PDF',text:'text'};
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error);
  r.readAsDataURL(f);});
function attName(f){
  // A pasted screenshot arrives as "image.png"; several of those are unreadable apart.
  if(/^image\.(png|jpe?g|gif|webp)$/i.test(f.name||'')){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `screenshot-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${f.name.split('.').pop()}`;
  }
  return f.name||'file';
}
async function addFiles(files){
  for(const f of [...(files||[])]){
    const a={key:++ATT_N,name:attName(f),state:'describing'};
    ATT.push(a); renderAtt();
    try{
      a.rec=await api('/attachments',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({name:a.name,media_type:f.type||'',data:await fileB64(f)})});
      a.state='ready';
    }catch(e){ a.state='error'; a.error=e.message; }
    if(ATT.includes(a)) renderAtt();
  }
}
function rmAtt(key){ ATT=ATT.filter(a=>a.key!==key); renderAtt(); }
function clearAtt(){ ATT=[]; renderAtt(); }
function renderAtt(){
  const box=$('#attbar'); if(!box)return;
  box.innerHTML=ATT.map(a=>{
    const what=a.state==='describing'?`<span class="working">${/\.(png|jpe?g|gif|webp|pdf)$/i.test(a.name)?'describing':'reading'}…</span>`
      :a.state==='error'?`<span class="bad">${esc(a.error)}</span>`
      :`<span class="dim">${ATT_KIND[a.rec.kind]||''}${a.rec.truncated?' · cut to fit':''}</span>`;
    const txt=a.state==='ready'?`<details class="more"><summary>what the agents will read</summary>
        <div class="body"><pre dir="auto">${esc(a.rec.text)}</pre></div></details>`:'';
    return `<div class="attchip ${a.state}"><span class="mono">📎 ${esc(a.name)}</span> ${what}
      <button class="sm" onclick="rmAtt(${a.key})" title="remove">×</button>${txt}</div>`;}).join('');
  $('#go').disabled=ATT.some(a=>a.state==='describing');
}
// In a turn that was sent: each attachment opens the original, with the text the
// agents read beside it.
function attList(list){
  if(!list||!list.length)return '';
  return `<div class="attsent">${list.map(a=>`<details class="more"><summary>📎
      <a href="/api/attachments/${esc(a.id)}/file" target="_blank" rel="noopener"
        onclick="event.stopPropagation()">${esc(a.name)}</a>
      <span class="dim">— ${ATT_KIND[a.kind]||''}, what the agents read</span></summary>
    <div class="body">${a.kind==='image'?`<img class="attimg" src="/api/attachments/${esc(a.id)}/file" alt="">`:''}
      <pre dir="auto">${esc(a.text||'')}</pre></div></details>`).join('')}</div>`;
}

async function send(){
  const q=$('#q').value.trim();
  if(ATT.some(a=>a.state==='describing'))return;        // Send is disabled meanwhile
  const ready=ATT.filter(a=>a.state==='ready').map(a=>a.rec);
  if(!q&&!ready.length)return;
  const ids=ready.map(a=>a.id);
  $('#go').disabled=true;
  try{
    if(MODE==='chat'){
      const r=await api('/bridge/ticket',{method:'POST',
        headers:{'content-type':'application/json'},body:JSON.stringify({question:q,attachments:ids})});
      CHAT_IDS.push(r.id);
      CHAT_CACHE[r.id]={kind:'chat',question:q,attachments:ready,id:r.id,status:r.status||'pending',
                        pending:true};
      $('#q').value=''; clearAtt();
      renderThread(threadFor());
      pollChatTurns();
      $('#go').disabled=false;
      return;
    }
    if(!CONV) CONV=(await api('/conversation',{method:'POST'})).conversation_id;
    await api('/conversation/'+CONV+'/message',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({message:q,attachments:ids,system:$('#qsys').value||null})});
    $('#q').value=''; clearAtt();
    poll();
  }catch(e){
    $('#thread').insertAdjacentHTML('afterbegin',
      `<div class="turn"><p class="say bad" dir="auto">${esc(e.message)}</p></div>`);
    $('#go').disabled=false;
  }
}

// Nothing drains the bridge automatically — a human types `go` in the chat — so this
// polls slowly and stops once every ticket has been answered.
function pollChatTurns(){
  clearInterval(TIMER);
  const tick=async()=>{
    const open=CHAT_IDS.filter(id=>CHAT_CACHE[id]?.pending);
    if(!open.length){clearInterval(TIMER);return;}
    for(const id of open){
      const s=await api('/bridge/session/'+id).catch(()=>null);
      if(!s)continue;
      CHAT_CACHE[id]={kind:'chat',question:s.attachments?(s.typed??s.question):s.question,
        attachments:s.attachments||[],id,status:s.status,
        report:s.report,commands:s.commands||[],kb_gaps:s.kb_gaps||[],notes:s.notes,
        pending:!['done','failed'].includes(s.status)};
    }
    renderThread(threadFor());
  };
  TIMER=setInterval(tick,4000); tick();
}

function poll(){ clearInterval(TIMER); TIMER=setInterval(refresh,1500); refresh(); }

async function refresh(){
  if(!CONV)return;
  const c=await api('/conversation/'+CONV).catch(()=>null); if(!c)return;
  LAST_CONV=c;
  const busy=String(c.status||'').startsWith('working');
  renderThread(c);
  paintUsage(c.totals);
  if(!busy){
    clearInterval(TIMER);
    $('#go').disabled=!(META.credentials||{}).ready;
    $('#q').focus();
    loadUsage().then(()=>paintUsage(c.totals));
    if((c.turns||[]).some(t=>t.session_id)) loadApprovals();
  }
}

const secs=n=>n>=60?`${Math.floor(n/60)}m ${Math.round(n%60)}s`:`${(n??0).toFixed(1)}s`;

// Open state is keyed by turn + section rather than left to <details>, because the
// thread re-renders on every poll and a section would otherwise snap shut under
// somebody who had just opened it.
function toggleMore(key,el){ el.open?TURN_OPEN.add(key):TURN_OPEN.delete(key); }
function more(key,label,n,body){
  if(!n)return '';
  return `<details class="more" ${TURN_OPEN.has(key)?'open':''}
    ontoggle="toggleMore('${key}',this)">
    <summary>${esc(label)} <span class="dim">(${n})</span></summary>
    <div class="body">${body}</div></details>`;
}

// The ask, at the end of the feedback and NOT collapsed. A request for permission that
// only appears when somebody expands a section is a request nobody answers — and unlike
// the evidence, it is the one part of the report that needs the reader to do something.
function permissionAsk(r){
  const need=(r.needs_permission||[]).filter(x=>x&&x.what);
  if(!need.length)return '';
  return `<div class="askperm">
    <p><b>Blocked on permissions.</b> These checks were refused, and would sharpen the
      diagnosis if granted:</p>
    <ul>${need.map(x=>`<li dir="auto">${bdi(x.what)}${
      x.why?` <span class="dim">— ${bdi(x.why)}</span>`:''}</li>`).join('')}</ul>
    <p class="note">Commands live in <code>transport.ALLOWED</code> (editable under
      <b>Agents &amp; permissions</b>); nodes and credentials live in
      <b>Inventory &amp; systems</b>.</p>
  </div>`;
}

function turnCard(t,i){
  const li=a=>(a||[]).map(x=>`<li dir="auto">${esc(x)}</li>`).join('');
  const meta=[`<span class="kind ${esc(t.kind)}">${esc((t.kind||'').replace('_',' '))}</span>`];
  if(t.kind==='run'){const n=(t.agents||[]).length; meta.push(`${n} agent${n===1?'':'s'}`);}
  if(t.duration_s!=null) meta.push(secs(t.duration_s));
  if(t.usage) meta.push(`${nTok((t.usage.input||0)+(t.usage.output||0))} tok`);
  if(t.report?.confidence) meta.push(`confidence ${esc(t.report.confidence)}`);
  if(t.why) meta.push(`<span class="dim">${bdi(t.why)}</span>`);

  let body='', extras='';
  if(t.kind==='chat'){
    // A ticket nobody has picked up yet is not a failure and not an answer — say which
    // it is, because the bridge is drained by a human typing `go`, not by a daemon.
    const r=t.report;
    meta.length=1;
    meta.push(`<span class="mono dim">${esc(t.id||'')}</span>`,
              esc(STATUS_LABEL[t.status]||t.status||'pending'));
    body=r?`<p class="say" dir="auto">${esc(r.bottom_line||r.root_cause||'')}</p>`
           +permissionAsk(r)
         :`<p class="working">queued on disk — type <code>go</code> in the Claude Code
            session to pick it up.</p>`;
    if(r){
      const li2=a=>(a||[]).map(x=>`<li dir="auto">${esc(x)}</li>`).join('');
      const cmds=(t.commands||[]).map(c=>`<div style="margin-bottom:8px">
        <div class="mono" style="font-size:12px">${c.readonly===false
          ?'<span class="bad">CHANGES STATE</span> ':'<span class="ok">READ-ONLY</span> '}${esc(c.cmd)}</div>
        ${c.output?`<pre style="max-height:220px">${esc(c.output)}</pre>`:''}</div>`).join('');
      extras=more(`${i}:cause`,'Root cause',r.root_cause?1:0,`<p dir="auto">${esc(r.root_cause||'')}</p>`)
            +more(`${i}:ev`,'Evidence',(r.evidence||[]).length,`<ul>${li2(r.evidence)}</ul>`)
            +more(`${i}:unk`,'What could not be checked',(r.unknowns||[]).length,`<ul>${li2(r.unknowns)}</ul>`)
            +more(`${i}:next`,'Next steps',(r.suggested_actions||[]).length,`<ul>${li2(r.suggested_actions)}</ul>`)
            +more(`${i}:cmds`,'Commands run on the bench',(t.commands||[]).length,cmds)
            +more(`${i}:gaps`,'Documentation gaps',(t.kb_gaps||[]).length,`<ul>${li2(t.kb_gaps)}</ul>`);
    }
  }else if(t.kind==='error'){
    body=`<p class="say bad" dir="auto">${esc(t.error||'that turn failed')}</p>`;
  }else if(t.kind==='follow_up'){
    body=`<p class="say" dir="auto">${ml(t.answer||'')}</p>`;
  }else{
    const r=t.report||{};
    body=`<p class="say" dir="auto">${esc(r.bottom_line||r.root_cause||'(not determined)')}</p>`
        +permissionAsk(r);
    if(r.escalate) body+=`<p class="tmeta bad" dir="auto">escalate — ${bdi(r.escalate_reason||'')}</p>`;
    const tools=(t.findings||[]).map(f=>
      `<tr><td class="mono">${esc(f.agent)}</td><td class="mono">${esc(f.tool)}</td>
       <td class="${f.ok?'ok':'bad'}">${f.ok?'ok':'failed'}</td></tr>`).join('');
    extras=
      more(`${i}:cause`,'Root cause',r.root_cause?1:0,`<p dir="auto">${esc(r.root_cause||'')}</p>`)
     +more(`${i}:ev`,'Evidence',(r.evidence||[]).length,`<ul>${li(r.evidence)}</ul>`)
     +more(`${i}:unk`,'What could not be checked',(r.unknowns||[]).length,`<ul>${li(r.unknowns)}</ul>`)
     +more(`${i}:next`,'Next steps',(r.suggested_actions||[]).length,`<ul>${li(r.suggested_actions)}</ul>`)
     +more(`${i}:tools`,'Tools called',(t.findings||[]).length,
           `<div class="scroll"><table><tr><th>agent</th><th>tool</th><th>result</th></tr>${tools}</table></div>`)
     +more(`${i}:agents`,'Agent detail',(t.transcript||[]).length,
           (t.transcript||[]).map(x=>`<p class="dim mono" style="font-size:11px">${esc(x.agent)}</p>
             <p dir="auto">${ml(x.text||'')}</p>`).join(''));
  }
  return `<div class="turn">
    <p class="ask"><b>you</b><span dir="auto">${esc(t.question||'')}</span></p>
    ${attList(t.attachments)}
    ${body}
    <div class="tmeta">${meta.join('<span class="dim">·</span>')}</div>
    ${extras}</div>`;
}

function renderThread(c){
  const turns=c.turns||[];
  // Newest first, and the turn in flight above all of them. With the input pinned at
  // the top of the card, chronological order would push every new answer further from
  // the box and make the operator chase it down the page. The index passed to turnCard
  // stays the ORIGINAL one, because it keys which sections are open.
  const done=turns.map((t,i)=>[i,t]).reverse().map(([i,t])=>turnCard(t,i)).join('');
  let live='';
  if(String(c.status||'').startsWith('working')){
    const st=c.live||{}, cur=c.current||{};
    const steps=(META.order||[]).map(a=>{
      const v=(st.visited||[]).includes(a), act=(st.next||[]).includes(a);
      return `<span class="step ${act?'active':v?'done':''}">${v?'✓ ':''}${esc(a)}</span>`}).join('');
    const kind=(c.status||'').split(':')[1]||'';
    live=`<div class="turn">
      <p class="ask"><b>you</b><span dir="auto">${esc(cur.question||'')}</span></p>
      ${attList(cur.attachments)}
      <p class="working">${kind==='follow_up'
        ? 'answering from what is already known\u2026'
        : kind ? 'gathering evidence\u2026' : 'deciding how to answer\u2026'}</p>
      ${steps?`<div style="margin-top:6px">${steps}</div>`:''}</div>`;
  }
  let html=live+done;
  if(c.error&&!turns.length) html+=`<div class="turn"><p class="say bad">${esc(c.error)}</p></div>`;
  $('#thread').innerHTML=html;
  const t=c.totals||{};
  $('#convmeta').textContent=t.turns
    ? `${t.turns} turn${t.turns>1?'s':''} \u00b7 ${t.runs} run${t.runs===1?'':'s'} \u00b7 `
      +`${nTok((t.input||0)+(t.output||0))} tok \u00b7 ${secs(t.duration_s)}`
    : '';
  $('#newconv').hidden=!turns.length;
}

function reportCard(r){
  const li=(a)=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  return `<div class="card"><h3>Diagnosis</h3>
    <p class="say">${esc(r.bottom_line||'')}</p>
    <p><b>${esc(r.root_cause||'(not determined)')}</b></p>
    <p class="note">confidence: <span class="${r.confidence==='high'?'ok':r.confidence==='low'?'bad':'warn'}">${esc(r.confidence)}</span>
      ${r.escalate?` · <span class="bad">escalate — ${esc(r.escalate_reason||'')}</span>`:''}</p>
    ${r.evidence?.length?`<p class="dim">Evidence</p><ul class="tight">${li(r.evidence)}</ul>`:''}
    ${r.unknowns?.length?`<p class="dim">Unknowns</p><ul class="tight">${li(r.unknowns)}</ul>`:''}
    ${r.suggested_actions?.length?`<p class="dim">Next steps</p><ul class="tight">${li(r.suggested_actions)}</ul>`:''}
  </div>`;
}

async function loadApprovals(){
  const {sessions}=await api('/sessions');
  const pend=sessions.filter(s=>s.status==='awaiting_approval');
  $('#apcount').textContent=pend.length?`(${pend.length})`:'';
  if(!pend.length){$('#approvals').innerHTML='<div class="card"><h3>Approval queue</h3><p class="note">Nothing waiting. The agent cannot add anything to the knowledge base on its own — proposals land here first.</p></div>';return;}
  const cards=await Promise.all(pend.map(async p=>{
    const s=await api('/session/'+p.id);
    return `<div class="card"><h3>Proposed scenario <span class="mono dim">${esc(p.id)}</span></h3>
      <p class="note">from: ${esc(p.question||'')}</p>
      <textarea id="md-${p.id}">${esc(s.pending.preview_md)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="sm yes" onclick="decide('${p.id}',true)">Approve &amp; save</button>
        <button class="sm no" onclick="decide('${p.id}',false)">Reject</button>
        <span class="note">Edits in the box above are saved with the approval.</span>
      </div></div>`;}));
  $('#approvals').innerHTML=cards.join('');
}

async function decide(id,approved){
  const md=$('#md-'+id)?.value;
  await api('/session/'+id+'/decide',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({approved,edited_md:approved?md:null})});
  // The approval belongs to a run turn inside the open conversation, so refresh that
  // too — the diagnosis is already in the thread and only `saved` changes here.
  setTimeout(()=>{loadApprovals();if(CONV)refresh();},400);
}

var TRACES_ALL=[];                          // the list as last fetched
var TRACE_OPEN={};                          // id -> true while its detail row is shown
var TRACE_HTML={};                          // id -> rendered detail, kept across re-sorts
var TRACE_SORT={by:'time',dir:'desc'};
var TRACE_ALL_STATES=false;                 // off: finished sessions only
const tdash=v=>v==null||v===''?'<span class="dim">-</span>':esc(String(v));
// Filters on the fields that repeat across sessions. "-" is its own value, so the
// sessions nobody could attribute to a system (or a person) can be pulled out too.
const TFILTERS=[['system','system'],['location','location'],['asker','asked by']];
const tval=v=>v==null||v===''?'-':String(v);
var TRACE_SYSTEMS=[];                       // the inventory's systems, as last fetched
function traceOptions(k){
  // System follows the inventory, not the traces: a system added there is offered
  // before it has any sessions, and one removed there is no longer offered.
  const vals=k==='system'
    ?[...TRACE_SYSTEMS].sort((x,y)=>x.localeCompare(y))
      .concat(TRACES_ALL.some(t=>tval(t.system)==='-')?['-']:[])
    :[...new Set(TRACES_ALL.map(t=>tval(t[k])))]
      .sort((x,y)=>x==='-'?1:y==='-'?-1:x.localeCompare(y));
  return `<option value="">all</option>`+vals.map(v=>
    `<option value="${esc(v)}">${v==='-'?'- (unknown)':esc(v)}</option>`).join('');
}
function traceView(){
  const f={from:$('#tfrom').value, to:$('#tto').value};
  for(const [k] of TFILTERS) f[k]=$('#tf-'+k).value;
  const rows=TRACES_ALL.filter(t=>(TRACE_ALL_STATES||t.finished)
    &&(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)
    &&TFILTERS.every(([k])=>!f[k]||tval(t[k])===f[k]));
  const key=TRACE_SORT.by==='tokens'?(t=>t.tokens):(t=>t.started);
  const sign=TRACE_SORT.dir==='asc'?1:-1;
  // No token count is not a small token count: it sorts last whichever way you sort.
  return rows.sort((x,y)=>{
    const a=key(x), b=key(y);
    if(a==null||b==null) return (a==null)-(b==null);
    return sign*(a-b)||sign*(x.session-y.session);});
}
function traceRow(t){
  const open=!!TRACE_OPEN[t.id];
  return `<tr id="tr-${t.id}"><td><div class="mono">${esc(t.tag)}${t.finished?''
       :` <span class="pill ${t.status==='error'||t.status==='failed'?'bad':''}">${esc(t.status_label)}</span>`}</div>
       <div class="dim mono" style="font-size:11px">${esc(t.id)} · ${t.bytes} B</div></td>
     <td>${tdash(t.system)}</td>
     <td>${t.system_serial?`#${t.system_serial} on ${esc(t.system)}`:tdash(null)}</td>
     <td>${tdash(t.date)}</td><td>${tdash(t.location)}</td>
     <td>${t.tokens==null?tdash(null):nTok(t.tokens)}</td><td>${tdash(t.asker)}</td>
     <td><button class="sm" id="tb-${t.id}" aria-expanded="${open}"
       onclick="toggleTrace('${t.id}')">${open?'close':'open'}</button></td></tr>
     <tr id="tdr-${t.id}"${open?'':' hidden'}><td colspan="8" id="tdc-${t.id}">${
       open?(TRACE_HTML[t.id]||'<p class="note">Loading…</p>'):''}</td></tr>`;
}
async function loadTraces(){
  const {traces,systems}=await api('/traces');
  TRACES_ALL=traces; TRACE_SYSTEMS=systems||[]; TRACE_OPEN={}; TRACE_HTML={};
  const dates=traces.map(t=>t.date).filter(Boolean).sort();
  $('#traces').innerHTML=`<div class="card"><h3>Sessions on disk</h3>
   <p class="note">Tag: the overall session number, counted across every system. A field
   the trace does not record is <code>-</code>. <i>Session on its system</i> counts only that
   system's sessions, and is given once the system is known. Only finished sessions are
   listed unless <i>show all sessions</i> is on.</p>
   ${traces.length?`<div class="tfilt">
     <label>from<input type="date" id="tfrom" onchange="filterTraces()"
       min="${dates[0]}" max="${dates.at(-1)}"></label>
     <label>to<input type="date" id="tto" onchange="filterTraces()"
       min="${dates[0]}" max="${dates.at(-1)}"></label>
     ${TFILTERS.map(([k,l])=>`<label>${l}<select id="tf-${k}" onchange="filterTraces()">
       ${traceOptions(k)}</select></label>`).join('')}
     <label>sort by<select id="tsort" onchange="sortTraces(this.value)">
       <option value="time">time</option><option value="tokens">token usage</option></select></label>
     <button class="sm" id="tdir" onclick="sortTraces(null,true)"
       title="switch ascending / descending"></button>
     <button class="sm" id="tall" aria-pressed="false" onclick="toggleAllTraces()"
       title="also show sessions that failed, were cancelled, or never got to an answer"></button>
     <button class="sm" onclick="clearTraceFilters()"
       title="remove every filter and go back to newest first">clear</button>
     <span class="dim" id="tcount" style="font-size:12.5px"></span>
   </div>
   <div class="scroll" style="margin-top:10px"><table><thead><tr><th>tag</th><th>system</th>
     <th>session on its system</th><th>date</th><th>location</th>
     <th>tokens</th><th>asked by</th><th></th></tr></thead><tbody id="tbody"></tbody>
   </table></div>`:'<p class="note">No traces yet.</p>'}</div>`;
  if(traces.length){ $('#tsort').value=TRACE_SORT.by; filterTraces(); }
}
function filterTraces(){
  const rows=traceView();
  $('#tbody').innerHTML=rows.map(traceRow).join('')
    ||`<tr><td colspan="8" class="note">No ${TRACE_ALL_STATES?'':'finished '}session matches these filters.</td></tr>`;
  $('#tdir').textContent=TRACE_SORT.dir==='asc'?'↑ ascending':'↓ descending';
  const hidden=TRACES_ALL.filter(t=>!t.finished).length;
  $('#tall').textContent=TRACE_ALL_STATES?'showing all sessions'
    :`show all sessions${hidden?` (${hidden} unfinished)`:''}`;
  $('#tall').setAttribute('aria-pressed',String(TRACE_ALL_STATES));
  $('#tcount').textContent=rows.length===TRACES_ALL.length?`${rows.length} sessions`
    :`${rows.length} of ${TRACES_ALL.length}`;
}
function sortTraces(by,flip){
  if(by) TRACE_SORT.by=by;
  if(flip) TRACE_SORT.dir=TRACE_SORT.dir==='asc'?'desc':'asc';
  filterTraces();
}
function toggleAllTraces(){ TRACE_ALL_STATES=!TRACE_ALL_STATES; filterTraces(); }
function clearTraceFilters(){
  $('#tfrom').value=''; $('#tto').value='';
  for(const [k] of TFILTERS) $('#tf-'+k).value='';
  TRACE_SORT={by:'time',dir:'desc'}; $('#tsort').value='time';   // the default view
  TRACE_ALL_STATES=false;
  filterTraces();
}
async function toggleTrace(id){
  const btn=$('#tb-'+id);
  if(TRACE_OPEN[id]){
    delete TRACE_OPEN[id];
    $('#tdr-'+id).hidden=true; btn.textContent='open'; btn.setAttribute('aria-expanded','false');
    return;
  }
  TRACE_OPEN[id]=true;
  btn.textContent='close'; btn.setAttribute('aria-expanded','true');
  $('#tdr-'+id).hidden=false;
  if(!TRACE_HTML[id]){

function traceDetail(t){

   </div>
   ${blk('Problem',(s.problem?`<p dir="auto">${esc(s.problem)}</p>`
      :`${tdash(null)} <span class="note">— this trace did not record the question.</span>`)
     +(s.follow_ups&&s.follow_ups.length?`<div class="note">Follow-ups:</div>${list(s.follow_ups)}`:''))}
   ${s.attachments&&s.attachments.length?blk('Attachments',attList(s.attachments)):''}
   ${blk('Symptoms <span class="note">— what the tools observed</span>',list(s.symptoms))}
   ${blk('Diagnosis',(s.diagnosis?`<p dir="auto">${esc(s.diagnosis)}</p>`:tdash(null))
     +(s.root_cause&&s.root_cause!==s.diagnosis
       ?`<p dir="auto"><span class="dim">Root cause:</span> ${esc(s.root_cause)}</p>`:''))}
   ${blk('Solution',(s.solution?`<p dir="auto">${esc(s.solution)}</p>`
      :`<p class="note">No fix recorded — the agents suggest checks, not a repair.</p>`)
     +(s.next_steps&&s.next_steps.length?`<div class="note">Next checks:</div>${list(s.next_steps)}`:''))}
   ${s.error?blk('Error',`<pre>${esc(s.error)}</pre>`):''}
   ${s.escalate?blk('Escalation',`<p dir="auto">${s.escalate_reason?esc(s.escalate_reason):tdash(null)}</p>`):''}
   ${s.unknowns&&s.unknowns.length?blk('Still unknown',list(s.unknowns)):''}
   ${s.needs_permission&&s.needs_permission.length?blk('Needs permission',
      list(s.needs_permission.map(p=>`${p.what} — ${p.why}`))):''}
   ${s.last_answer?blk('Latest answer',`<p dir="auto">${esc(s.last_answer)}</p>`):''}
   <h4 style="margin-top:14px">Logs</h4>
   <p class="note">The raw record the summary was drawn from, one section per kind of data.

       <span class="dim">— ${esc(x.why)}</span></summary>
     <div class="body"><pre>${esc(JSON.stringify(x.value,null,1))}</pre></div></details>`).join('')}
   <details class="more"><summary>Raw trace file <span class="dim">— every line of
     <code>traces/${esc(t.id)}.jsonl</code> exactly as written</span></summary>
     <div class="body"><pre>${esc(JSON.stringify(t.entries,null,1))}</pre></div></details>
  </div>`;
}

var KBDOC=null;  // {name, topics[], symptoms[], body} — the form's working copy
                 // var, not let: inline on* handlers resolve against the global object
var TOPICS_ALL=[];                          // every topic in use, plus the seeded ones
var TOPICS_REMOVABLE=[];                    // created here, used by no case — safe to drop
var TOPICS_SEL={kbnew:[], kbdoc:[]};        // what each picker currently has selected

// A topic is free text and multi-select: a case can be both "network" and "radar",
// which is how the hijack case is found from either direction. Adding one is just
// using it — nothing else in the system has to be told about it.
var TOPIC_ADDING={};                        // which picker has its small input open
const topicPicker=which=>`<div id="${which}-topics" class="tchips"></div>`;

function renderTopics(which){
  const box=$('#'+which+'-topics'); if(!box)return;
  const sel=TOPICS_SEL[which]||[];
  const chips=TOPICS_ALL.map(t=>{
    const on=sel.includes(t);
    return `<button type="button" class="tchip ${on?'on':''}" onclick="toggleTopic('${which}','${esc(t)}')"
      title="${on?'Remove':'Add'} ${esc(t)}">${on?'✓ ':''}${esc(t)}</button>`;}).join(' ');
  // Adding a topic is a chip at the end of the line, not a form of its own: it opens a
  // chip-sized input in place, Enter adds, Esc or leaving it empty puts the chip back.
  const add=TOPIC_ADDING[which]
    ?`<span class="tchip tadd"><input type="text" id="${which}-newtopic" placeholder="new topic"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addTopic('${which}')}
                   else if(event.key==='Escape'){cancelAddTopic('${which}')}"
        onblur="if(!this.value.trim())cancelAddTopic('${which}')"></span>`
    :`<button type="button" class="tchip none" onclick="startAddTopic('${which}')"
        title="create a new topic">+ topic</button>`;
  box.innerHTML=(chips||'<span class="dim" style="font-size:12px;margin-right:6px">No topics yet</span>')+' '+add;
  if(TOPIC_ADDING[which]) $('#'+which+'-newtopic').focus();
}
function startAddTopic(which){ TOPIC_ADDING[which]=true; renderTopics(which); }
function cancelAddTopic(which){ TOPIC_ADDING[which]=false; renderTopics(which); }
function toggleTopic(which,t){
  const sel=TOPICS_SEL[which]; const i=sel.indexOf(t);
  i<0?sel.push(t):sel.splice(i,1);
  renderTopics(which);
}
// Persisted server-side, not just in this tab: the list is otherwise derived from what
// cases carry, so a topic on no case would vanish on the next refresh.
async function addTopic(which){
  const el=$('#'+which+'-newtopic'); const t=(el.value||'').trim().toLowerCase();
  if(!t)return;
  try{
    const r=await api('/topics',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:t})});
    TOPICS_ALL=r.all_topics; TOPICS_REMOVABLE=r.removable_topics;
    if(!TOPICS_SEL[which].includes(t)) TOPICS_SEL[which].push(t);
    TOPIC_ADDING[which]=false;
    renderTopics('kbnew'); renderTopics('kbdoc'); renderRemovable();
  }catch(e){ alert(e.message); }
}

async function removeTopic(t){
  if(!confirm(`Remove the topic "${t}"? It is used by no case.`))return;
  try{
    const r=await api('/topics/'+encodeURIComponent(t),{method:'DELETE'});
    TOPICS_ALL=r.all_topics; TOPICS_REMOVABLE=r.removable_topics;
    for(const k of Object.keys(TOPICS_SEL))
      TOPICS_SEL[k]=TOPICS_SEL[k].filter(x=>x!==t);
    renderTopics('kbnew'); renderTopics('kbdoc'); renderRemovable();
  }catch(e){ alert(e.message); }
}

function renderRemovable(){
  const box=$('#kbnew-removable'); if(!box)return;
  box.innerHTML=TOPICS_REMOVABLE.length
    ? `<span class="dim">Added here, used by no case yet — </span>`
      + TOPICS_REMOVABLE.map(t=>`<button type="button" class="tchip"
          onclick="removeTopic('${esc(t)}')" title="Remove ${esc(t)}">${esc(t)} ×</button>`).join(' ')
    : '';
}
// Mirrors _slugify in console/server.py. The server is authoritative — this only shows
// what is about to happen. tests/test_kb_api.py runs both over the same inputs so the
// preview cannot start lying about the filename.
function slugify(raw){
  return (raw||'').normalize('NFKD').replace(/[^\x00-\x7F]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,64).replace(/-+$/,'');
}

function previewSlug(){
  const el=$('#kbnew-slug'); if(!el)return;
  const raw=$('#kbnew').value.trim();
  const slug=slugify(raw);
  // Empty is not an error, it is the starting state — the warning only means something
  // once something has been typed that slugs to nothing.
  el.innerHTML=!raw ? ''
    : slug ? `Saved as <code>${esc(slug)}.md</code>`
           : '<span class="warn">Needs at least one letter or digit.</span>';
}

const topicChips=ts=>(ts&&ts.length)
  ? ts.map(t=>`<span class="tchip on">${esc(t)}</span>`).join(' ')
  : '<span class="dim">—</span>';

var KB_DOCS=[];                             // the case list as last fetched
var KB_FILTER={topics:[],from:'',to:''};    // kept across reloads: saving a case reloads
var KB_SORT={by:'time',dir:'desc'};

const kbDay=c=>(c||'').slice(0,10);
const KB_EST={git:'estimated — when the file was first committed',
              file:"estimated — the file's last change; the case predates the created field"};
function kbCreated(d){
  if(!d.created) return tdash(null);
  const txt=esc(d.created.slice(0,16).replace('T',' '));
  return d.created_source==='recorded'?txt
    :`<span class="dim" title="${esc(KB_EST[d.created_source]||'estimated')}">~${txt}</span>`;
}
function kbSessions(d){
  return `${d.sessions}${d.search_hits?` <span class="dim" title="sessions whose runbook
    search returned this case — same words, not necessarily the same fault">· ${d.search_hits}
    in search</span>`:''}`;
}
function kbView(){
  const f=KB_FILTER;
  const rows=KB_DOCS.filter(d=>(!f.topics.length||f.topics.some(t=>(d.topics||[]).includes(t)))
    &&(!f.from||kbDay(d.created)>=f.from)&&(!f.to||kbDay(d.created)<=f.to));
  const sign=KB_SORT.dir==='asc'?1:-1;
  const tkey=d=>[...(d.topics||[])].sort().join(',');
  return rows.sort((x,y)=>{
    if(KB_SORT.by==='topics'){
      // A case with no topics sorts last whichever way: it has nothing to sort on.
      const a=tkey(x), b=tkey(y);
      if(!a||!b) return (!a)-(!b);
      return sign*a.localeCompare(b)||x.name.localeCompare(y.name);
    }
    return sign*(x.created||'').localeCompare(y.created||'')||x.name.localeCompare(y.name);
  });
}
function renderKbList(){
  const box=$('#kb-rows'); if(!box)return;
  const rows=kbView();
  box.innerHTML=rows.map(d=>`<tr>
     <td class="mono">${esc(d.name)}</td>
     <td>${topicChips(d.topics)}</td>
     <td class="${d.symptom_count?'dim':'warn'}">${d.symptom_count||'0 — add some'}</td>
     <td style="white-space:nowrap">${kbCreated(d)}</td>
     <td>${kbSessions(d)}</td>
     <td style="white-space:nowrap"><button class="sm" onclick="toggleKb('${esc(d.name)}')">edit</button>
         <button class="sm no" onclick="delKb('${esc(d.name)}')">delete</button></td></tr>`).join('')
    ||`<tr><td colspan="6" class="dim">${KB_DOCS.length
        ?'No case matches these filters.'
        :'No cases recorded yet. Until one is, every diagnosis reasons from the system model alone.'}</td></tr>`;
  const used=[...new Set(KB_DOCS.flatMap(d=>d.topics||[]))].sort();
  $('#kbf-topics').innerHTML=used.map(t=>{const on=KB_FILTER.topics.includes(t);
    return `<button type="button" class="tchip ${on?'on':''}" onclick="kbFilterTopic('${esc(t)}')"
      >${on?'✓ ':''}${esc(t)}</button>`;}).join(' ')||'<span class="dim">no topics on any case</span>';
  $('#kbdir').textContent=KB_SORT.dir==='asc'?'↑ ascending':'↓ descending';
  $('#kbcount').textContent=rows.length===KB_DOCS.length?`${rows.length} cases`
    :`${rows.length} of ${KB_DOCS.length}`;
}
function kbFilterTopic(t){
  const i=KB_FILTER.topics.indexOf(t); i<0?KB_FILTER.topics.push(t):KB_FILTER.topics.splice(i,1);
  renderKbList();
}
function kbFilterDates(){ KB_FILTER.from=$('#kbf-from').value; KB_FILTER.to=$('#kbf-to').value; renderKbList(); }
function kbSort(by,flip){
  if(by) KB_SORT.by=by;
  if(flip) KB_SORT.dir=KB_SORT.dir==='asc'?'desc':'asc';
  renderKbList();
}
function kbClear(){
  KB_FILTER={topics:[],from:'',to:''}; KB_SORT={by:'time',dir:'desc'};
  $('#kbf-from').value=''; $('#kbf-to').value=''; $('#kbsort').value='time';
  renderKbList();
}

function closeKb(){ KBDOC=null; const b=$('#kbdetail'); if(b) b.innerHTML=''; }

// Clicking "edit" on the case already open closes it, so the editor can be dismissed

function toggleKb(n){ (KBDOC && KBDOC.name===n) ? closeKb() : showKb(n); }

function renderSyms(){
  const box=$('#kb-syms'); if(!box)return;

async function saveKb(){
  const payload={topics:[...TOPICS_SEL.kbdoc],
                 symptoms:KBDOC.symptoms.map(s=>s.trim()).filter(Boolean),
                 sections:KBDOC.sections};
  try{ const r=await api('/kb/'+KBDOC.name,{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify(payload)});
       flash('kv',`saved · ${r.bytes} B`); await loadKb(); showKb(KBDOC.name); }

}

async function newKb(){
  const n=$('#kbnew').value.trim(); if(!n)return;

    const r=await api('/kb',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:n,topics:[...TOPICS_SEL.kbnew],symptoms:[],body:''})});
    await loadKb(); showKb(r.name);
  }catch(e){ alert(e.message); }
}

async function delKb(n){
  const editing=KBDOC&&KBDOC.name===n;
  if(!confirm(`Delete ${n}.md? The agent will no longer see this guidance.`
    +(editing?' Anything unsaved in the editor goes with it.':'')))return;
  try{ await api('/kb/'+n,{method:'DELETE'}); if(editing) closeKb(); loadKb(); }
  catch(e){ alert(e.message); }
}

  $('#chat').innerHTML=`
   <div class="card"><h3>Describe the fault</h3>
     <p class="note">This does <b>not</b> run the graph. The ticket is queued on disk and
       picked up in the Claude Code session, which reads the knowledge base and runs
       read-only checks against the real hardware. Use the <b>Run</b> tab to exercise the
       pipeline itself — that one uses recorded fixtures and never touches the bench.</p>
     <textarea id="chatq" class="prose" style="min-height:90px"
       placeholder="e.g. the radar stopped reporting detections about ten minutes ago"></textarea>
     <div class="row" style="margin-top:8px">
       <button class="sm yes" onclick="submitChat()">Queue it</button>
       <span class="saved" id="chatv"></span></div>
     <p class="note">Nothing watches this queue automatically. After queuing, type
       <code>go</code> in the Claude Code chat and it will be picked up.</p>
   </div>

   <div class="card"><h3>Sessions <span class="dim" style="font-weight:400">— ${q.sessions.length}</span></h3>
     <div class="scroll"><table><tr><th>id</th><th>ticket</th><th>status</th><th></th></tr>
       ${rows||'<tr><td colspan="4" class="dim">Nothing queued yet.</td></tr>'}</table></div>
   </div>
   <div id="chatdetail"></div>`;
  if(CHAT_OPEN) openChat(CHAT_OPEN);
  clearInterval(CHAT_TIMER);
  if(q.pending||q.working) CHAT_TIMER=setInterval(()=>{ if(!$('#chat').hidden) loadChat(); },4000);
}

async function submitChat(){
  const text=$('#chatq').value.trim(); if(!text)return;
  try{ const r=await api('/bridge/ticket',{method:'POST',
         headers:{'content-type':'application/json'},body:JSON.stringify({question:text})});
       $('#chatq').value=''; CHAT_OPEN=r.id; flash('chatv','queued as '+r.id); loadChat(); }
  catch(e){ flash('chatv',e.message,true); }
}

async function openChat(id){
  CHAT_OPEN=id;
  const s=await api('/bridge/session/'+id).catch(()=>null);
  const box=$('#chatdetail'); if(!box||!s)return;
  const cmds=(s.commands||[]).map(c=>`<div style="margin-bottom:8px">
     <div class="mono" style="font-size:12px">${c.readonly===false?'<span class="bad">CHANGES STATE</span> ':'<span class="ok">READ-ONLY</span> '}${esc(c.cmd)}</div>
     ${c.output?`<pre style="max-height:220px">${esc(c.output)}</pre>`:''}</div>`).join('');
  box.innerHTML=`
   <div class="card"><h3>Session <span class="mono dim">${esc(s.id)}</span>
     <span class="${STATUS_CLASS[s.status]||'dim'}" style="font-weight:400;font-size:12px">
       — ${esc(STATUS_LABEL[s.status]||s.status)}</span>
     <button class="sm" style="float:right" onclick="CHAT_OPEN=null;$('#chatdetail').innerHTML=''">Close</button></h3>
     <p class="note">${esc(s.question||'')}</p>
     ${s.report?reportCard(s.report):'<p class="note">No report yet.</p>'}
     ${s.kb_gaps&&s.kb_gaps.length?`<div class="card" style="border-color:var(--warn)">
       <h3>Documentation gaps</h3>
       <p class="note">Facts used that were not in <code>system-model.md</code> or a
         recorded case. Each one is a KB entry worth writing.</p>
       <ul class="tight">${s.kb_gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`:''}
     ${cmds?`<h3 style="margin-top:14px">Checks run</h3>${cmds}`:''}
     ${s.notes?`<p class="note">${esc(s.notes)}</p>`:''}
     <p class="note">Trace: <code>traces/${esc(s.id)}.jsonl</code></p>
   </div>`;
