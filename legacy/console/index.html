// ---------------- graph ----------------
// The diagram lives at the foot of Agents & permissions now — it IS the shape those
// settings produce, so reading it beside them beats a separate tab you had to remember
// to go and check. Fetch and paint are split for the same reason: every edit repaints
// it from cache, so a reorder shows up immediately instead of on the next tab switch.
var GRAPHDATA=null;

async function loadGraph(){
  const [g,cfg] = await Promise.all([api('/graph'),api('/config')]);
  GRAPHDATA={g, eff:cfg.effective};
  paintGraph();
}

function paintGraph(){
  if(!GRAPHDATA||!$('#graphpane'))return;
  const {g,eff}=GRAPHDATA;
  const N=(x,y,w,h,label,cls,sub)=>({x,y,w,h,label,cls,sub});
  const ags=g.agents, n=ags.length;
  // Size the agent box to its label. A fixed width clipped "acoustic_deep_dive".
  const longest=Math.max(10,...ags.map(a=>a.name.length));
  const AW=Math.max(126,Math.min(206,Math.round(longest*7.1+22))), AH=48, GAP=16;
  const rowW=n*AW+(n-1)*GAP;
  const W=Math.max(rowW+96,680), cx=W/2, x0=cx-rowW/2;
  const ySup=70, hSup=36, supB=ySup+hSup, yAg=206, agB=yAg+AH;
  const railY=agB+20, railL=x0-20, railR=x0+rowW+20;
  const yS=railY+52, hS=36;
  const post=(g.post_agents||[]);
  const yC=post.length?yS+66:0, yP=(post.length?yC+44:yS+62)+18,
        ySave=yP+72, yEnd=ySave;

  const nodes=[
    N(cx-42,10,84,26,'START','term'),
    N(cx-70,ySup,140,hSup,'supervisor','',g.supervisor_picks?'routes by model':'fixed order'),
  ];
  ags.forEach((a,i)=>nodes.push(N(x0+i*(AW+GAP),yAg,AW,AH,a.name,a.in_order?'ag':'off',
    a.in_order?(a.tools.length+' tool'+(a.tools.length===1?'':'s')):'not in order')));
  nodes.push(N(cx-70,yS,140,hS,'synthesize','','builds the report'));
  post.forEach(pa=>nodes.push(N(cx-108,yC,216,40,pa.name,'post','rewrites it for the client')));
  nodes.push(N(cx-96,yP,192,40,'propose_scenario','gate','waits for you'));
  nodes.push(N(cx-192,ySave,112,30,'save','','writes kb/'));
  nodes.push(N(cx+82,yEnd,112,30,'END','term'));
  nodes.push(N(cx-192,ySave+54,112,28,'END','term'));

  const cxOf=i=>x0+i*(AW+GAP)+AW/2;
  const R=10;                                   // corner radius on the rails
  let paths='';
  paths+=`<line x1="${cx}" y1="36" x2="${cx}" y2="${ySup}"/>`;

  const live=ags.map((a,i)=>i).filter(i=>ags[i].in_order);
  // Fan out to each agent.
  live.forEach(i=>{paths+=`<path d="M ${cx} ${supB} C ${cx} ${supB+26}, ${cxOf(i)} ${yAg-26}, ${cxOf(i)} ${yAg}"/>`;});
  // One shared return rail instead of a sweeping curve per agent — with six agents the
  // per-agent curves crossed the whole diagram and buried the boxes underneath.
  if(live.length){
    live.forEach(i=>{paths+=`<line x1="${cxOf(i)}" y1="${agB}" x2="${cxOf(i)}" y2="${railY}"/>`;});
    const far=cxOf(live[live.length-1]);
    paths+=`<path class="rail" d="M ${far} ${railY} L ${railL+R} ${railY} Q ${railL} ${railY} ${railL} ${railY-R}
      L ${railL} ${supB+18+R} Q ${railL} ${supB+18} ${railL+R} ${supB+18}
      L ${cx-56-R} ${supB+18} Q ${cx-56} ${supB+18} ${cx-56} ${supB+8}
      L ${cx-56} ${supB}" marker-end="url(#ar)"/>`;
  }
  // requires: short arcs in the gap between the supervisor and the agent row.
  ags.forEach((a,i)=>{ if(!a.in_order) return; (a.requires||[]).forEach(r=>{
    const j=ags.findIndex(x=>x.name===r); if(j<0||!ags[j].in_order)return;
    const h=Math.min(46,16+Math.abs(i-j)*9);
    paths+=`<path class="req" d="M ${cxOf(j)} ${yAg} C ${cxOf(j)} ${yAg-h}, ${cxOf(i)} ${yAg-h}, ${cxOf(i)} ${yAg}"
             marker-end="url(#arw)"/>`;
  });});
  // "done" leaves the supervisor on the right and drops past the agent row.
  paths+=`<path class="rail" stroke-dasharray="4 4" d="M ${cx+70} ${ySup+hSup/2} L ${railR-R} ${ySup+hSup/2}
    Q ${railR} ${ySup+hSup/2} ${railR} ${ySup+hSup/2+R} L ${railR} ${yS+hS/2-R}
    Q ${railR} ${yS+hS/2} ${railR-R} ${yS+hS/2} L ${cx+70} ${yS+hS/2}" marker-end="url(#ar)"/>`;

  if(post.length){
    paths+=`<line x1="${cx}" y1="${yS+hS}" x2="${cx}" y2="${yC}" marker-end="url(#ar)"/>`;
    paths+=`<line x1="${cx}" y1="${yC+40}" x2="${cx}" y2="${yP}" marker-end="url(#ar)"/>`;
  } else {
    paths+=`<line x1="${cx}" y1="${yS+hS}" x2="${cx}" y2="${yP}" marker-end="url(#ar)"/>`;
  }
  paths+=`<path class="yes" d="M ${cx-44} ${yP+40} C ${cx-44} ${ySave-16}, ${cx-136} ${ySave-16}, ${cx-136} ${ySave}" marker-end="url(#arg)"/>`;
  paths+=`<path class="no"  d="M ${cx+44} ${yP+40} C ${cx+44} ${yEnd-16}, ${cx+138} ${yEnd-16}, ${cx+138} ${yEnd}" marker-end="url(#arr)"/>`;
  paths+=`<line x1="${cx-136}" y1="${ySave+30}" x2="${cx-136}" y2="${ySave+54}"/>`;

  const boxes=nodes.map(d=>`
    <g class="n ${d.cls}">
      <rect class="card" x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="9"/>
      ${d.cls&&d.cls!=='term'?`<rect class="bar" x="${d.x}" y="${d.y+7}" width="3.5"
        height="${d.h-14}" rx="2"/>`:''}
      <text x="${d.x+d.w/2}" y="${d.y+(d.sub?18:d.h/2+4)}" text-anchor="middle">${esc(d.label)}</text>
      ${d.sub?`<text class="lbl" x="${d.x+d.w/2}" y="${d.y+32}" text-anchor="middle">${esc(d.sub)}</text>`:''}
      <title>${esc(d.label)}${d.sub?' — '+esc(d.sub):''}</title></g>`).join('');

  const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6"
    markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}" stroke="none"/></marker>`;

  $('#graphpane').innerHTML=`
   <div class="card">
    <svg class="g" viewBox="-4 0 ${W+8} ${ySave+96}" style="max-width:${W+8}px"
         role="img" aria-label="agent execution graph">
      <defs>${mk('ar','var(--dim)')}${mk('arw','var(--warn)')}${mk('arg','var(--ok)')}${mk('arr','var(--bad)')}</defs>
      ${paths}${boxes}
    </svg>
    <p class="note">
      Solid grey: flow. Each agent returns to the supervisor, which picks the next one
      ${g.supervisor_picks?'(model-routed, constrained by order and requires)':'(fixed order — routing is off)'}.
      <span class="warn">Dashed amber between agents</span>: a <code>requires</code> precondition —
      the supervisor cannot pick an agent until its prerequisites have run.
      ${ags.filter(a=>(a.needs_context||[]).length).map(a=>`<br><b>${esc(a.name)}</b> additionally
        needs <code>${a.needs_context.map(esc).join(', ')}</code> to have been extracted from an
        earlier agent's tool output — if that agent runs but its tools fail,
        <b>${esc(a.name)}</b> stays blocked rather than probing blind.`).join('')}
      ${ags.filter(a=>(a.scope_context||[]).length).map(a=>`<br><b>${esc(a.name)}</b> applies only
        when <code>${a.scope_context.map(esc).join(', ')}</code> was extracted — a domain expert
        with nothing in its domain is <b>not applicable</b> rather than blocked, so it is left
        out of the report instead of appearing there as a check we failed to run.`).join('')}
      <span class="ok">Green</span>: you approved. <span class="bad">Red</span>: you rejected.
      <code>save</code> is the only node that writes, and it is reachable only through the gate.
      Ceiling of ${g.max_steps} agent steps per session.
      ${ags.some(a=>!a.in_order)?`<br><b class="warn">Greyed out:</b> defined but absent from
        <code>order</code>, so the supervisor can never pick it — add it to the order to enable it.`:''}
    </p>
   </div>`;

  FLOW={order:[...g.order], requires:JSON.parse(JSON.stringify(eff.requires||{})),
        picks:g.supervisor_picks, all:g.agents, sel:null};
  renderFlow();
}

// ---------------- visual flow editor ----------------
var FLOW=null, DRAG=null;
const BW=126, BH=42, GAP=18, DY=62;

function agentInfo(n){ return (FLOW.all.find(a=>a.name===n))||{name:n,tools:[]}; }

function flowProblems(){
  // A prerequisite must run earlier. Reordering can make an existing edge point
  // backwards; the server rejects that on save, so say so before they press it.
  const out=[];
  FLOW.order.forEach((dep,i)=>(FLOW.requires[dep]||[]).forEach(pre=>{
    const j=FLOW.order.indexOf(pre);
    if(j<0) out.push({dep,pre,why:`${pre} is not in the pipeline, so ${dep} could never run`});
    else if(j>i) out.push({dep,pre,why:`${dep} requires ${pre}, but runs before it`});
  }));
  return out;
}

function renderFlow(){
  const pool=FLOW.all.map(a=>a.name).filter(n=>!FLOW.order.includes(n));
  const problems=flowProblems();
  const chip=(n,off)=>{const a=agentInfo(n);
    return `<div class="chip${off?' off':''}" draggable="true" data-name="${esc(n)}"
      ondragstart="chipDrag(event)" ondragend="chipDrop()">
      <b>${esc(n)}</b><small>${a.tools.length} tool${a.tools.length===1?'':'s'}</small></div>`;};

  $('#flowed').innerHTML=`
   <div class="card"><h3>Pipeline</h3>
     <p class="note">Drag to reorder. The supervisor may only pick from this lane, in any
       order the preconditions allow — position sets what is <i>possible</i>, not a fixed
       sequence. Drag an agent down to the shelf to take it out of the pipeline entirely.</p>
     <p class="hint">In the pipeline — left to right</p>
     <div class="lane" id="lane-order" ondragover="laneOver(event)" ondragleave="laneOut(event)"
          ondrop="laneDrop(event,'order')">${FLOW.order.map(n=>chip(n,false)).join('')||
          '<span class="empty">Empty — drag an agent here.</span>'}</div>
     <p class="hint" style="margin-top:12px">Defined but not in the pipeline — the supervisor can never pick these</p>
     <div class="lane" id="lane-pool" ondragover="laneOver(event)" ondragleave="laneOut(event)"
          ondrop="laneDrop(event,'pool')">${pool.map(n=>chip(n,true)).join('')||
          '<span class="empty">None — every defined agent is in the pipeline.</span>'}</div>
   </div>

   <div class="card"><h3>Prerequisites</h3>
     <p class="note">Click an agent, then click one to its <b>left</b> to make that a
       prerequisite: the supervisor cannot pick the first until the second has run. Click an
       arrow to remove it. A prerequisite must run earlier, which is why only the left side
       is offered.</p>
     ${FLOW.order.length?depSvg():'<p class="dim">Put agents in the pipeline first.</p>'}
     ${FLOW.sel?`<p class="note warn">Selected <b>${esc(FLOW.sel)}</b> — now click a
        prerequisite to its left, or <a href="#" onclick="FLOW.sel=null;renderFlow();return false">cancel</a>.</p>`:''}
     ${problems.length?`<div class="alert"><b>This flow cannot be saved.</b>
        <ul class="tight">${problems.map(p=>`<li>${esc(p.why)} — drag it back, or click the
          red arrow to drop the prerequisite.</li>`).join('')}</ul></div>`:''}
   </div>

   <div class="card"><h3>Routing mode</h3>
     <label class="chk"><input type="checkbox" id="f-sup" ${FLOW.picks?'checked':''}
       onchange="FLOW.picks=this.checked">
       supervisor picks the next agent (uncheck for a fixed pipeline)</label>
     <p class="note">Either way the choice is constrained to what is eligible in code —
       order, prerequisites, and the context gates. Routing cannot widen them.</p>
     <div class="row" style="margin-top:8px">
       <button class="sm yes" onclick="saveFlow()" ${problems.length?'disabled':''}
         title="${problems.length?'Fix the prerequisite order first':'Save'}">Save flow</button>
       <button class="sm" onclick="loadGraph()">Discard changes</button>
       <span class="saved" id="fv"></span></div>
   </div>`;
}

function depSvg(){
  const n=FLOW.order.length, W=20+n*BW+(n-1)*GAP, H=DY+BH+12;
  const x=i=>10+i*(BW+GAP), cx=i=>x(i)+BW/2;
  let arcs='';
  FLOW.order.forEach((dep,i)=>(FLOW.requires[dep]||[]).forEach(pre=>{
    const j=FLOW.order.indexOf(pre); if(j<0)return;
    const h=Math.min(46,16+Math.abs(i-j)*11);
    const back=j>i;                       // prerequisite scheduled after its dependant
    const d=`M ${cx(j)} ${DY} C ${cx(j)} ${DY-h}, ${cx(i)} ${DY-h}, ${cx(i)} ${DY}`;
    arcs+=`<g class="edge"><path class="dep${back?' bad':''}" d="${d}"
             marker-end="url(#${back?'depb':'depa'})"/>
           <path class="hit" d="${d}" onclick="unlink('${esc(dep)}','${esc(pre)}')">
             <title>Remove: ${esc(dep)} requires ${esc(pre)}</title></path></g>`;
  }));
  const sel=FLOW.sel, si=sel?FLOW.order.indexOf(sel):-1;
  const boxes=FLOW.order.map((nm,i)=>{
    const isSel=nm===sel, cand=si>=0&&i<si;
    const deps=(FLOW.requires[nm]||[]).length;
    return `<g class="dn${isSel?' sel':''}${cand?' cand':''}" onclick="pick('${esc(nm)}')">
       <rect class="card" x="${x(i)}" y="${DY}" width="${BW}" height="${BH}" rx="9"/>
       <rect class="bar" x="${x(i)}" y="${DY+7}" width="3.5" height="${BH-14}" rx="2"/>
       <text x="${cx(i)}" y="${DY+(deps?19:BH/2+4)}" text-anchor="middle">${esc(nm)}</text>
       ${deps?`<text class="sub" x="${cx(i)}" y="${DY+32}" text-anchor="middle">${deps} prereq${deps===1?'':'s'}</text>`:''}
       <title>${cand?`Make ${esc(nm)} a prerequisite of ${esc(sel)}`
         :isSel?`${esc(nm)} selected — click one to its left`:`Select ${esc(nm)}`}</title></g>`;}).join('');
  return `<svg class="dep" viewBox="0 0 ${W} ${H}" style="max-width:${W}px"
    role="img" aria-label="prerequisite editor">
    <defs><marker id="depa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6"
      orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--warn)" stroke="none"/></marker>
      <marker id="depb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6"
      orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--bad)" stroke="none"/></marker></defs>
    ${arcs}${boxes}</svg>`;
}

function pick(n){
  if(!FLOW.sel){ FLOW.sel=n; return renderFlow(); }
  if(FLOW.sel===n){ FLOW.sel=null; return renderFlow(); }
  const i=FLOW.order.indexOf(FLOW.sel), j=FLOW.order.indexOf(n);
  if(j<i){
    const cur=FLOW.requires[FLOW.sel]||[];
    FLOW.requires[FLOW.sel]=cur.includes(n)?cur.filter(x=>x!==n):[...cur,n];
    if(!FLOW.requires[FLOW.sel].length) delete FLOW.requires[FLOW.sel];
    FLOW.sel=null;
  } else { FLOW.sel=n; }   // clicked to the right: treat as selecting that one instead
  renderFlow();
}
function unlink(dep,pre){
  FLOW.requires[dep]=(FLOW.requires[dep]||[]).filter(x=>x!==pre);
  if(!FLOW.requires[dep].length) delete FLOW.requires[dep];
  renderFlow();
}

function chipDrag(e){
  DRAG=e.currentTarget.dataset.name;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',DRAG);
}
function chipDrop(){ document.querySelectorAll('.chip.dragging').forEach(c=>c.classList.remove('dragging')); }
function laneOver(e){
  e.preventDefault();
  const lane=e.currentTarget; lane.classList.add('over');
  const others=[...lane.querySelectorAll('.chip')].filter(c=>c.dataset.name!==DRAG);
  others.forEach(c=>c.classList.remove('ins-before','ins-after'));
  if(!others.length)return;
  let i=others.findIndex(c=>{const r=c.getBoundingClientRect();return e.clientX<r.left+r.width/2});
  if(i<0) others[others.length-1].classList.add('ins-after');
  else others[i].classList.add('ins-before');
}
function clearMarks(lane){ (lane||document).querySelectorAll('.chip')
  .forEach(c=>c.classList.remove('ins-before','ins-after')); }
function laneOut(e){ e.currentTarget.classList.remove('over'); clearMarks(e.currentTarget); }

function laneDrop(e,lane){
  e.preventDefault(); e.currentTarget.classList.remove('over'); clearMarks();
  const name=DRAG||e.dataTransfer.getData('text/plain'); DRAG=null;
  if(!name)return;
  const idx=insertAt(e.currentTarget,e.clientX,name);
  FLOW.order=FLOW.order.filter(n=>n!==name);
  if(lane==='order'){
    FLOW.order.splice(Math.min(idx,FLOW.order.length),0,name);
  } else {
    // Out of the pipeline: drop every prerequisite edge that mentions it, otherwise the
    // save is rejected for referring to an agent that can never run.
    delete FLOW.requires[name];
    Object.keys(FLOW.requires).forEach(k=>{
      FLOW.requires[k]=FLOW.requires[k].filter(d=>d!==name);
      if(!FLOW.requires[k].length) delete FLOW.requires[k];
    });
  }
  if(FLOW.sel&&!FLOW.order.includes(FLOW.sel)) FLOW.sel=null;
  renderFlow();
}
function insertAt(laneEl,clientX,moving){
  const chips=[...laneEl.querySelectorAll('.chip')].filter(c=>c.dataset.name!==moving);
  for(let i=0;i<chips.length;i++){
    const r=chips[i].getBoundingClientRect();
    if(clientX < r.left+r.width/2) return i;
  }
  return chips.length;
}

async function saveFlow(){
  try{ await api('/config/flow',{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify({order:FLOW.order,requires:FLOW.requires,supervisor_picks:FLOW.picks})});
       flash('fv','saved'); loadGraph(); }
  catch(e){ flash('fv',e.message,true); }
}

// ---------------- editable config ----------------
var CFG=null;
// Which entries are expanded. Kept across re-renders so a save does not collapse the
// card you are working in.
var OPEN={agent:new Set(), post:new Set(), tool:new Set()};

function firstSentence(t,cap){
  const s=String(t||'').replace(/\s+/g,' ').trim();
  const cut=s.indexOf('. ');
  const out=(cut>0&&cut<cap)?s.slice(0,cut+1):s;
  return out.length>cap?out.slice(0,cap-1).replace(/\s\S*$/,'')+'…':out;
}

function togglePerm(kind,name){
  OPEN[kind].has(name)?OPEN[kind].delete(name):OPEN[kind].add(name);
  renderPerms();
}

async function loadPerms(){
  CFG=await api('/config'); META=await api('/meta');
  renderPerms();
  loadGraph();               // refetch: a save may have changed the topology
}

function entry(kind,name,{badges='',summary='',chips='',body='',ro=false,actions=''}){
  const open=OPEN[kind].has(name);
  const tog=ro?'':`onclick="togglePerm('${kind}','${esc(name)}')"`;
  return `<div class="card ent ${ro?'ro':''}">
    <header ${tog}>
      ${ro?'':`<span class="caret ${open?'open':''}">▶</span>`}
      <b>${esc(name)}</b>${badges}
      <span class="grow"></span>
      ${actions}

function renderPerms(){
  const eff=CFG.effective, over=CFG.overridden_keys;

  const supCard=entry('agent','supervisor',{
    ro:true,

        font-weight:600;margin:10px 0 4px">Tools it may call</p>

  }).join('');

  const postCards=Object.entries(eff.post_agents||{}).map(([name,a])=>{

      <p class="note">Tools are disabled, and not merely unchecked: a post-synthesis agent

    return entry('post',name,{

      summary:esc(firstSentence(a.prompt,190)),
      chips:'<span class="tchip none">no tools — it transforms the report</span>',

  const toolCards=META.tools.map(t=>{
    const overridden=!!eff.tool_descriptions[t.name];
    const used=Object.entries(eff.agents).filter(([,a])=>(a.tools||[]).includes(t.name))
      .map(([n])=>n);

    const body=`

      <div class="row">
        ${(TYPEMETA.builtin_fields||[]).map(b=>`<label class="tchip ${

        <input type="text" style="max-width:150px" value="${esc(f.key)}" placeholder="azimuth"
          oninput="TYPEDRAFT['${esc(k)}'].fields[${fi}].key=this.value">
        <input type="text" style="max-width:190px" value="${esc(f.label||'')}" placeholder="label, e.g. Azimuth °"
          oninput="TYPEDRAFT['${esc(k)}'].fields[${fi}].label=this.value">
        <input type="text" style="max-width:150px" value="${esc(f.default??'')}" placeholder="default (optional)"
          oninput="TYPEDRAFT['${esc(k)}'].fields[${fi}].default=this.value">

const fldT=(span,label,inner)=>`<div class="fd" style="grid-column:span ${span}">
  <span>${label}</span>${inner}</div>`;

function setBuiltin(k,b,on){
  (TYPEDRAFT[k].builtin=TYPEDRAFT[k].builtin||{})[b]=on;
  renderTypes();
}

function addField(k){ (TYPEDRAFT[k].fields=TYPEDRAFT[k].fields||[])
  .push({key:'',label:'',default:''}); renderTypes(); }
function rmField(k,i){ TYPEDRAFT[k].fields.splice(i,1); renderTypes(); }

function addType(){
  const n=($('#newtype').value||'').trim().toLowerCase();
  if(!n)return;
  if(!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(n))return alert('lowercase letters, digits, - or _');
  if(TYPEDRAFT[n])return alert(`"${n}" already exists`);
  TYPEDRAFT[n]={label:n,role:'sensor',domain:'',scheme:'tcp',fields:[]};
  renderTypes();
}

function rmType(k){
  // Components of this type do not vanish — bucket() keeps them visible under a
  // "type no longer defined" heading — but say so rather than let it surprise them.
  const used=(INV.systems||[]).flatMap(sy=>sy.components||sy.sensors||[])
    .filter(c=>c.type===k||sectionOf(c)===k).length;
  if(!confirm(`Remove the "${k}" type?`
    +(used?`\n\n${used} existing component${used===1?' uses':'s use'} it. They are kept, and `
           +`appear under "${k} (type no longer defined)" until you move them.`
          :'\n\nNothing uses it.')))return;
  delete TYPEDRAFT[k]; renderTypes();
}

async function saveTypes(){
  const payload=JSON.parse(JSON.stringify(TYPEDRAFT)); delete payload.__err;
  try{
    const r=await api('/inventory/types',{method:'PUT',
      headers:{'content-type':'application/json'},body:JSON.stringify({types:payload})});
    INVTYPES=r.types; TYPEMETA=r; TYPEDRAFT=null; rebuildSections(); renderInv();
  }catch(e){
    TYPEDRAFT.__err=e.message; renderTypes();
    const box=$('#typeerr'); if(box)box.scrollIntoView({block:'center'});
  }
}

// ---- read-only summary, expanded in place ----
const detailBox=()=>$(EDIT&&EDIT.isNew?'#sysnew':'#sysinline');

function viewSys(n){
  if(EDIT&&EDIT.orig!==n&&!discardOk())return;
  VIEW=n; EDIT=null;
  const sy=INV.systems.find(x=>x.name===n);
  openDefaults(sy?(sy.components||sy.sensors||[]):[]);
  renderInv();
}
function toggleSys(n){ (VIEW===n&&!EDIT) ? closeView() : viewSys(n); }

// Collapsing used to discard an open editor without a word, so a failed save looked
// like a successful one whose changes vanished.
function discardOk(){
  return !EDIT || confirm('Discard the unsaved changes to this system?');
}
function closeView(){ if(!discardOk())return; VIEW=null; EDIT=null; renderInv(); }

// A system is presented as the categories a rig actually has — radar, camera, acoustic,
// computers — rather than one flat list. Purely a view over `role` and `domain`: the
// stored model is unchanged, so routing and the agent-facing inventory are untouched.
// `other` is last and catches everything, so nothing a system holds can be hidden by a
// category nobody thought of.
// The sections ARE the component types, and the catalogue is operator-editable — so a
// new kind of hardware becomes a section by being defined, not by a code change.
// SECTIONS is rebuilt from it; the built-in five are the defaults the server ships.
var INVTYPES={}, SECTIONS=[];

function rebuildSections(){
  SECTIONS=Object.entries(INVTYPES).map(([key,t])=>({
    key, label:t.label||key, fields:t.fields||[],
    // `type` is REQUIRED by the server, so a section prefills it where the section
    // itself answers the question — adding an acoustic sensor and then being told it
    // "needs a hardware type" is asking twice. A type whose name is generic (computers,
    // other) deliberately leaves it blank and the field is marked required.
    add:{role:t.role||'sensor', domain:t.domain||'', scheme:t.scheme||'',
         type:(t.domain||'')===key?key:'',
         fields:Object.fromEntries((t.fields||[])
           .filter(f=>f.default!==''&&f.default!=null).map(f=>[f.key,f.default]))}}));
  if(!SECTIONS.length)SECTIONS=[{key:'other',label:'Other',fields:[],add:{role:'other'}}];
}
var SEC_OPEN=new Set();

// A component belongs to the type it declares. Falling back to domain and then role
// keeps registries written before the catalogue existed rendering in the right place.
function sectionOf(c){
  const keys=SECTIONS.map(s=>s.key);
  if(keys.includes(c.type)) return c.type;
  if(keys.includes(c.domain)) return c.domain;
  const byRole=SECTIONS.find(s=>(INVTYPES[s.key]||{}).role===c.role&&!INVTYPES[s.key].domain);
  if(byRole) return byRole.key;
  // Last resort must be a real string: an undefined key buckets every component into
  // one nameless group, which renders as nothing at all.
  return keys.includes('other')?'other':(keys[keys.length-1]||'other');
}

function typeFields(c){ return (INVTYPES[sectionOf(c)]||{}).fields||[]; }
// Whether this component's type shows a given standard field. Unknown types and
// catalogues saved before a field existed default to showing it: an invisible field is
// a worse failure than an extra one.
function showsField(c,key){
  const b=(INVTYPES[sectionOf(c)]||{}).builtin;
  return !b || b[key]!==false;
}
function bucket(comps){
  const m=Object.fromEntries(SECTIONS.map(s=>[s.key,[]]));
  // Created on demand: a component can name a type the catalogue no longer has — an
  // operator renamed or deleted it — and that component must still be visible and
  // editable rather than disappearing into an exception.
  (comps||[]).forEach((c,i)=>{const k=sectionOf(c); (m[k]=m[k]||[]).push({c,i});});
  return m;
}
function openDefaults(comps){
  SEC_OPEN=new Set(Object.entries(bucket(comps)).filter(([,v])=>v.length).map(([k])=>k));
}
function toggleSec(k){
  SEC_OPEN.has(k)?SEC_OPEN.delete(k):SEC_OPEN.add(k);
  if(EDIT) renderEdit(); else renderView();
}
const secHead=(sec,n,extra='')=>`<header onclick="toggleSec('${sec.key}')">
   <span class="caret ${SEC_OPEN.has(sec.key)?'open':''}">▶</span>
   <b>${esc(sec.label)}</b>
   <span class="dim">${n||'none'}</span><span class="grow"></span>${extra}</header>`;

function renderView(){
  const sy=INV.systems.find(x=>x.name===VIEW);
  if(!sy){ VIEW=null; return; }
  const box=detailBox(); if(!box)return;
  const groups=bucket(sy.components||sy.sensors||[]);

  const body=SECTIONS.map(sec=>{
    const items=groups[sec.key];
    if(!items.length && sec.key==='other') return '';      // no empty catch-all
    return `<div class="secg${items.length?'':' empty'}">
      ${secHead(sec,items.length)}
      ${SEC_OPEN.has(sec.key)&&items.length?`<div class="scroll"><table>
        <tr><th>name</th><th>type</th><th>address</th><th>web</th><th>hardware</th>
            <th>version</th><th>access</th></tr>
        ${items.map(({c})=>`<tr>
          <td class="mono">${esc(c.name)}</td>
          <td class="mono dim">${esc(c.type||'—')}</td>
          <td class="mono">${addrOf(c)}</td>
          <td class="mono dim">${esc(c.web||'—')}</td>
          <td>${esc(c.hardware||'—')}</td>
          <td class="mono dim">${esc(c.software_version||'—')}</td>
          <td class="dim">${esc(accessOf(c))}</td></tr>`).join('')}
      </table></div>`:''}
    </div>`;}).join('');

  box.innerHTML=`
   <div class="inline">
     ${sy.description?`<p class="note">${esc(sy.description)}</p>`:''}
     ${body}
     <p class="note">Read-only. Click <b>Edit</b> on the row above to change anything —
       passwords included, which are shown masked there and never written to the registry
       file.</p>
   </div>`;
}

// ---- dense editor ----
function newSys(){
  const n=$('#newsys').value.trim(); if(!n)return;
  if(!/^[a-z][a-z0-9_-]{0,63}$/.test(n)) return alert('lowercase letters, digits, - or _');
  EDIT={name:n,orig:n,site:'',lat:null,lon:null,description:'',components:[],
        isNew:true,sections:new Set()}; VIEW=null;
  renderInv();
}
function editSys(n){
  const sy=INV.systems.find(x=>x.name===n);
  EDIT=JSON.parse(JSON.stringify({name:sy.name,orig:sy.name,site:sy.site,
    lat:sy.lat,lon:sy.lon,description:sy.description,host:sy.host||'',config:sy.config||'',
    components:(sy.components||sy.sensors||[]).map(c=>({...c,ssh:c.ssh||{},
                                                        fields:c.fields||{}})),isNew:false}));
  // Which sections this system shows: the ones it uses. Everything else is off the
  // page until somebody adds it — a tower with no acoustic sensor should not carry an
  // empty Acoustic heading forever.
  EDIT.sections=new Set(EDIT.components.map(sectionOf));
  VIEW=n; openDefaults(EDIT.components); renderInv();
}
function cancelEdit(){ EDIT=null; renderInv(); }

// Component names share ONE namespace across every system — that is what a tool
// argument resolves against — so the next number is the next free one across the whole
// inventory, not per system. Otherwise two systems would both get a "1" and the
// registry would stop loading.
function nextName(){
  const used=new Set();
  (INV.systems||[]).forEach(sy=>(sy.components||sy.sensors||[])
    .forEach(c=>used.add(String(c.name))));
  (EDIT?EDIT.components:[]).forEach(c=>used.add(String(c.name)));
  let n=1; while(used.has(String(n))) n++;
  return String(n);
}

function addComp(key){
  const sec=SECTIONS.find(s=>s.key===key)||SECTIONS[0];
  EDIT.components.push({name:nextName(),type:'',domain:'',address:'',port:null,
                        hardware:'',software_version:'',web:'',ssh:{},fields:{},
                        role:'sensor', ...JSON.parse(JSON.stringify(sec.add))});
  SEC_OPEN.add(sec.key);
  if(EDIT.sections)EDIT.sections.add(sec.key);
  renderEdit();
}
function addSection(k){ (EDIT.sections=EDIT.sections||new Set()).add(k);
  SEC_OPEN.add(k); renderEdit(); }
function dropSection(k){
  // Guarded anyway: the × is only rendered on an empty section, but renderEdit() is
  // not the only thing that could call this.
  if((bucket(EDIT.components)[k]||[]).length)return;
  EDIT.sections.delete(k); SEC_OPEN.delete(k); renderEdit();
}

function rmComp(i){
  const c=EDIT.components[i]||{};
  // Asked for, because Remove is next to the fields you were just typing into and an
  // accidental click otherwise silently drops a node the agent can address.
  if(!confirm(`Remove ${c.name?`"${c.name}"`:'this component'} from this system?`
             +`\n\nIt stops being addressable once you save.`))return;
  EDIT.components.splice(i,1); renderEdit();
}
const setF=(i,k,v)=>{ (EDIT.components[i].fields=EDIT.components[i].fields||{})[k]=v; };
const setS=(i,k,v)=>{ EDIT.components[i][k]=v; };
const setSsh=(i,k,v)=>{ (EDIT.components[i].ssh=EDIT.components[i].ssh||{})[k]=v; };

function renderEdit(){
  const box=detailBox(); if(!box)return;
  const fld=(span,label,inner)=>`<div class="fd" style="grid-column:span ${span}">
    <span>${label}</span>${inner}</div>`;
  // "-" rather than a worked example: an empty field should read as "nothing here",
  // not as a value somebody might mistake for a default.
  const txt=(i,k)=>`<input type="text" value="${esc(EDIT.components[i][k]??'')}"
    placeholder="-" oninput="setS(${i},'${k}',this.value)">`;
  const num=(i,k)=>`<input type="number" min="1" max="65535"
    value="${EDIT.components[i][k]??''}" placeholder="-"
    oninput="setS(${i},'${k}',this.valueAsNumber)">`;

  // Role, domain and scheme are set by the section a component is added into, so they
  // are not fields here — the section IS the choice. A component therefore stays in the
  // section it was created in; move it by removing and re-adding.
  const compCard=(c,i)=>{
    const ssh=c.ssh||{}, fromEnv=ssh.password_in_environment, role=c.role||'sensor';
    return `<div class="comp">
      <header>${roleTag(role)}<b>${esc(c.name||'unnamed')}</b>
        <span class="dim" style="font:11px var(--mono)">${esc(c.type||'—')}</span>
        <span class="grow"></span>
        <button class="sm no" onclick="rmComp(${i})">Remove</button></header>
      <div class="fg">
        ${fld(3,'Name',txt(i,'name'))}
        ${fld(4,'Hardware type <b class="req">required</b>',
          `<input type="text" list="types-${esc(role)}" id="type-${i}"
          class="${(c.type||'').trim()?'':'missing'}"
          value="${esc(c.type??'')}" placeholder="what it is, e.g. magos / axis"
          oninput="setS(${i},'type',this.value);this.classList.toggle('missing',!this.value.trim())">`)}
        ${showsField(c,'address')?fld(3,'IP address',txt(i,'address')):''}
        ${showsField(c,'port')?fld(2,'Port',num(i,'port')):''}

        ${showsField(c,'hardware')?fld(3,'Hardware model',txt(i,'hardware')):''}
        ${showsField(c,'software_version')?fld(2,'Version',txt(i,'software_version')):''}
        ${showsField(c,'web')?fld(4,'Web address',txt(i,'web')):''}
        ${showsField(c,'ssh')?fld(3,'Username',`<input type="text" value="${esc(ssh.user??'')}"
          placeholder="-" oninput="setSsh(${i},'user',this.value)">`):''}

        ${typeFields(c).map(f=>fld(3,esc(f.label||f.key),
          `<input type="text" value="${esc((c.fields||{})[f.key]??'')}"
            placeholder="${esc(f.default!==''&&f.default!=null?String(f.default):'-')}"
            oninput="setF(${i},'${esc(f.key)}',this.value)">`)).join('')}
        ${showsField(c,'location')?fld(2,'Latitude',`<input type="number" step="any"
          value="${c.lat??''}" placeholder="-"
          oninput="setS(${i},'lat',this.valueAsNumber)">`):''}
        ${showsField(c,'location')?fld(2,'Longitude',`<input type="number" step="any"
          value="${c.lon??''}" placeholder="inherits the system"
          oninput="setS(${i},'lon',this.valueAsNumber)">`):''}

        ${!showsField(c,'ssh')?'':fld(4,'Password',`<div class="pwrow">
          <input type="password" id="pw-${i}" value="${esc(ssh.password??'')}"
            ${fromEnv?'disabled':''} placeholder="-"
            oninput="setSsh(${i},'password',this.value)">
          <button class="sm" type="button" onclick="togglePw(${i})">show</button>
          ${ssh.password&&!fromEnv?`<button class="sm no" type="button" onclick="clearPw(${i})">clear</button>`:''}
        </div>`)}
      </div>
      ${!showsField(c,'ssh')?'':`<p class="note">Stored as
        <code>${esc(ssh.password_env||'(derived from the name on save)')}</code>
        ${fromEnv?'<span class="badge">from environment</span>':''} —
        a password typed here goes to the secrets file, never to the registry.</p>`}
    </div>`;};

  const groups=bucket(EDIT.components);
  // Only the sections this system uses. A tower with no acoustic sensor carrying an
  // empty Acoustic heading forever is noise, and it makes every system look alike.
  EDIT.sections=EDIT.sections||new Set(EDIT.components.map(sectionOf));
  EDIT.components.forEach(c=>EDIT.sections.add(sectionOf(c)));
  const known=SECTIONS.map(s=>s.key);
  // A section for a type that no longer exists, so its components stay reachable.
  const orphans=[...new Set(EDIT.components.map(sectionOf))].filter(k=>!known.includes(k))
    .map(k=>({key:k,label:k+' (type no longer defined)',fields:[],add:{}}));
  const shown=[...SECTIONS,...orphans].filter(sec=>EDIT.sections.has(sec.key));
  const body=shown.map(sec=>{
    const items=groups[sec.key];
    const add=`<button class="sm" onclick="event.stopPropagation();addComp('${sec.key}')">
      + Add ${esc(sec.label.toLowerCase())}</button>`
      // Only an EMPTY section can be dropped: removing one with components in it would
      // be deleting hardware behind a heading, which is not what "hide this" means.
      +(items.length?'':`<button class="sm no" title="remove this section"
        onclick="event.stopPropagation();dropSection('${sec.key}')">×</button>`);
    return `<div class="secg${items.length?'':' empty'}">
      ${secHead(sec,items.length,add)}
      ${SEC_OPEN.has(sec.key)?`<div class="secbody">
        ${items.map(({c,i})=>compCard(c,i)).join('')
          ||'<p class="note">Nothing here yet.</p>'}</div>`:''}
    </div>`;}).join('')
    + (()=>{
        const rest=SECTIONS.filter(sec=>!EDIT.sections.has(sec.key));
        if(!rest.length)return '';
        return `<div class="row" style="margin-top:8px;align-items:baseline">
          <span class="note">Add a section:</span>
          ${rest.map(sec=>`<button class="sm" onclick="addSection('${sec.key}')">
            + ${esc(sec.label)}</button>`).join('')}</div>`;
      })();

  box.innerHTML=`
   <div class="inline">
     <header>${EDIT.isNew?'<b>New system</b>':''}
       <span class="grow"></span><span class="saved" id="iv"></span></header>
     <div class="fg" style="margin-bottom:12px">
       ${fld(3,'Name',`<input type="text" value="${esc(EDIT.name??'')}"
         placeholder="lowercase, e.g. tower1" oninput="EDIT.name=this.value">`)}
       ${fld(2,'Site',`<input type="text" value="${esc(EDIT.site??'')}" placeholder="beit-yanai"
         oninput="EDIT.site=this.value">`)}
       ${fld(2,'Latitude',`<input type="number" step="any" value="${EDIT.lat??''}"
         placeholder="32.3891" oninput="EDIT.lat=this.valueAsNumber">`)}
       ${fld(2,'Longitude',`<input type="number" step="any" value="${EDIT.lon??''}"
         placeholder="34.8703" oninput="EDIT.lon=this.valueAsNumber">`)}
       ${fld(6,'Description',`<input type="text" value="${esc(EDIT.description??'')}"
         placeholder="model-visible; no secrets" oninput="EDIT.description=this.value">`)}
       ${fld(3,'Gotcha runs on',`<select onchange="EDIT.host=this.value"
         title="every check for this system runs on this component, over SSH">
         <option value="">— none (checks run on this server)</option>
         ${EDIT.components.filter(c=>(c.name||'').trim()).map(c=>`<option value="${esc(c.name)}"
           ${c.name===EDIT.host?'selected':''}>${esc(c.name)}${c.address?` · ${esc(c.address)}`:''}</option>`).join('')}
         </select>`)}
       ${fld(5,'Config path on it',`<input type="text" value="${esc(EDIT.config??'')}"
         placeholder="~/gotcha30/configs/site.yaml" oninput="EDIT.config=this.value"
         title="this system's own gotcha config, read over SSH from the machine above">`)}
     </div>
     ${body}
     ${EDIT.error?`<div class="alert" id="syserr"><b>Not saved.</b> ${esc(EDIT.error)}</div>`:''}
     <div class="row" style="margin-top:10px">
       <button class="sm yes" onclick="saveSys()">Save system</button>
       <button class="sm" onclick="${EDIT.isNew?'cancelEdit()':`viewSys('${esc(EDIT.orig)}')`}">Cancel</button>
     </div>
   </div>`;
}

function togglePw(i){
  const el=$('#pw-'+i); if(!el)return;
  const showing=el.type==='text';
  el.type=showing?'password':'text';
  el.nextElementSibling.textContent=showing?'show':'hide';
}
function clearPw(i){ setSsh(i,'password',''); setSsh(i,'clear_password',true); renderEdit(); }

// Catch the one required field the form can check itself. The server enforces it too —
// this is not the guarantee, it is the difference between "Not saved: component '1'
// needs a hardware type" appearing under a form you have scrolled past, and the field
// itself being marked before anything is sent.
function missingTypes(){
  return (EDIT.components||[])
    .map((c,i)=>({name:c.name,i,sec:sectionOf(c)}))
    .filter(x=>!((EDIT.components[x.i].type||'').trim()));
}

async function saveSys(){
  const bad=missingTypes();
  if(bad.length){
    bad.forEach(x=>SEC_OPEN.add(x.sec));          // do not hide the field being complained about
    EDIT.error=`${bad.length>1?'These components need':'Component '+JSON.stringify(bad[0].name)+' needs'}`
      +` a hardware type${bad.length>1?': '+bad.map(x=>x.name).join(', '):''} — it is what a tool `
      +`resolves against, so the registry will not load without it.`;
    renderEdit();
    const f=$('#type-'+bad[0].i);
    if(f){ f.scrollIntoView({block:'center'}); f.focus(); }
    return;
  }
  const num=v=>Number.isFinite(v)?v:null;
  const payload={new_name:(EDIT.name||'').trim(),
    site:EDIT.site||null,description:EDIT.description||null,
    host:EDIT.host??'', config:(EDIT.config??'').trim(),
    lat:num(EDIT.lat), lon:num(EDIT.lon),
    components:EDIT.components.map(c=>({
      name:(c.name||'').trim(), type:(c.type||'').trim(), role:c.role||'sensor',
      domain:c.domain||null, address:c.address||null,
      port:Number.isFinite(c.port)?c.port:null, scheme:c.scheme||null,
      hardware:c.hardware||null, software_version:c.software_version||null,
      web:c.web||null, description:c.description||null,
      lat:num(c.lat), lon:num(c.lon),
      // Everything recorded, not just what the type currently declares. Sending only
      // the declared keys meant reverting the catalogue — or renaming a field — turned
      // the next save of an unrelated system into a silent delete of values nobody
      // could see to rescue. Invisible-but-kept is recoverable from the YAML; deleted
      // is not, so a stale key is the better failure.
      fields:Object.fromEntries(Object.entries({
          ...(c.fields||{}),
          ...Object.fromEntries(typeFields(c).map(f=>[f.key,(c.fields||{})[f.key]])),
        }).filter(([,v])=>v!==undefined&&v!==null&&v!=='')),
      // Only what the form edits. Sending back the SSH port and key file would
      // round-trip values nobody can see — and one stale bad value would then block
      // every save of an unrelated field. The server keeps them.
      ssh:(c.ssh&&(c.ssh.user||c.ssh.password||c.ssh.password_env||c.ssh.clear_password))?{
        user:c.ssh.user||null, password_env:c.ssh.password_env||null,
        password:c.ssh.password||null, clear_password:!!c.ssh.clear_password}:null}))};
  try{
    // Address what exists; new_name carries the rename. Re-open whatever the server
    // ended up calling it.
    INV=await api('/inventory/system/'+EDIT.orig,{method:'PUT',
      headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    EDIT=null; VIEW=INV.name||null; renderInv();
  }catch(e){
    // Sticky and next to the button, not a flash in a header that may be scrolled
    // out of view — a save that failed silently reads exactly like one that worked.
    // Scrolled to as well: "sticky next to the button" is no use under a long form the
    // operator is looking at the top of, which is what made this read as "it just
    // does not save".
    EDIT.error=e.message; renderEdit();
    const box=$('#syserr'); if(box) box.scrollIntoView({block:'center'});
  }
}

async function delSys(n){
  if(!confirm(`Delete system "${n}"? Its components stop being addressable by the agent.`))return;
  try{ const r=await api('/inventory/system/'+n,{method:'DELETE'});
       INV=r; EDIT=null; VIEW=null; renderInv();
       if(r.orphaned_secrets?.length)
         alert('Deleted. These stored secrets were kept, in case you still need them:\n\n'
               +r.orphaned_secrets.join('\n'));
  }catch(e){ alert(e.message); }
}

const flash=(id,msg,bad)=>{const e=$('#'+id); if(!e)return; e.textContent=msg;
  e.className='saved '+(bad?'bad':'ok'); setTimeout(()=>e.textContent='',2500)};

async function saveAgent(name){
  const tools=[...document.querySelectorAll(`input[data-a="${name}"]:checked`)].map(i=>i.value);
  try{ await api('/config/agent/'+name,{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify({prompt:$('#ap-'+name).value,tools})});
       flash('sv-'+name,'saved'); loadPerms(); }
  catch(e){ flash('sv-'+name,e.message,true); }
}
async function addAgent(){
  const n=$('#na').value.trim(); if(!n)return;
  try{ await api('/config/agent/'+n,{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify({prompt:'Describe what this agent should do.',tools:[META.tools[0].name]})});
       loadPerms(); }
  catch(e){ alert(e.message); }
}
async function delAgent(n){
  if(!confirm(`Delete agent "${n}"?`))return;
  try{ await api('/config/agent/'+n,{method:'DELETE'}); loadPerms(); }
  catch(e){ alert(e.message); }
}
async function savePost(n){
  try{ await api('/config/post_agent/'+n,{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify({description:$('#pa-'+n).value})}); flash('pv-'+n,'saved'); }
  catch(e){ flash('pv-'+n,e.message,true); }
}
async function saveTool(n){
  try{ await api('/config/tool/'+n,{method:'PUT',headers:{'content-type':'application/json'},
         body:JSON.stringify({description:$('#td-'+n).value})}); flash('tv-'+n,'saved'); }
  catch(e){ flash('tv-'+n,e.message,true); }
}
async function resetTool(n){
  await api('/config/tool/'+n,{method:'PUT',headers:{'content-type':'application/json'},
    body:JSON.stringify({description:''})}); loadPerms();
}
async function saveCmds(confirmed){
  const commands={};
  for(const l of $('#cmds').value.split('\n')){
    if(!l.trim())continue; const i=l.indexOf(':');
    if(i<0){flash('cv','line missing ":" → '+l,true);return;}
    commands[l.slice(0,i).trim()]=l.slice(i+1).trim().split(/\s+/).filter(Boolean);
  }
  try{
    const r=await api('/config/commands',{method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({commands,confirm:confirmed})});
    if(r.needs_confirmation){
      if(confirm('Warning:\n\n'+r.warnings.join('\n\n')+'\n\nSave anyway?')) return saveCmds(true);
      return;
    }
    flash('cv','saved'); loadPerms();
  }catch(e){ flash('cv',e.message,true); }
}
async function resetAll(){
  if(!confirm('Discard every override and return to the code defaults?'))return;
  await api('/config/reset',{method:'POST'}); loadPerms();
}
async function showAudit(){
  const {entries}=await api('/config/audit');
  $('#auditbox').innerHTML=entries.length?`<div class="scroll"><table>
    <tr><th>when</th><th>by</th><th>change</th></tr>
    ${entries.map(e=>`<tr><td class="mono dim">${new Date(e.ts*1000).toLocaleString()}</td>
      <td class="mono">${esc(e.by)}</td><td>${esc(e.change)}</td></tr>`).join('')}</table></div>`
    : '<p class="note">No changes recorded.</p>';
}
Object.assign(window,{decide,rmAtt,startAddTopic,cancelAddTopic,kbFilterTopic,kbFilterDates,kbSort,kbClear,toggleTrace,filterTraces,sortTraces,clearTraceFilters,toggleAllTraces,loadChat,submitChat,openChat,
  showKb,toggleKb,closeKb,saveKb,newKb,delKb,
  slugify,previewSlug,addSym,rmSym,renderTopics,toggleTopic,addTopic,removeTopic,renderRemovable,
  saveAgent,addAgent,delAgent,saveFlow,savePost,saveTool,resetTool,saveCmds,resetAll,showAudit,
  togglePerm,renderPerms,
  loadGraph,renderFlow,pick,unlink,chipDrag,chipDrop,laneOver,laneOut,laneDrop,
  loadInv,newSys,editSys,viewSys,toggleSys,toggleSec,closeView,cancelEdit,addComp,rmComp,setS,setSsh,nextName,
  saveSys,delSys,togglePw,clearPw,
  // The type editor and per-system sections are driven from inline onclick handlers,
  // which resolve against window rather than the module scope.
  startTypes,cancelTypes,saveTypes,addType,rmType,addField,rmField,
  addSection,dropSection,setF,setBuiltin});
