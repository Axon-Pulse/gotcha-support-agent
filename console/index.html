<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gotcha support console</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a18;--dim:#6b6b66;--line:#e2e2dd;--card:#fff;--sunk:#f4f4f1;
      --ok:#1f7a4d;--warn:#9a6a00;--bad:#a32b2b;--accent:#2f5fd0;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
      --r:10px;--r-sm:7px;--t:170ms cubic-bezier(.2,.7,.3,1);
      --sh1:0 1px 2px rgba(20,20,18,.06),0 1px 3px rgba(20,20,18,.05);
      --sh2:0 6px 16px rgba(20,20,18,.10),0 2px 5px rgba(20,20,18,.07);
      --tint:rgba(47,95,208,.09);--tint-w:rgba(154,106,0,.11);--ring:rgba(47,95,208,.28);
      --bar:#2f5fd0;--grid:#ececE8;
      --radar:#5f7896;--camera:#6b8560;--acoustic:#7e6b94;--hub:#7d8a52}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#e8e8e4;--dim:#9a9a94;--line:#2c2e33;
      --card:#1d1f23;--sunk:#141518;--ok:#5fd39b;--warn:#e0b050;--bad:#f08a8a;--accent:#7aa2f7;
      --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 6px 18px rgba(0,0,0,.5);
      --radar:#7f96b2;--camera:#8fa383;--acoustic:#9c8bb0;--hub:#A4B27C;
      --tint:rgba(122,162,247,.14);--tint-w:rgba(224,176,80,.14);--ring:rgba(122,162,247,.4);
      --bar:#7aa2f7;--grid:#26282d}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,sans-serif;
     margin:0;padding:0 16px 48px}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0 12px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 8px 0 0;font-weight:650;letter-spacing:-.01em}
.pill{font:11px/1 var(--mono);padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);
  background:none;cursor:default;white-space:nowrap}
button.pill{cursor:pointer}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.grow{margin-left:auto}
nav{display:flex;gap:2px;margin:14px 0 18px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:6px 12px;
  font:inherit;color:var(--dim);cursor:pointer;transition:background var(--t),color var(--t),border-color var(--t)}
nav button:hover{color:var(--fg);background:var(--tint)}
nav button[aria-selected=true]{background:var(--card);border-color:var(--line);color:var(--fg);
  font-weight:600;box-shadow:var(--sh1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh1);min-width:0}
.card h3{margin:0 0 8px;font-size:13px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],textarea,select{
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 10px;font:inherit;transition:border-color var(--t),box-shadow var(--t);min-width:0}
input[type=text],input[type=search]{flex:1}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:none;
  border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
textarea{font:12.5px/1.5 var(--mono);width:100%;min-height:120px;resize:vertical}
textarea.prose{font:13.5px/1.6 system-ui,-apple-system,sans-serif}
textarea.tall{min-height:520px}
button.go{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:8px 15px;
  font:inherit;font-weight:600;cursor:pointer;box-shadow:var(--sh1);transition:filter var(--t)}
button.go:hover:not(:disabled){filter:brightness(1.08)}
button.go:disabled{opacity:.45;cursor:not-allowed}
button.sm{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;transition:background var(--t),border-color var(--t)}
button.sm:hover:not(:disabled){background:var(--tint);border-color:var(--accent)}
button.sm:disabled{opacity:.45;cursor:not-allowed}
button.sm.yes{border-color:var(--ok);color:var(--ok)}
button.sm.no{border-color:var(--bad);color:var(--bad)}
code,pre{font-family:var(--mono)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;
  overflow:auto;font-size:12px;margin:6px 0;max-height:420px;white-space:pre-wrap;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer;transition:background var(--t)}
tr.click:hover,tr.click.open{background:var(--tint)}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:12.5px;color:var(--dim);margin:6px 0}
.hint{font-size:12px;color:var(--dim);margin:8px 0 4px}
.saved{font-size:12px;margin-left:8px}
.tchip{display:inline-block;font:11px var(--mono);padding:3px 8px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);margin:0 5px 5px 0;white-space:nowrap;background:none}
.tchip.on{border-color:var(--accent);color:var(--accent)}
button.tchip{cursor:pointer;transition:border-color var(--t),color var(--t),background var(--t)}
button.tchip:hover{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.badge{font:10.5px/1 var(--mono);padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
.badge.run{border-color:var(--accent);color:var(--accent)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;min-width:0}
fieldset>input[type=text]{width:100%}
legend{font:11px/1 var(--mono);color:var(--dim);padding:0 6px;text-transform:uppercase;letter-spacing:.06em}
.sym{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.alert{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);
  border-radius:var(--r-sm);padding:9px 12px;margin:10px 0;font-size:12.5px}
.alert.warn{border-color:var(--warn);background:var(--tint-w)}
.alert.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px}
.side button{display:block;width:100%;text-align:left;margin-bottom:4px}
.side button.on{border-color:var(--accent);background:var(--tint)}
@media(max-width:720px){.split{grid-template-columns:1fr}}
/* conversations */
.turn{border-top:1px solid var(--line);padding:12px 0}
.turn:first-of-type{border-top:0}
.turn>header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.q{background:var(--sunk);border-radius:var(--r-sm);padding:9px 12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.a{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;overflow-wrap:anywhere}
.a pre{max-height:none}
.steps{margin-top:6px}
.steps>summary{cursor:pointer;font-size:12.5px;color:var(--dim)}
.step{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;margin:6px 0;background:var(--bg)}
.step.denied{border-color:var(--warn)}
.step.err{border-color:var(--bad)}
.step>.h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step>.h b{font:12px var(--mono);font-weight:650}
.step code.in{font-size:12px;overflow-wrap:anywhere}
.step details>summary{cursor:pointer;font-size:12px;color:var(--dim);margin-top:4px}
.step.text{border-style:dashed;font-size:13px;color:var(--dim)}
.caret{display:inline-block;color:var(--dim);font-size:9px;width:10px;transition:transform var(--t)}
.caret.open{transform:rotate(90deg)}
tr.detail>td{background:var(--sunk);padding:12px 16px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
/* sections editor */
.secrow{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:9px;background:var(--card)}
.secrow>.row{margin-bottom:6px}
.secrow>.row input{font-weight:600}
/* markdown preview */
.md h1{font-size:18px}.md h2{font-size:15px;margin-top:20px}.md h3{font-size:14px}
.md table{margin:8px 0}.md pre{max-height:none}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh1)}
.tile .l{font-size:12px;color:var(--dim)}
.tile .v{font-size:24px;font-weight:620;margin-top:2px}
.tile.hero .v{font-size:48px;line-height:1.1}
.tile .s{font-size:12px;color:var(--dim)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font:11px system-ui,sans-serif;fill:var(--dim);font-variant-numeric:tabular-nums}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .base{stroke:var(--line);stroke-width:1}
svg.chart .mark{fill:var(--bar)}
svg.chart .hit{fill:transparent;cursor:default}
svg.chart g.col:hover .mark{filter:brightness(1.15)}
svg.chart g.col:hover .hit{fill:var(--tint)}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);
  border-radius:var(--r-sm);padding:7px 10px;font-size:12px;white-space:nowrap;z-index:5;transform:translate(-50%,-100%)}
.tip b{font-weight:650}
.hbar{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 40px;gap:4px 10px;align-items:center;font-size:12.5px}
.hbar .track{height:14px}
.hbar .fill{height:14px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
/* sign-in, the code prompt, toasts, secrets */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 70%,transparent)}
.overlay[hidden]{display:none}
.overlay.solid{background:var(--bg);z-index:60}
.overlay .card{width:100%;max-width:400px;box-shadow:var(--sh2)}
.codein{font:600 22px/1 var(--mono);letter-spacing:.3em;text-align:center;width:100%;padding:10px}
.toasts{position:fixed;right:16px;bottom:16px;left:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:50;pointer-events:none}
.toast{pointer-events:auto;max-width:420px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);box-shadow:var(--sh2);padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}
.secretval{font-family:var(--mono);font-size:12.5px;word-break:break-all;user-select:all;background:var(--sunk);
  border-radius:5px;padding:2px 6px}
.masked{font-family:var(--mono);color:var(--dim);letter-spacing:.1em}
label.fld{display:inline-flex;flex-direction:column;gap:2px}
label.fld>span{font-size:11px;color:var(--dim)}
.tw-plan{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.tw-plan svg{background:radial-gradient(circle,var(--tint) 0,transparent 55%);max-width:100%;height:auto}
.tw-ring{fill:none;stroke:var(--dim);stroke-opacity:.35}
.tw-scale{font:10px var(--mono);fill:var(--dim)}
.tw-label{font:10px var(--mono);fill:var(--fg);opacity:.8}
.tw-hub{fill:var(--hub)}
.tw-key{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px}
.tw-north line{stroke:var(--dim);stroke-width:1.5}.tw-north path{fill:var(--dim)}
.tw-north text{font:10px var(--mono);fill:var(--dim)}
details.sys>summary,details.cat>summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
details.sys>summary{font-size:13.5px}
details.sys>summary::-webkit-details-marker,details.cat>summary::-webkit-details-marker{display:none}
details.sys>summary::before,details.cat>summary::before{content:'▸';color:var(--dim);transition:transform var(--t)}
details.sys[open]>summary::before,details.cat[open]>summary::before{transform:rotate(90deg)}
details.cat{margin-top:10px}
</style></head><body><div class="wrap">

<header class="top">
  <h1>Gotcha support console</h1>
  <span class="pill" id="who">…</span>
  <button class="pill" id="pkbtn" onclick="togglePasskeys()" hidden>passkeys</button>
  <button class="pill" id="logout" onclick="logout()" hidden>log out</button>
  <button class="pill" id="selftest" title="support-agent-skill/scripts/selftest.sh" onclick="runSelftest()">selftest …</button>
  <button class="pill grow" id="deploypill" onclick="openDeploy()">deploy …</button>
</header>

<div id="deploy"></div>
<div id="pkpanel"></div>

<nav id="tabs">
  <button data-t="convos" aria-selected="true">Conversations</button>
  <button data-t="cases" aria-selected="false">Cases</button>
  <button data-t="docs" aria-selected="false">Reference docs</button>
  <button data-t="stats" aria-selected="false">Stats</button>
  <button data-t="systems" aria-selected="false">Systems</button>
  <button data-t="bot" aria-selected="false">Bot config</button>
  <button data-t="secrets" aria-selected="false">Secrets</button>
</nav>

<section id="convos"></section>
<section id="cases" hidden></section>
<section id="docs" hidden></section>
<section id="stats" hidden></section>
<section id="systems" hidden></section>
<section id="bot" hidden></section>
<section id="secrets" hidden><div id="sec-access"></div><div id="sec-bot"></div></section>

<div class="overlay solid" id="login" hidden><div class="card">
  <h3>Sign in</h3>
  <p class="note" id="login-who"></p>
  <div id="login-form">
    <p class="note">Enter the 6-digit code from your authenticator app (or a recovery code).</p>
    <input class="codein" id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="row" style="margin-top:10px"><button class="go" onclick="doLogin()">Sign in</button>
      <button class="sm" id="login-pk" onclick="loginPasskey()" hidden>Sign in with passkey</button>
      <span class="saved bad" id="login-msg"></span></div>
  </div>
</div></div>

<div class="overlay" id="codedlg" hidden><div class="card">
  <h3>Confirm with your code</h3>
  <p class="note" id="codemsg"></p>
  <input class="codein" id="codein" inputmode="numeric" autocomplete="one-time-code" maxlength="9">
  <div class="row" style="margin-top:10px"><button class="go" id="codeok">Confirm</button>
    <button class="sm" id="codepk" hidden>Use passkey</button>
    <button class="sm" id="codecancel">Cancel</button></div>
</div></div>

<div class="toasts" id="toasts"></div>

</div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// For a value inside an inline handler's single-quoted JS string, inside an HTML attribute.
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const api=(p,o={})=>{
  if(o.body!==undefined&&typeof o.body!=='string'){
    o={...o,body:JSON.stringify(o.body),headers:{'content-type':'application/json','x-console':'1',...(o.headers||{})}};
  }else if(o.method&&o.method!=='GET'){
    o={...o,headers:{'content-type':'application/json','x-console':'1',...(o.headers||{})}};
  }
  return fetch('/api'+p,o).then(async r=>{
    if(!r.ok){ const d=(await r.json().catch(()=>({}))).detail||r.status;
      if(r.status===401&&d==='login'){ showLogin(AUTH); }
      throw new Error(d); }
    return r.json()});
};
const flash=(id,msg,bad)=>{const e=$('#'+id); if(!e)return; e.textContent=msg;
  e.className='saved '+(bad?'bad':'ok'); if(!bad)setTimeout(()=>{if(e.textContent===msg)e.textContent=''},3500)};
const fmtTime=ts=>ts?new Date(ts*1000).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fmtIso=s=>s?new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fmtCost=c=>typeof c==='number'?'$'+c.toFixed(2):'—';
const fmtSecs=s=>typeof s==='number'?(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'):'—';
const OUTCOME={ok:['ok','answered'],timeout:['warn','timed out'],error:['bad','error'],
  running:['run','running'],lost:['bad','no answer (bot stopped)'],unknown:['','unknown']};
const outcomeBadge=o=>{const [c,l]=OUTCOME[o]||['',o];return `<span class="badge ${c}">${esc(l)}</span>`};
var TAB='convos', POLL=null;
const TABS=['convos','cases','docs','stats','systems','bot','secrets'];

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
// The address says what is open (#convos/<thread>, #cases/<slug>, #stats), so a link to one
// conversation or one case can be sent to a teammate.
const setHash=h=>{ if(location.hash!=='#'+h) history.replaceState(null,'','#'+h); };
function showTab(t){
  TAB=t;
  if(decodeURIComponent(location.hash.slice(1)).split('/')[0]!==t) setHash(t);
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));
  clearReveals();
  TABS.forEach(s=>$('#'+s).hidden=(s!==t));
  ({convos:loadConvos,cases:loadCases,docs:loadDocs,stats:loadStats,systems:loadSystems,bot:loadBot,
    secrets:loadSecrets}[t])();
}

// ------------------------------------------------------------------ Slack mrkdwn, minimal
function mrkdwn(t){
  const parts=String(t||'').split('```');
  return parts.map((p,i)=>{
    if(i%2) return `<pre dir="ltr">${esc(p.replace(/^\n/,''))}</pre>`;
    return p.split('\n').map(line=>{
      let h=esc(line)
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,:;!?]|$)/g,'$1<b>$2</b>')
        .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,:;!?]|$)/g,'$1<i>$2</i>');
      return `<div dir="auto">${h||'&nbsp;'}</div>`;
    }).join('');
  }).join('');
}

// ------------------------------------------------------------------ a small markdown preview
function mdPreview(t){
  const out=[]; let inCode=false, buf=[], table=[];
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|\s)\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  const flushTable=()=>{ if(!table.length)return;
    const rows=table.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|'));
    out.push('<div class="scroll"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>`<${i?'td':'th'}>${inline(c.trim())}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>');
    table=[]; };
  for(const line of String(t||'').split('\n')){
    if(/^\s*(```|~~~)/.test(line)){ if(inCode){out.push(`<pre>${esc(buf.join('\n'))}</pre>`);buf=[];} flushTable(); inCode=!inCode; continue; }
    if(inCode){buf.push(line);continue;}
    if(line.startsWith('|')){table.push(line);continue;} flushTable();
    let m;
    if((m=line.match(/^(#{1,4}) (.*)/))) out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    else if((m=line.match(/^\s*[-*] (.*)/))) out.push(`<div>• ${inline(m[1])}</div>`);
    else if((m=line.match(/^\s*(\d+)\. (.*)/))) out.push(`<div>${m[1]}. ${inline(m[2])}</div>`);
    else if(/^    /.test(line)) out.push(`<pre>${esc(line.slice(4))}</pre>`);
    else if(!line.trim()) out.push('<div style="height:8px"></div>');
    else out.push(`<p style="margin:2px 0">${inline(line)}</p>`);
  }
  if(inCode) out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
  flushTable();
  return `<div class="md">${out.join('')}</div>`;
}

// ================================================================== header: who, selftest, deploy
// Signing in. The page asks who it is talking to; until a code has been entered it shows only
// the sign-in form, and any call that comes back 401 "login" brings that form back.
var AUTH=null;
function showLogin(st){
  $('#login').hidden=false;
  $('#login-who').textContent=st?`Signed in to the tailnet as ${st.who}.`:'';
  $('#login-form').hidden=!!(st&&!st.enrolled);
  // Shown whenever the browser can: the server says if this login has no passkey here.
  $('#login-pk').hidden=!PK_OK;
  if(st&&!st.enrolled) $('#login-who').innerHTML=`${esc(st.who)} has no authenticator set up yet.<br>
    Ask an admin to run <code>make -C console totp-enroll EMAIL=${esc(st.who)}</code> on the server.`;
  setTimeout(()=>$('#login-code').focus(),0);
}
async function doLogin(){
  const i=$('#login-code'), code=i.value.trim(); i.value='';
  try{ await api('/auth/login',{method:'POST',body:{code}}); location.reload(); }
  catch(e){ $('#login-msg').textContent=e.message; i.focus(); }
}
async function logout(){
  clearReveals();
  try{ await api('/auth/logout',{method:'POST',body:{}}); }catch(e){}
  location.reload();
}
function stepupActive(){ return !!(AUTH&&AUTH.stepup_until&&AUTH.stepup_until*1000>Date.now()); }

// A code for one action, asked in a small dialog. Resolves to the code, or null if cancelled.
function askCode(msg){
  return new Promise(res=>{
    const d=$('#codedlg'), i=$('#codein');
    $('#codepk').hidden=true; $('#codepk').onclick=null;   // askFactor turns it on for its own call
    $('#codemsg').textContent=msg; i.value=''; d.hidden=false; setTimeout(()=>i.focus(),0);
    const done=v=>{ d.hidden=true; i.value=''; $('#codeok').onclick=$('#codecancel').onclick=i.onkeydown=null; res(v); };
    $('#codeok').onclick=()=>done(i.value.trim());
    $('#codecancel').onclick=()=>done(null);
    i.onkeydown=e=>{ if(e.key==='Enter')done(i.value.trim()); if(e.key==='Escape')done(null); };
  });
}

// ------------------------------------------------------------------ passkeys (WebAuthn)
// Browsers allow them only on https:// or localhost; the server checks every answer.
const PK_OK=!!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials);
const b64u={
  enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0)).buffer};
function credJSON(c){
  if(c.toJSON) return c.toJSON();
  const r=c.response, out={id:c.id,rawId:b64u.enc(c.rawId),type:c.type,
    clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},
    response:{clientDataJSON:b64u.enc(r.clientDataJSON)}};
  if(r.attestationObject){ out.response.attestationObject=b64u.enc(r.attestationObject);
    if(r.getTransports) out.response.transports=r.getTransports(); }
  if(r.authenticatorData){ out.response.authenticatorData=b64u.enc(r.authenticatorData);
    out.response.signature=b64u.enc(r.signature); if(r.userHandle) out.response.userHandle=b64u.enc(r.userHandle); }
  if(c.authenticatorAttachment) out.authenticatorAttachment=c.authenticatorAttachment;
  return out;
}
// Ask the browser for a passkey answering a fresh challenge for `purpose` (login, stepup, confirm).
async function passkeyAnswer(purpose){
  const o=await api('/passkeys/options',{method:'POST',body:{purpose}});
  o.challenge=b64u.dec(o.challenge);
  (o.allowCredentials||[]).forEach(c=>c.id=b64u.dec(c.id));
  const c=await navigator.credentials.get({publicKey:o});
  if(!c) throw new Error('no passkey chosen');
  return credJSON(c);
}
async function loginPasskey(){
  const msg=$('#login-msg'), btn=$('#login-pk');
  msg.textContent='Waiting for your passkey: look for the browser’s prompt (or your phone)…'; btn.disabled=true;
  try{ const passkey=await passkeyAnswer('login');
    await api('/auth/login',{method:'POST',body:{passkey}}); location.reload(); }
  catch(e){ msg.textContent=e.name==='NotAllowedError'
    ?'No passkey was given (cancelled, timed out, or none for this address). Try again or use a code.':e.message; }
  finally{ btn.disabled=false; }
}
// A second factor for one action: {code}, {passkey}, or null if cancelled. The code dialog,
// with a "Use passkey" button when this user has one and the page allows it.
function askFactor(msg,purpose){
  const usePk=PK_OK&&AUTH&&AUTH.passkeys>0;
  return new Promise(res=>{
    let viaPk=false;
    const ask=askCode(msg);   // resets the passkey button, so it is set up after this
    $('#codepk').hidden=!usePk;
    $('#codepk').onclick=async()=>{
      viaPk=true; $('#codecancel').onclick();   // closes the dialog
      try{ res({passkey:await passkeyAnswer(purpose)}); }
      catch(e){ toast(e.name==='NotAllowedError'?'Passkey cancelled.':e.message,'warn'); res(null); }
    };
    ask.then(code=>{ if(!viaPk) res(code===null?null:{code}); });
  });
}

// The passkeys panel: what you have registered here, and registering this device.
var PK_OPEN=false;
function togglePasskeys(){ PK_OPEN=!PK_OPEN; PK_OPEN?renderPasskeys():($('#pkpanel').innerHTML=''); }
async function renderPasskeys(){
  const r=await api('/passkeys');
  $('#pkpanel').innerHTML=`<div class="card"><h3>Your passkeys
      <span class="dim" style="font-weight:400">— sign in, reveal and save with your fingerprint, face or phone</span>
      <button class="sm grow" onclick="togglePasskeys()">Close</button></h3>
    ${PK_OK?'':`<p class="alert warn">This page isn't secure enough for passkeys. Browsers allow them only on
      <code>https://</code> addresses or <code>localhost</code>: open <code>http://localhost:${esc(location.port||'')}</code>
      instead of an IP address, or the console's https:// tailnet address.</p>`}
    <div class="scroll"><table><tr><th>name</th><th>added</th><th>last used</th><th></th></tr>
      ${r.passkeys.map(k=>`<tr><td>${esc(k.name)}</td><td class="mono dim">${fmtTime(k.created)}</td>
        <td class="mono dim">${k.last_used?fmtTime(k.last_used):'never'}</td>
        <td><button class="sm no" onclick="removePasskey('${jsq(k.id)}')">remove</button></td></tr>`).join('')
        ||'<tr><td colspan="4" class="dim">None yet.</td></tr>'}</table></div>
    ${PK_OK?`<div class="row" style="margin-top:10px">
      <input id="pk-name" placeholder="name, e.g. my phone" autocomplete="off" style="width:200px">
      <button class="go" onclick="registerPasskey()">Register a passkey</button></div>
      <p class="hint">Your browser offers to keep it on this computer (fingerprint, Windows Hello, Touch ID),
      on your phone (scan the QR code it shows), or on a security key. It asks for your app code first.</p>`:''}
  </div>`;
}
async function registerPasskey(){
  const name=$('#pk-name').value.trim();
  const code=await askCode('Enter the code from your authenticator app to add a passkey.');
  if(code===null) return;
  try{
    const o=await api('/passkeys/register/options',{method:'POST',body:{code}});
    o.challenge=b64u.dec(o.challenge); o.user.id=b64u.dec(o.user.id);
    (o.excludeCredentials||[]).forEach(c=>c.id=b64u.dec(c.id));
    const c=await navigator.credentials.create({publicKey:o});
    await api('/passkeys/register',{method:'POST',body:{credential:credJSON(c),name}});
    AUTH.passkeys=(AUTH.passkeys||0)+1;
    toast('Passkey added. Next time choose "Sign in with passkey".','ok');
    renderPasskeys();
  }catch(e){ toast(e.name==='NotAllowedError'?'Cancelled.':e.name==='InvalidStateError'?'This device already has a passkey here.':e.message,'bad'); }
}
async function removePasskey(id){
  if(!confirm('Remove this passkey? You can still sign in with your app code.')) return;
  // Like adding one, removing one takes a code (or a passkey).
  const f=await askFactor('Enter your code (or use a passkey) to remove this passkey.','confirm');
  if(!f) return;
  try{ const r=await api(`/passkeys/${encodeURIComponent(id)}`,{method:'DELETE',body:f});
    AUTH.passkeys=r.passkeys.length; renderPasskeys(); toast('Passkey removed.','ok'); }
  catch(e){ toast(e.message,'bad'); }
}

// Toasts: a line at the bottom right that goes away by itself, with an optional button.
function toast(msg,kind='',action=null){
  const box=$('#toasts'); if(!box||!box.appendChild){ return; }
  const t=document.createElement('div'); t.className='toast '+kind;
  t.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){ const b=document.createElement('button'); b.className='sm'; b.textContent=action.label;
    b.onclick=()=>{ t.remove(); action.fn(); }; t.appendChild(b); }
  box.appendChild(t); setTimeout(()=>t.remove(), action?15000:6000);
}

function showSelftest(t){
  const b=$('#selftest'); if(!b||!t)return;
  b.textContent=t.ok?'selftest ✓':`selftest ✗ ${t.failures.length}`;
  b.className='pill '+(t.ok?'ok':'bad');
  b.title=t.ok?'support-agent-skill/scripts/selftest.sh passes':t.failures.join('\n');
}
async function runSelftest(){ const t=await api('/selftest'); showSelftest(t);
  if(!t.ok) alert('selftest.sh fails:\n\n'+t.failures.join('\n')); }

var DEPLOY=null, DEPLOY_OPEN=false, DEPLOY_TIMER=null, RESTART_WATCH=false;
async function refreshDeploy(){
  try{ DEPLOY=await api('/deploy'); }
  catch(e){ clearTimeout(DEPLOY_TIMER); DEPLOY_TIMER=setTimeout(refreshDeploy, 5000); return; }
  const p=$('#deploypill'), d=DEPLOY;
  const map={deployed:['ok','bot is up to date'],
    changed:['warn',`${d.changed.length||'some'} change${d.changed.length===1?'':'s'} not deployed`],
    unknown:['warn','deployed version unknown'],'no-container':['bad','bot container not found']};
  let [cls,label]=map[d.state]||['',d.state];
  if(d.deploy.running){cls='warn';label=d.deploy.kind!=='restart'?'deploying…':
    d.deploy.waiting?'restart waits for questions…':'restarting bot…';}
  if(RESTART_WATCH&&!d.deploy.running&&!d.deploy.restart_queued&&d.deploy.kind==='restart'&&d.deploy.finished){
    RESTART_WATCH=false;
    if(TAB==='bot'&&!BOT.editing) loadBot();   // the container's new start time
    d.deploy.exit_code===0?toast('Bot restarted with the new settings.','ok')
      :toast('The bot restart failed — open the deploy panel for its log.','bad',{label:'Show log',fn:()=>{DEPLOY_OPEN=false;openDeploy();}});
  }
  p.className='pill grow '+cls; p.textContent=label;
  if(DEPLOY_OPEN) renderDeploy();
  clearTimeout(DEPLOY_TIMER);
  DEPLOY_TIMER=setTimeout(refreshDeploy, d.deploy.running||d.deploy.restart_queued?2000:30000);
}
function openDeploy(){ DEPLOY_OPEN=!DEPLOY_OPEN; DEPLOY_OPEN?renderDeploy():($('#deploy').innerHTML=''); }
function renderDeploy(){
  const d=DEPLOY; if(!d)return;
  const c=d.container||{};
  const dep=d.deploy||{};
  $('#deploy').innerHTML=`<div class="card"><h3>Deploy to the bot
      <span class="dim" style="font-weight:400">— rebuilds the image with the current files and restarts it (<code>make -C slack-bridge update</code>)</span>
      <button class="sm grow" onclick="openDeploy()">Close</button></h3>
    <p class="note">The KB is copied into the bot's image, so an edit here reaches Slack only after a
      deploy. A deploy is refused while selftest.sh fails or while a question is being answered.
      It takes about a minute; questions asked meanwhile wait for the bot to come back.</p>
    <table><tr><th>Running image</th><td class="mono">${c.found?`${esc(c.status)} · built ${fmtIso(c.image_created)} · hash ${esc(d.image_hash||'none')}`:esc(c.error||'not found')}</td></tr>
      <tr><th>Files on disk</th><td class="mono">hash ${esc(d.disk_hash||'?')} ${d.state==='deployed'?'<span class="badge ok">same as running</span>':'<span class="badge warn">differs</span>'}</td></tr>
      ${d.changed.length?`<tr><th>Changed since the build</th><td class="mono">${d.changed.map(esc).join('<br>')}</td></tr>`:''}
      ${d.git.length?`<tr><th>Not committed to git</th><td class="mono">${d.git.map(esc).join('<br>')}
        <div class="note">A deploy uses the files as they are now, committed or not. Commit them so the next person to pull has them too.</div></td></tr>`:''}
    </table>
    <div class="row" style="margin-top:10px">
      <button class="go" onclick="startDeploy()" ${dep.running?'disabled':''}>${dep.running?'Deploying…':'Deploy now'}</button>
      <span id="dv"></span>
      ${dep.started?`<span class="note">last deploy ${fmtTime(dep.started)} by ${esc(dep.by||'?')}${dep.running?'':dep.exit_code===0?' · <span class="ok">succeeded</span>':` · <span class="bad">failed (exit ${esc(dep.exit_code)})</span>`}</span>`:''}
    </div>
    ${dep.log?`<pre id="deploylog" style="max-height:320px">${esc(dep.log)}</pre>`:''}
  </div>`;
  const lg=$('#deploylog'); if(lg) lg.scrollTop=lg.scrollHeight;
}
async function startDeploy(){
  if(!confirm('Rebuild and restart the Slack bot with the files as they are now?'))return;
  try{ await api('/deploy',{method:'POST',body:{}}); DEPLOY_OPEN=true; refreshDeploy(); }
  catch(e){ flash('dv',e.message,true); }
}

var CV={q:'',outcome:'',channel:'',open:null}, CV_TIMER=null;
// Who asked: their Slack name when it is known, with the ID on hover; else the ID.
const asker=(id,names)=>names&&names[id]?`<span dir="auto" title="${esc(id)}">${esc(names[id])}</span>`:`<span class="mono">${esc(id)}</span>`;
async function loadConvos(){
  const qs=new URLSearchParams({q:CV.q,outcome:CV.outcome,channel:CV.channel});
  const r=await api('/conversations?'+qs);
  const rows=r.threads.map(t=>`<tr class="click ${CV.open===t.key?'open':''}" onclick="openThread('${jsq(t.key)}')">
      <td class="mono" style="white-space:nowrap">${fmtTime(t.last)}</td>
      <td class="dim">${t.users.map(u=>asker(u,r.names)).join(', ')||'—'}</td>
      <td><div class="clip" dir="auto" title="${esc(t.question)}">${esc(t.question)}</div></td>
      <td class="num">${t.count}</td>
      <td>${[...new Set(t.outcomes)].map(outcomeBadge).join(' ')}</td>
      <td class="num">${fmtCost(t.cost_usd)}</td></tr>`).join('');
  $('#convos').innerHTML=`
    <div class="card">
      <div class="row">
        <input type="search" id="cv-q" placeholder="search questions, answers, users" value="${esc(CV.q)}"
          onkeydown="if(event.key==='Enter'){CV.q=this.value;loadConvos()}">
        <select id="cv-o" onchange="CV.outcome=this.value;loadConvos()">
          ${['','ok','timeout','error','running','lost'].map(o=>`<option value="${o}" ${CV.outcome===o?'selected':''}>${o?OUTCOME[o][1]:'any outcome'}</option>`).join('')}
        </select>
        <select id="cv-c" onchange="CV.channel=this.value;loadConvos()">
          <option value="">any channel</option>
          ${r.channels.map(c=>`<option ${CV.channel===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <button class="sm" onclick="CV.q=$('#cv-q').value;loadConvos()">Search</button>
      </div>
      ${r.turn_log?'':`<p class="alert warn">No turn log yet (<code>slack-bridge/state/turns.jsonl</code>), so the threads below come from
        Claude's transcripts alone: who asked in Slack, and turns that timed out, aren't known. The log starts with the next deploy of the bridge.</p>`}
    </div>
    ${r.names_problem?`<p class="alert warn">Names: ${esc(r.names_problem)}. Slack IDs are shown meanwhile.</p>`:''}
    <div class="card"><h3>Threads <span class="dim" style="font-weight:400">— ${r.threads.length}, newest first</span></h3>
      <div class="scroll"><table>
        <tr><th>last</th><th>asked by</th><th>first question</th><th class="num">turns</th><th>outcome</th><th class="num">cost</th></tr>
        ${rows||'<tr><td colspan="6" class="dim">No conversations match.</td></tr>'}
      </table></div>
    </div>
    <div id="cv-detail"></div>`;
  if(CV.open) renderThread(CV.open, false);
  clearTimeout(CV_TIMER);
  if(r.threads.some(t=>t.running)) CV_TIMER=setTimeout(()=>{ if(TAB==='convos') loadConvos(); },8000);
}
function openThread(key){
  if(CV.open===key){ CV.open=null; $('#cv-detail').innerHTML=''; setHash('convos'); loadConvos(); return; }
  CV.open=key; setHash('convos/'+key); loadConvos().then(()=>$('#cv-detail').scrollIntoView({behavior:'smooth',block:'start'}));
}
async function renderThread(key){
  let t;
  try{ t=await api('/conversations/'+encodeURIComponent(key)); }
  catch(e){ $('#cv-detail').innerHTML=`<div class="card bad">${esc(e.message)}</div>`; return; }
  const turns=t.turns.map((u,i)=>`<div class="turn">
      <header><b style="color:var(--fg)">Turn ${i+1}</b> ${fmtTime(u.ts)} ${u.user?`· ${asker(u.user,t.names)}`:''}
        ${outcomeBadge(u.outcome)} · ${fmtSecs(u.seconds)} · ${fmtCost(u.cost_usd)}
        ${u.turns?`· ${u.turns} steps`:''} ${u.resumed?'· resumed':''}
        ${u.session_id?`<span class="mono grow" title="Claude session">${esc(u.session_id.slice(0,8))}</span>`:''}</header>
      <div class="q" dir="auto">${u.question!=null?esc(u.question):'<span class="dim">The question isn\'t in a transcript on this host yet.</span>'}</div>
      ${u.answer!=null?`<div class="a">${mrkdwn(u.answer)}</div>`:`<p class="note">${{running:'Still working on it…',
        timeout:`No answer: the turn was stopped at the time limit, and the bot posted its "no answer within …s" notice.`,
        error:'No answer: the turn failed, and the bot posted an error notice.',
        lost:'No answer: the bot stopped (a restart or deploy) before it finished.'}[u.outcome]||'No answer in the transcript.'}</p>`}
      ${u.error?`<p class="note bad mono">${esc(u.error)}</p>`:''}
      ${u.cases_read&&u.cases_read.length?`<div class="note">Cases read: ${u.cases_read.map(c=>`<button class="tchip on" onclick="openCase('${jsq(c)}')">${esc(c)}</button>`).join('')}</div>`:''}
      ${u.steps?renderSteps(u.steps):`<p class="note">${t.transcript_found?'No transcript turn matches this question.':'Transcript not found on this host.'}</p>`}
    </div>`).join('');
  $('#cv-detail').innerHTML=`<div class="card"><h3>Thread <span class="mono dim" style="font-weight:400">${esc(t.channel)} · ${esc(t.thread_ts)}</span>
      <button class="sm grow" onclick="openThread('${jsq(key)}')">Close</button></h3>${turns}</div>`;
}
function renderSteps(steps){
  const tools=steps.filter(s=>s.kind==='tool');
  const denied=tools.filter(s=>s.denied).length;
  return `<details class="steps"><summary>What the bot did — ${tools.length} tool call${tools.length===1?'':'s'}${denied?`, <span class="warn">${denied} blocked by the guard</span>`:''}</summary>
    ${steps.map(s=>s.kind==='text'?`<div class="step text" dir="auto">${esc(s.text.length>600?s.text.slice(0,600)+'…':s.text)}</div>`
      :`<div class="step ${s.denied?'denied':s.error?'err':''}">
        <div class="h"><b>${esc(s.name)}</b>${s.denied?'<span class="badge warn">blocked</span>':s.error?'<span class="badge bad">failed</span>':''}</div>
        <code class="in">${esc(s.input)}</code>
        ${s.result!=null?`<details><summary>output · ${s.result.split('\n').length} lines${s.truncated?' · <span class="warn">the bot saw it cut short</span>':''}</summary><pre>${esc(s.result)}</pre></details>`:''}
      </div>`).join('')}
  </details>`;
}

// ================================================================== Cases
var CASE=null, CASE_TOPICS=[], NEWTOPICS=[];
// Mirrors kb.slugify in console/kb.py; the server is authoritative, this previews it.
// console/tests/test_cases.py runs both over the same inputs.
function slugify(raw){
  return (raw||'').normalize('NFKD').replace(/[^\x00-\x7F]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,64).replace(/-+$/,'');
}
function previewSlug(){
  const el=$('#case-new-slug'); if(!el)return;
  const raw=$('#case-new').value.trim(), s=slugify(raw);
  el.innerHTML=!raw?'':s?`Saved as <code>kb/cases/${esc(s)}.md</code>`:'<span class="warn">Needs at least one letter or digit.</span>';
}
const yes=v=>v?'<span class="ok">✓</span>':'<span class="bad">✗</span>';

async function loadCases(){
  const r=await api('/cases');
  CASE_TOPICS=r.topics;
  const rows=r.cases.map(c=>`<tr class="click ${CASE&&CASE.slug===c.slug?'open':''}" onclick="openCase('${jsq(c.slug)}')">
      <td><div class="mono">${esc(c.slug)}</div><div class="dim" style="font-size:12.5px">${esc(c.title)}</div></td>
      <td>${c.topics.map(t=>`<span class="tchip on">${esc(t)}</span>`).join('')||'<span class="dim">—</span>'}</td>
      <td class="num ${c.symptoms?'':'warn'}">${c.symptoms}</td>
      <td title="row in the SKILL.md case index">${yes(c.indexed)}</td>
      <td title="line in scripts/signatures.txt">${c.signatures?'<span class="ok">✓</span>':'<span class="dim">—</span>'}</td>
      <td class="dim">${fmtTime(c.mtime)}</td></tr>`).join('');
  $('#cases').innerHTML=`
    <div class="card"><h3>New case</h3>
      <p class="note">Describe the fault, not the ticket. This creates the file with the usual sections and opens it below.</p>
      <div class="row"><input type="text" id="case-new" oninput="previewSlug()" placeholder="e.g. Radar WebSocket keeps flapping">
        <button class="sm yes" onclick="newCase()">Create</button></div>
      <p class="note" id="case-new-slug"></p>
      <div id="newtopics"></div>
    </div>
    <div id="case-ed"></div>
    <div class="card"><h3>Cases <span class="dim" style="font-weight:400">— ${r.cases.length} in <code>support-agent-skill/kb/cases/</code></span></h3>
      <p class="note">The bot matches the triage against the SKILL.md index (one row per case), then reads the case.
        A signature tags matching log lines on the site with <code>[case]</code>, the strongest lead it has.</p>
      <div class="scroll"><table><tr><th>case</th><th>topics</th><th class="num">symptoms</th><th>index</th><th>signature</th><th>changed</th></tr>
        ${rows}</table></div></div>`;
  NEWTOPICS=[]; renderTopicPicker('newtopics',NEWTOPICS);
  previewSlug();
  if(CASE) renderCase();
}

function renderTopicPicker(id,sel){
  const box=$('#'+id); if(!box)return;
  const all=[...new Set([...CASE_TOPICS,...sel])].sort();
  box.innerHTML=(id==='newtopics'?`<div class="hint">Topics</div>`:'')+all.map(t=>`<button type="button" class="tchip ${sel.includes(t)?'on':''}"
      onclick="toggleTopic('${id}','${jsq(t)}')">${sel.includes(t)?'✓ ':''}${esc(t)}</button>`).join('')+
    `<span class="row" style="display:inline-flex;gap:4px"><input type="text" id="${id}-add" placeholder="new topic" style="max-width:150px;flex:none;padding:4px 8px"
       onkeydown="if(event.key==='Enter'){event.preventDefault();addTopic('${id}')}"><button class="sm" type="button" onclick="addTopic('${id}')">+</button></span>`;
}
const topicSel=id=>id==='newtopics'?NEWTOPICS:CASE.topics;

async function openCase(slug){

function moveSec(i,d){ const s=CASE.sections, j=i+d; [s[i],s[j]]=[s[j],s[i]]; renderCase(); }

async function saveCase(){
  const d=CASE;
  const body={base:d.etag, signatures:d.sigs.map(s=>s.trim()).filter(Boolean)};
  if(d.index.says.trim()||d.index.evidence.trim()||!d.index.missing) body.index={says:d.index.says,evidence:d.index.evidence};
  if(d.mode==='raw') body.raw=d.raw;
  else Object.assign(body,{topics:d.topics,symptoms:d.symptoms.map(s=>s.trim()).filter(Boolean),
    title:d.title,intro:d.intro,sections:d.sections});
  try{
    const r=await api('/cases/'+encodeURIComponent(d.slug),{method:'PUT',body});
    showSelftest(r.selftest); refreshDeploy();
    const mode=d.mode;
    await loadCases(); await openCase(d.slug); CASE.mode=mode; renderCase();
    flash('cv', r.selftest.ok?'Saved. selftest passes.':'Saved, but selftest fails: '+r.selftest.failures.join('; '), !r.selftest.ok);
  }catch(e){ flash('cv',e.message,true); }
}
async function renameCase(){
  const n=prompt(`Rename ${CASE.slug} to:`,CASE.slug); if(!n||slugify(n)===CASE.slug)return;
  try{ const r=await api('/cases/'+encodeURIComponent(CASE.slug)+'/rename',{method:'POST',body:{name:n}});
    showSelftest(r.selftest); refreshDeploy();
    if(r.references.length) alert(`Renamed to ${r.slug}. The index row and signature moved with it.\n\nStill mentioning the old name (edit them by hand):\n${r.references.join('\n')}`);
    CASE=null; await loadCases(); await openCase(r.slug); }
  catch(e){ alert(e.message); }
}
async function deleteCase(){

  if(!confirm(`Delete kb/cases/${d.slug}.md${extra.length?' and '+extra.join(' and '):''}?`+
      (d.references.length?`\n\nIt is mentioned in ${d.references.join(', ')}; those mentions stay.`:'')))return;
  try{ const r=await api('/cases/'+encodeURIComponent(d.slug),{method:'DELETE',body:{}});
    showSelftest(r.selftest); refreshDeploy(); closeCase(); loadCases(); }
  catch(e){ alert(e.message); }
}

// One series, so no legend: the card title names it. Columns with a 4px rounded top, square on
// the baseline; a full-height hit band per day carries the tooltip.
function niceMax(v){ if(v<=0)return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p; return 10*p; }
function columnChart(days,key,fmt,id){
  const W=720,H=180,L=40,B=22,T=10, n=days.length, max=niceMax(Math.max(...days.map(d=>d[key]||0)));
  const band=(W-L)/n, bw=Math.min(24,Math.max(2,band-2)), y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max].map(v=>`<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>
    <text x="${L-6}" y="${y(v)+4}" text-anchor="end">${key==='cost_usd'?'$'+(+v.toFixed(2)):Math.round(v)}</text>`).join('');
  const every=Math.ceil(n/8);
  const cols=days.map((d,i)=>{
    const v=d[key]||0, x=L+i*band+(band-bw)/2, top=y(v), h=(H-B)-top, r=Math.min(4,h,bw/2);
    const path=h>0?`M${x},${H-B} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${H-B} Z`:'';
    const tip=`<b>${d.day}</b><br>${fmt(v)}${key==='questions'&&d.questions?` · ${d.ok} answered${d.timeout?`, ${d.timeout} timed out`:''}${d.error?`, ${d.error} errors`:''}`:''}`;
    return `<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${L+i*band}" y="${T}" width="${band}" height="${H-B-T}"/>
      ${path?`<path class="mark" d="${path}"/>`:''}
      ${i%every===0?`<text x="${L+i*band+band/2}" y="${H-6}" text-anchor="middle">${d.day.slice(5)}</text>`:''}</g>`;
  }).join('');
  return `<div class="chartbox" id="${id}"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} per day">
    ${ticks}<line class="base" x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}"/>${cols}</svg><div class="tip" hidden></div></div>`;
}
function wireTips(){
  document.querySelectorAll('.chartbox').forEach(box=>{
    const tip=box.querySelector('.tip');
    box.querySelectorAll('g.col').forEach(g=>{
      g.addEventListener('mouseenter',()=>{
        const r=g.querySelector('.hit').getBoundingClientRect(), b=box.getBoundingClientRect();
        tip.innerHTML=g.dataset.tip; tip.hidden=false;
        tip.style.left=Math.min(Math.max(r.left-b.left+r.width/2,60),b.width-60)+'px'; tip.style.top=(r.top-b.top+6)+'px';
      });
      g.addEventListener('mouseleave',()=>{tip.hidden=true;});
    });
  });
}

async function runTriage(h){
  if(!confirm(`Run a triage of ${h} now? It connects to the site and only reads (the same check the bot runs for a question). It takes up to a minute or two.`))return;
  SITE_BUSY.add(h); renderSystems();
  try{ const r=await api('/systems/'+encodeURIComponent(h)+'/triage',{method:'POST',body:{}});
    SITE[h]={...r.site, run:{ok:r.ok, tail:r.output_tail}}; }
  catch(e){ SITE[h]={...(SITE[h]||{host:h}), run:{ok:false, tail:e.message}}; }
  SITE_BUSY.delete(h); renderSystems();

// What a sensor's address did at the triage: ping when it was run, else the neighbour cache
// (REACHABLE = answered lately, STALE = seen before but not lately, FAILED/INCOMPLETE = no answer).
function reach(p){
  if(!p) return '<span class="dim">—</span>';
  const tail=`<div class="dim mono" style="font-size:11px">${esc(p.route)}${p.neigh?' · neigh '+esc(p.neigh):''}</div>`;
  if(p.hijack) return '<span class="badge bad">routed via the tailnet</span>'+tail;
  if(p.ping==='OK') return '<span class="badge ok">answers (ping)</span>'+tail;
  if(p.ping==='DOWN') return '<span class="badge bad">no answer (ping)</span>'+tail;
  const n=p.neigh.toUpperCase();
  if(n==='REACHABLE') return '<span class="badge ok">reachable</span>'+tail;
  if(['STALE','DELAY','PROBE'].includes(n)) return '<span class="badge warn">seen earlier, not lately</span>'+tail;
  if(['FAILED','INCOMPLETE'].includes(n)) return '<span class="badge bad">no answer</span>'+tail;
  return '<span class="badge warn">never seen from the machine</span>'+tail;
}
function renderSite(h,row){
  const d=SITE[h], busy=SITE_BUSY.has(h);
  const btn=`<button class="sm" onclick="event.stopPropagation();runTriage('${jsq(h)}')" ${busy||row.state!=='online'?'disabled':''}
      title="${row.state!=='online'?'The site is offline':''}">${busy?'Running the triage…':'Run triage now'}</button>`;
  if(!d) return '<p class="note">Loading…</p>';
  if(d.error) return `<p class="alert">${esc(d.error)}</p>`;
  const run=d.run?`<p class="alert ${d.run.ok?'ok':''}">${d.run.ok?'Triage finished.':'The triage did not finish:'} <span class="mono">${d.run.ok?'':esc(d.run.tail)}</span></p>`:'';
  const t=d.triage;
  if(!t) return `${run}<div class="row"><span class="note">No triage of this site is saved yet, so its sensors aren't known here.</span>${btn}</div>`;
  const c=t.config, sensorGroups=c.groups.filter(g=>g.nodes.some(n=>n.addresses.length)),
        softGroups=c.groups.filter(g=>!g.nodes.some(n=>n.addresses.length));
  return `${run}
    <div class="row" style="margin-bottom:8px"><span class="note" style="margin:0">From the triage of <b>${fmtTime(t.ts)}</b>${t.count>1?` (newest of ${t.count})`:''}.
      ${c.file?`Config: <code>${esc(c.file)}</code>`:''}</span><span class="grow">${btn}</span></div>
    ${t.unreachable?'<p class="alert warn">That triage could not reach the site, so it has no sensor list. Run a new one when the site is online.</p>':''}
    ${sensorGroups.map(g=>`<div class="hint" style="font-family:var(--mono)">${esc(g.platform||'(no platform)')}</div>
      <div class="scroll"><table><tr><th>sensor</th><th>type</th><th>address</th><th>at the triage</th></tr>
      ${g.nodes.map(n=>(n.addresses.length?n.addresses:[null]).map((a,i)=>`<tr>
        <td class="mono">${i?'':esc(n.name)}${!i&&n.status?`<div class="dim" style="font-size:11px">${esc(n.status)}</div>`:''}</td>
        <td class="mono">${i?'':esc(n.type)}</td>
        <td class="mono">${a?`${esc(a.value)} <span class="dim">${esc(a.key)}</span>${a.note?`<div class="dim" style="font-size:11px">${esc(a.note)}</div>`:''}`:'<span class="dim">—</span>'}</td>
        <td>${a?reach(a.path):''}</td></tr>`).join('')).join('')}</table></div>`).join('')
      ||(t.unreachable?'':'<p class="note">The triage found no sensor addresses in the site config.</p>')}
    ${t.other_paths.length?`<div class="hint">Also checked (not a config entry)</div><div class="scroll"><table>
      <tr><th>address</th><th>what</th><th>at the triage</th></tr>
      ${t.other_paths.map(p=>`<tr><td class="mono">${esc(p.ip)}</td><td>${esc(p.label||'an address in the resolved config')}</td><td>${reach(p)}</td></tr>`).join('')}</table></div>`:''}
    ${softGroups.length?`<div class="hint">Software nodes</div>${softGroups.map(g=>`<div style="margin-bottom:4px"><span class="mono dim">${esc(g.platform)}</span>
      ${g.nodes.map(n=>`<span class="tchip" title="${esc(n.type)}">${esc(n.name)}</span>`).join('')}</div>`).join('')}`:''}
    ${c.notes.map(n=>`<p class="note">${esc(n)}</p>`).join('')}
    <details><summary class="dim" style="cursor:pointer;font-size:12px">The triage's own text for these sections</summary>
      ${Object.entries(t.raw).map(([k,v])=>`<div class="hint mono">=== ${esc(k)} ===</div><pre>${esc(v)}</pre>`).join('')}</details>`;
}

// ================================================================== Bot config
// The bot's settings: everyone sees them; an admin changes the editable ones together, with a
// code, and the bot restarts to read them. Empty (or "default") means the bot's default.
var BOT={b:null,a:null,editing:false,initial:{}};
const SETTING_HELP={
  BRIDGE_MODEL:'which Claude model answers',BRIDGE_EFFORT:'how hard it thinks',
  BRIDGE_TIMEOUT_S:'seconds for one answer (30–600)',BRIDGE_MAX_CONCURRENT:'questions at once (1–5)',
  BRIDGE_RTL_MARKS:'right-to-left fixes for Hebrew replies',BRIDGE_ALLOW_PING:'may ping the sites',
  BRIDGE_ALLOWED_HOSTS:'the machines the bot may SSH into',SLACK_ALLOWED_CHANNELS:'channel IDs it answers in',
  SLACK_ALLOWED_USERS:'user IDs it answers (empty: anyone in those channels)',SLACK_ALLOW_DMS:'answers direct messages (from allowed users)',
  GOTCHA_SSH_USER:'login for SSH to the sites (empty: tailscale ssh’s own)'};
const FLAGS=new Set(['BRIDGE_RTL_MARKS','BRIDGE_ALLOW_PING','SLACK_ALLOW_DMS']);
const DEFAULT_OPT='(default)';   // no setting's value has parentheses
function settingInput(st){
  const id='bs-'+st.name, cur=st.set?st.value:null, b=BOT.b;
  // "default" removes the line; a line that is there but empty (which the bot reads otherwise,
  // e.g. BRIDGE_MODEL= is Claude Code's own default) shows as such, and stays unless changed.
  const opts=(list,label=x=>x)=>`<option value="${DEFAULT_OPT}" ${cur===null?'selected':''}>default (${esc(st.default?label(st.default):'none')})</option>`+
    (cur===''?'<option value="" selected>(empty)</option>':'')+
    [...new Set([...list,...(cur?[cur]:[])])].map(x=>`<option value="${esc(x)}" ${x===cur?'selected':''}>${esc(label(x))}</option>`).join('');
  if(st.name==='BRIDGE_MODEL') return `<select id="${id}">${opts(b.models)}</select>`;
  if(st.name==='BRIDGE_EFFORT') return `<select id="${id}">${opts(b.efforts)}</select>`;
  if(FLAGS.has(st.name)) return `<select id="${id}">${opts(['1','0'],x=>x==='1'?'on':'off')}</select>`;
  if(st.name==='BRIDGE_ALLOWED_HOSTS'){
    const parts=(st.value||st.default).split('|').filter(Boolean);   // empty: the bot uses the default
    return `<label class="note"><input type="checkbox" id="bs-sites" ${parts.includes(b.sites)?'checked':''}> every <span class="mono">axon-gotcha-&lt;number&gt;</span></label>
      <input id="${id}" class="mono" style="min-width:240px" placeholder="and machines by name, comma-separated"
        value="${esc(parts.filter(x=>x!==b.sites).join(', '))}">`;
  }
  const num=st.name==='BRIDGE_TIMEOUT_S'||st.name==='BRIDGE_MAX_CONCURRENT';
  return `<input id="${id}" class="mono" ${num?'inputmode="numeric" style="width:90px"':'style="min-width:240px"'}
    placeholder="${num?'default':'empty: default'}" value="${esc(cur||'')}">`;
}
// What the form says each editable setting should be: a value, or null for the default.
function settingValue(st){
  const i=$('#bs-'+st.name); if(!i) return undefined;
  if(st.name==='BRIDGE_ALLOWED_HOSTS'){
    const names=i.value.split(/[\s,|]+/).filter(Boolean);
    return [...($('#bs-sites').checked?[BOT.b.sites]:[]),...names].join('|');
  }
  if(i.tagName==='SELECT') return i.value===DEFAULT_OPT?null:i.value;
  const v=i.value.trim();
  if(!v) return null;
  return st.name.startsWith('SLACK_ALLOWED')?v.split(/[\s,]+/).filter(Boolean).join(','):v;
}
const editableSettings=()=>BOT.b.settings.filter(st=>st.editable);
// Only what the admin changed since the form opened: a setting left alone isn't sent, so its
// line stays exactly as it is (an empty BRIDGE_MODEL= isn't the same as no line).
function settingChanges(){
  const out={};
  editableSettings().forEach(st=>{
    const v=settingValue(st);
    if(v!==undefined&&v!==BOT.initial[st.name]) out[st.name]=v;
  });
  return out;
}
async function saveSettings(){
  const code=$('#bs-code').value.trim(); $('#bs-code').value='';
  const changes=settingChanges();
  if(!Object.keys(changes).length){ toast('Nothing changed.','warn'); return; }
  try{
    const f=await saveFactor(code); if(!f) return;
    const r=await api('/bot/settings',{method:'PUT',body:{changes,...f}});
    BOT.editing=false; await loadBot();
    if(r.status==='unchanged') toast('Nothing changed.','warn'); else restartToast(r,r.changed.join(', '));
  }catch(e){ toast(e.message,'bad'); }
}
function editSettings(on){ BOT.editing=on; renderBot(); }
async function loadBot(){
  if(BOT.editing&&BOT.b) return;   // back on the tab mid-edit: keep what was typed
  const [b,a]=await Promise.all([api('/bot'),api('/audit?limit=100')]);
  BOT.b=b; BOT.a=a; renderBot();
}
function renderBot(){
  const b=BOT.b, a=BOT.a, ed=BOT.editing&&b.can_edit;
  const c=b.container||{};
  $('#bot').innerHTML=`
    <div class="card"><h3>Container</h3>
      ${c.found?`<table><tr><th>status</th><td>${c.running?'<span class="badge ok">running</span>':`<span class="badge bad">${esc(c.status)}</span>`}
        since ${fmtIso(c.started)} · ${esc(c.restarts)} restarts</td></tr>
        <tr><th>image</th><td class="mono">${esc(c.image_id)} · built ${fmtIso(c.image_created)} · skill hash ${esc(c.skill_hash||'none')}</td></tr></table>`
        :`<p class="alert">${esc(c.error||'not found')}</p>`}</div>
    <div class="card"><h3>Settings <span class="dim" style="font-weight:400">— <code>slack-bridge/.env</code></span>
        <span class="grow"></span>${b.can_edit&&b.env_file&&!ed?'<button class="sm" onclick="editSettings(true)">change settings</button>':''}</h3>
      ${b.env_file?'':'<p class="alert warn">No slack-bridge/.env on this host.</p>'}
      <div class="scroll"><table><tr><th>name</th><th>value</th><th>default</th><th>changed</th></tr>
      ${b.settings.map(s=>`<tr><td><span class="mono">${esc(s.name)}</span>${SETTING_HELP[s.name]?`<div class="note">${esc(SETTING_HELP[s.name])}</div>`:''}</td>
        <td>${ed&&s.editable?settingInput(s)
          :`<span class="mono">${s.set?esc(s.value):'<span class="dim">default</span>'}</span>`}
          ${s.read_only?`<div class="note">read-only: ${esc(s.read_only)}</div>`:''}</td>
        <td class="mono dim">${esc(s.default)}</td>
        <td class="dim" style="font-size:12px;white-space:nowrap">${s.updated_at?`${fmtTime(s.updated_at)} · ${esc(s.updated_by)}`:''}</td></tr>`).join('')}</table></div>
      ${ed?`<div class="row" style="margin-top:8px">${codeInput('bs-code')}
          <button class="go" onclick="saveSettings()">Save</button><button class="sm" onclick="editSettings(false)">Cancel</button></div>
        <p class="hint">Saving writes only the changed lines of <code>slack-bridge/.env</code> and restarts the bot to use them
          (after the questions it is answering). Empty, or “default”, puts a setting back to the bot’s default.</p>`:''}
      <p class="note">Hidden values: ${b.secrets_set.length} ·
        <a href="#secrets" onclick="showTab('secrets');return false">open Secrets</a> to see or change them.</p></div>
    <div class="card"><h3>What the bot may do</h3>
      <p class="note">Claude Code's permissions in <code>slack-bridge/workspace/.claude/settings.json</code>: anything not allowed is refused, nobody is asked.</p>
      ${b.permissions?`<pre>${esc(JSON.stringify(b.permissions.permissions,null,1))}</pre>`:'<p class="alert">settings.json is missing</p>'}
      <details><summary class="dim">The Bash guard (<code>slack-bridge/bash_guard.py</code>)</summary><pre>${esc(b.guard)}</pre></details></div>
    <div class="card"><h3>Recent changes made here</h3>
      <div class="scroll"><table><tr><th>when</th><th>who</th><th>what</th></tr>
      ${a.entries.map(e=>`<tr><td class="mono" style="white-space:nowrap">${fmtTime(e.ts)}</td><td class="mono">${esc(e.who)}</td>
        <td>${esc(e.action)} <span class="mono">${esc(e.target)}</span>${e.to?` → <span class="mono">${esc(e.to)}</span>`:''}</td></tr>`).join('')
        ||'<tr><td colspan="3" class="dim">Nothing yet.</td></tr>'}</table></div></div>`;
  if(ed) BOT.initial=Object.fromEntries(editableSettings().map(st=>[st.name,settingValue(st)]));
}

// ================================================================== Secrets
// The hidden entries of slack-bridge/.env. Everyone sees the names; an admin reveals a value
// after a code (good for AUTH.stepup_seconds), and every save takes a code of its own.
// A revealed value lives only in SEC.reveal, for 30 seconds at most.
var SEC={list:[],can_edit:false,env_file:true,reveal:{},timers:{},edit:null,adding:false};
const REVEAL_MS=30000;
function clearReveals(){
  Object.values(SEC.timers).forEach(clearTimeout);
  SEC.reveal={}; SEC.timers={};
  if(TAB==='secrets'&&$('#sec-bot').innerHTML) renderSecrets();
  if(typeof ACC!=='undefined'){ Object.values(ACC.timers).forEach(clearTimeout);
    const shown=Object.keys(ACC.reveal); ACC.reveal={}; ACC.timers={};
    if(TAB==='secrets'&&$('#sec-access').innerHTML) shown.forEach(paintSecret); }
}
// One tab, two parts: how to reach each system (#sec-access), then the bot's secrets (#sec-bot).
async function loadSecrets(){
  const [r,a,st]=await Promise.allSettled([api('/secrets'),api('/access'),api('/auth/status')]);
  if(st.status==='fulfilled') AUTH=st.value;
  // Each part on its own: one failing doesn't blank the other.
  if(r.status==='fulfilled'){ SEC.list=r.value.secrets; SEC.can_edit=r.value.can_edit; SEC.env_file=r.value.env_file; renderSecrets(); }
  else $('#sec-bot').innerHTML=`<div class="card"><p class="alert">Bot secrets: ${esc(r.reason.message)}</p></div>`;
  if(a.status==='fulfilled'){ accessState(a.value); renderAccess(); }
  else $('#sec-access').innerHTML=`<div class="card"><p class="alert">System access: ${esc(a.reason.message)}</p></div>`;
}
function renderSecrets(){
  const mins=Math.max(1,Math.round(((AUTH&&AUTH.stepup_until||0)*1000-Date.now())/60000));
  const editRow=(name,isNew)=>`<tr><td colspan="4">
      <div class="row">
        ${isNew?'<input id="sv-name" placeholder="NAME_OF_SECRET" autocomplete="off" style="text-transform:uppercase">':''}
        <input type="password" id="sv-val" placeholder="new value" autocomplete="new-password" style="min-width:260px">
        <button class="sm" onclick="togglePwField()">show</button>
        ${codeInput('sv-code')}
        <button class="go" onclick="saveSecret('${jsq(name)}',${isNew})">Save</button>
        <button class="sm" onclick="cancelEdit()">Cancel</button>
      </div>
      <p class="hint">Saving writes <code>slack-bridge/.env</code> and restarts the bot so it uses the new value.</p></td></tr>`;
  const rows=SEC.list.map(s=>{
    const shown=SEC.reveal[s.name];
    const val=shown!==undefined?`<span class="secretval">${esc(shown)}</span>
        <button class="sm" onclick="copySecret('${jsq(s.name)}')">copy</button>
        <button class="sm" onclick="hideSecret('${jsq(s.name)}')">hide</button>`
      :s.set?'<span class="masked">••••••••</span>':'<span class="dim">empty</span>';
    const changed=s.updated_at?`${fmtTime(s.updated_at)} by ${esc(s.updated_by||'?')}`:'<span class="dim">not changed here</span>';
    const acts=SEC.can_edit?`<button class="sm" onclick="revealSecret('${jsq(s.name)}')" ${shown!==undefined?'disabled':''}>reveal</button>
        <button class="sm" onclick="editSecret('${jsq(s.name)}')">change</button>`:'';
    return `<tr><td class="mono">${esc(s.name)}</td><td>${val}</td><td class="mono dim">${changed}</td><td style="white-space:nowrap">${acts}</td></tr>`
      +(SEC.edit===s.name?editRow(s.name,false):'');
  }).join('');
  $('#sec-bot').innerHTML=`<div class="card"><h3>Bot secrets <span class="dim" style="font-weight:400">— hidden entries of <code>slack-bridge/.env</code></span>
      ${SEC.can_edit&&stepupActive()?`<span class="badge ok">verified for ${mins} more minute${mins===1?'':'s'}</span>`:''}</h3>
    ${SEC.env_file?'':'<p class="alert warn">There is no slack-bridge/.env on this host yet.</p>'}
    ${SEC.can_edit?'<p class="note">Values are hidden. Reveal asks for a code from your authenticator, then shows each value for 30 seconds; every save asks for a code. Each reveal and change is in the audit log.</p>'
      :'<p class="note">You can see which secrets are set. Ask an admin to view or change them.</p>'}
    <div class="scroll"><table><tr><th>name</th><th>value</th><th>last changed</th><th></th></tr>
      ${rows||'<tr><td colspan="4" class="dim">No secrets in slack-bridge/.env.</td></tr>'}
      ${SEC.adding?editRow('',true):''}</table></div>
    ${SEC.can_edit&&!SEC.adding?'<div class="row" style="margin-top:8px"><button class="sm" onclick="addSecret()">+ add a secret</button></div>':''}
  </div>`;
}
// One code unlocks revealing (Secrets and Access) for AUTH.stepup_seconds. False if cancelled.
async function ensureStepup(){
  if(stepupActive()) return true;
  const f=await askFactor(`Enter your code (or use your passkey) to reveal secrets and passwords for the next ${Math.round((AUTH&&AUTH.stepup_seconds||1800)/60)} minutes.`,'stepup');
  if(f===null) return false;
  try{ const r=await api('/auth/stepup',{method:'POST',body:f});
    AUTH.stepup_until=r.stepup_until;
    setTimeout(clearReveals, Math.max(0,r.stepup_until*1000-Date.now()));
    return true; }
  catch(e){ toast(e.message,'bad'); return false; }
}
async function revealSecret(name,retried){
  if(!await ensureStepup()) return;
  try{
    const r=await api(`/secrets/${encodeURIComponent(name)}/reveal`,{method:'POST',body:{}});
    SEC.reveal[name]=r.value;
    clearTimeout(SEC.timers[name]); SEC.timers[name]=setTimeout(()=>hideSecret(name),REVEAL_MS);
    renderSecrets();
  }catch(e){
    if(e.message==='stepup'&&!retried){ AUTH.stepup_until=null; return revealSecret(name,true); }
    toast(e.message,'bad');
  }
}
function hideSecret(name){ clearTimeout(SEC.timers[name]); delete SEC.timers[name]; delete SEC.reveal[name]; renderSecrets(); }
async function copySecret(name){
  try{ await navigator.clipboard.writeText(SEC.reveal[name]); toast('Copied.','ok'); }
  catch(e){ toast('Copy failed; select the value and copy it by hand.','warn'); }
}
function editSecret(name){ SEC.edit=name; SEC.adding=false; renderSecrets(); setTimeout(()=>$('#sv-val').focus(),0); }
function addSecret(){ SEC.adding=true; SEC.edit=null; renderSecrets(); setTimeout(()=>$('#sv-name').focus(),0); }
function cancelEdit(){ SEC.edit=null; SEC.adding=false; renderSecrets(); }
function togglePwField(){ const i=$('#sv-val'); i.type=i.type==='password'?'text':'password'; }
async function saveSecret(name,isNew){
  if(isNew) name=$('#sv-name').value.trim().toUpperCase();
  const value=$('#sv-val').value, code=$('#sv-code').value.trim();
  $('#sv-val').value=''; $('#sv-code').value='';   // never left in the page, whatever happens
  if(!name||!value){ toast('A name and a value are both needed.','warn'); return; }
  try{
    const f=await saveFactor(code); if(!f) return;
    const r=await api(`/secrets/${encodeURIComponent(name)}`,{method:'PUT',body:{value,...f}});
    SEC.edit=null; SEC.adding=false; delete SEC.reveal[name];
    await loadSecrets();
    restartToast(r,name);
  }catch(e){ toast(e.message,'bad'); }
}
// The factor for a save: the code typed in the form, or else the passkey if there is one.
async function saveFactor(code){
  if(code) return {code};
  if(PK_OK&&AUTH&&AUTH.passkeys>0){
    try{ return {passkey:await passkeyAnswer('confirm')}; }
    catch(e){ toast(e.name==='NotAllowedError'?'Passkey cancelled.':e.message,'warn'); return null; }
  }
  toast('Enter the code from your authenticator app to save.','warn'); return null;
}
function restartToast(r,name){
  if(r.restart_triggered){
    toast(r.restart_note?`Saved ${name||''}. Bot restart ${r.restart_note}.`:`Saved ${name||''}. Restarting the bot to apply it…`,'ok');
    RESTART_WATCH=true; refreshDeploy();
  }else{
    toast(`Saved ${name||''}, but the bot was not restarted: ${r.restart_error||'unknown error'}`,'warn',{label:'Restart now',fn:restartNow});
  }
}
async function restartNow(){
  try{ restartToast(await api('/bot/restart',{method:'POST',body:{}}),''); }
  catch(e){ toast(e.message,'bad'); }
}

// ================================================================== Access
// Each system has the same four categories. A sensor (radar, acoustic, camera) has a version,
// IP and port, a GUI with its password, and where it points (azimuth, elevation). Compute &
// infrastructure keeps its SSH access, and a computer adds its model, the sensor it serves, a
// web address and RustDesk with their passwords, and its users, each with a password. Every
// component can carry extra fields too. Everyone signed in sees names and plain values; an
// admin reveals a secret after a code, and changes things with a code (or passkey), after
// which editing stays unlocked for a few minutes. Written field by field to
// systems_inventory.yaml and secrets.local.env: there is no way to read or write the file whole.
var ACC={systems:[],categories:[],can_edit:false,inventory_file:true,error:null,
  reveal:{},timers:{},form:null,fresh:false,rows:[],users:[],cells:{},details:new Set(),
  open:new Set(),openCats:new Set(),   // systems, and "system/category"s, expanded
  towerView:new Set()};                // systems whose tower view is shown
const SENSOR_CATS=['radars','acoustics','cameras'];
const isSensorCat=k=>SENSOR_CATS.includes(k);
// A secret is named by "which": '' for the SSH password, 'field:<name>', 'slot:<gui_password|
// web_password|rustdesk_password>' or 'user:<name>'. Its key is "system/component#which".
const akey=(s,c,which)=>s+'/'+c+(which?'#'+which:'');
const splitWhich=which=>{ const i=which.indexOf(':'); return [which.slice(0,i),which.slice(i+1)]; };
function whichBody(which){
  if(!which) return {};
  const [kind,name]=splitWhich(which);
  return kind==='field'?{field:name}:kind==='slot'?{slot:name}:{user:name};
}
function secretIsSet(c,which){
  if(!which) return c.has_password;
  const [kind,name]=splitWhich(which);
  if(kind==='slot') return c['has_'+name];
  const list=kind==='field'?c.secret_fields:c.users;
  return !!(list.find(x=>x.name===name)||{}).set;
}
function accessState(r){ ACC.systems=r.systems; ACC.inventory_file=r.inventory_file; ACC.error=r.error||null;
  if(r.categories) ACC.categories=r.categories; if('can_edit' in r) ACC.can_edit=r.can_edit;
  if('edit_until' in r&&AUTH){ AUTH.edit_until=r.edit_until; watchEditWindow(); } }
// After one code, System access edits go without one for a few minutes (the server decides).
const editActive=()=>!!(AUTH&&AUTH.edit_until&&AUTH.edit_until*1000>Date.now());
const editMins=()=>Math.max(1,Math.round((AUTH.edit_until*1000-Date.now())/60000));
const editBadge=()=>`<span class="badge ok" title="Your last code unlocked editing; changes are still audited">editing unlocked · ${editMins()} min</span>`;
var EDIT_TIMER=null;
// When the window ends, show the code box again (and the badge goes).
function watchEditWindow(){
  clearTimeout(EDIT_TIMER);
  if(editActive()) EDIT_TIMER=setTimeout(()=>{ if(TAB==='secrets') renderAccess(); }, AUTH.edit_until*1000-Date.now()+500);
}
function endEditWindow(){ if(AUTH) AUTH.edit_until=null; renderAccess(); }
// In the System access forms: the code box, or, inside the window, a note that none is needed.
const accessCode=()=>editActive()?editBadge():codeInput('af-code');
function findComp(sys,comp){
  const s=ACC.systems.find(x=>x.name===sys); if(!s) return null;
  for(const cat of s.categories){ const c=cat.components.find(x=>x.name===comp); if(c) return {s,c,cat:cat.key}; }
  return null;
}
const codeInput=id=>`<input id="${id}" class="mono" placeholder="${PK_OK&&AUTH&&AUTH.passkeys?'code (empty: passkey)':'6-digit code'}"
  title="The code from your authenticator app${PK_OK&&AUTH&&AUTH.passkeys?', or leave empty to use your passkey':''}"
  inputmode="numeric" autocomplete="one-time-code" maxlength="9" style="width:200px">`;
// A web address as a link: one without http(s):// opens as http.
const webLink=u=>u?`<a href="${esc(/^https?:\/\//i.test(u)?u:'http://'+u)}" target="_blank" rel="noopener noreferrer" class="mono">${esc(u)}</a>`:'';

// ------------------------------------------------------------------ a secret's cell
function secretCell(k,isSet,sys,comp,which){
  const shown=ACC.reveal[k];
  if(shown!==undefined) return `<span class="secretval">${esc(shown)}</span>
    <button class="sm" onclick="hideAccess('${jsq(k)}')">hide</button>`;
  if(!isSet) return '<span class="dim">—</span>';
  return `<span class="masked">••••••••</span>${ACC.can_edit?` <button class="sm" onclick="revealAccess('${jsq(sys)}','${jsq(comp)}','${jsq(which||'')}')">reveal</button>`:''}`;
}
// A secret in its own span, so it can be redrawn alone.
function secretSpan(s,c,which,id){
  const k=akey(s.name,c.name,which); (ACC.cells[k]||=[]).push(id);
  return `<span id="${id}">${secretCell(k,secretIsSet(c,which),s.name,c.name,which)}</span>`;
}
// Redraw one secret's cell without touching an open form (a reveal ending mustn't wipe it).
function paintSecret(k){
  const cells=(ACC.cells[k]||[]).map(id=>document.getElementById(id)).filter(Boolean);
  const h=k.indexOf('#'), path=h<0?k:k.slice(0,h), which=h<0?'':k.slice(h+1);   // see akey
  const [sys,...rest]=path.split('/'), comp=rest.join('/');
  const f=findComp(sys,comp);
  if(!cells.length||!f){ if(!ACC.form) renderAccess(); return; }   // its row is the open edit form
  cells.forEach(cell=>{ cell.innerHTML=secretCell(k,secretIsSet(f.c,which),sys,comp,which); });
}

function toggleSecret(i,on){
  syncRows(); ACC.rows[i].secret=on; ACC.rows[i].value='';
  const v=$('#ff-v-'+i); if(v) v.value='';

}
function syncRows(){
  ACC.rows.forEach((r,i)=>{ if(r.removed) return;
    const n=$('#ff-n-'+i), v=$('#ff-v-'+i);
    if(n&&typeof n.value==='string'&&!(r.existing&&r.secret)) r.name=n.value;
    if(v&&typeof v.value==='string') r.value=v.value; });
  ACC.users.forEach((u,i)=>{ if(u.removed) return;
    const n=$('#uu-n-'+i), p=$('#uu-p-'+i);
    if(n&&typeof n.value==='string'&&!u.existing) u.name=n.value;
    if(p&&typeof p.value==='string') u.pw=p.value; });
