// ------------------------------------------------------------------ tower view
// A system drawn as the Gotcha GUI draws a tower: one circle, north up, every sensor a wedge
// pointing along its azimuth out to its range (or a full circle when it hears all round).
const TYPE_TINT={radars:'var(--radar)',cameras:'var(--camera)',acoustics:'var(--acoustic)'};
const niceRange=m=>[200,500,1000,2000,5000,10000].find(c=>c>=m)??Math.ceil(m/1000)*1000;
function towerPlan(s){
  const SIZE=300, C=SIZE/2, R=112;
  const polar=(deg,r)=>[C+r*Math.sin(deg*Math.PI/180), C-r*Math.cos(deg*Math.PI/180)];
  const f1=x=>x.toFixed(1);
  const sensors=s.categories.filter(c=>isSensorCat(c.key)).flatMap(c=>c.components.map(x=>({...x,cat:c.key})));
  const omni=m=>m.coverage.to-m.coverage.from>=360;
  // A sensor needs a direction to be drawn, unless it hears all round.
  const drawn=sensors.filter(m=>omni(m)||(m.azimuth!=null&&m.azimuth!=='')), missing=sensors.filter(m=>!drawn.includes(m));
  const outerM=niceRange(Math.max(1,...drawn.map(m=>m.coverage.range)));
  const wedges=drawn.map(m=>{
    const tint=TYPE_TINT[m.cat]||'#6b7280', cov=m.coverage, az=Number(m.azimuth)||0;
    const r=R*Math.min(1,cov.range/outerM);
    const tip=`${m.name} · ${omni(m)?'all round':`${deg3(az)}°, ${cov.from}° to ${cov.to}°`} · ${cov.range} m`;
    let shape, mid;
    if(omni(m)){
      shape=`<circle cx="${C}" cy="${C}" r="${f1(r)}" fill="${tint}" fill-opacity=".08" stroke="${tint}" stroke-opacity=".75" stroke-width="1.2"/>`;
      mid=az+20;
    }else{
      const from=az+cov.from, to=az+cov.to, [sx,sy]=polar(from,r), [ex,ey]=polar(to,r);
      shape=`<path d="M ${C} ${C} L ${f1(sx)} ${f1(sy)} A ${f1(r)} ${f1(r)} 0 ${cov.to-cov.from>180?1:0} 1 ${f1(ex)} ${f1(ey)} Z"
        fill="${tint}" fill-opacity=".10" stroke="${tint}" stroke-opacity=".75" stroke-width="1.2"/>
        <line x1="${C}" y1="${C}" x2="${f1(polar(az,r)[0])}" y2="${f1(polar(az,r)[1])}" stroke="${tint}" stroke-width="1.5"/>`;
      mid=az;
    }
    const [lx,ly]=polar(mid,Math.min(r+14,R+20)), sn=Math.sin(mid*Math.PI/180);
    const anchor=sn<-0.3?'end':sn>0.3?'start':'middle';
    return `<g><title>${esc(tip)}</title>${shape}
      <text x="${f1(lx)}" y="${f1(ly+3)}" text-anchor="${anchor}" class="tw-label">${esc(m.name)}${omni(m)?'':` ${deg3(az)}°`}</text></g>`;
  }).join('');
  return `<div class="tw-plan">
    <svg viewBox="-60 0 ${SIZE+120} ${SIZE}" width="${SIZE+120}" height="${SIZE}" role="img" aria-label="Tower view of ${esc(s.name)}">
      ${[1/3,2/3,1].map(k=>`<circle cx="${C}" cy="${C}" r="${f1(R*k)}" class="tw-ring"/>`).join('')}
      <text x="${C+4}" y="${f1(C-R-3)}" class="tw-scale">${outerM} m</text>
      ${wedges}
      <circle cx="${C}" cy="${C}" r="3.5" class="tw-hub"/>
      <g class="tw-north"><line x1="${C}" y1="12" x2="${C}" y2="26"/>
        <path d="M ${C} 6 L ${C-4} 15 L ${C+4} 15 Z"/><text x="${C+7}" y="16">N</text></g>
    </svg>
    <div class="row" style="justify-content:center;gap:12px">
      ${Object.entries({radars:'radar',cameras:'camera',acoustics:'acoustic'}).map(([k,l])=>`<span class="note"><span class="tw-key" style="background:${TYPE_TINT[k]}"></span> ${l}</span>`).join('')}
      <span class="note">· north up · outer ring ${outerM} m</span></div>
    ${sensors.length?'':'<p class="note" style="text-align:center">No radars, cameras or acoustics yet: add one and it shows here.</p>'}
    ${missing.length?`<p class="note" style="text-align:center">No azimuth yet, so not drawn: ${missing.map(m=>esc(m.name)).join(', ')}.</p>`:''}
  </div>`;
}
function toggleTowerView(name){ ACC.towerView.has(name)?ACC.towerView.delete(name):ACC.towerView.add(name); renderAccess(); }

// ------------------------------------------------------------------ the part
function renderAccess(){
  // Keep what was typed in an open form across a redraw.
  // (Not when a form has just been opened: what's on screen then belongs to the one before.)
  const keep={}, checks={};
  if(ACC.form&&!ACC.fresh){ syncRows();
    KEEP_IDS.forEach(k=>{ const i=$('#af-'+k); if(i&&typeof i.value==='string') keep[k]=i.value; });
    KEEP_CHECKS.forEach(k=>{ const i=$('#af-'+k); if(i&&typeof i.checked==='boolean') checks[k]=i.checked; }); }
  ACC.fresh=false;
  const F=ACC.form||{}, admin=ACC.can_edit;
  ACC.cells={};
  const cards=ACC.systems.map((s,si)=>{
    const sections=s.categories.map((cat,ki)=>{
      const sensor=isSensorCat(cat.key);
      const rows=cat.components.map((c,ci)=>{
        if(F.kind==='comp-edit'&&F.sys===s.name&&F.comp===c.name) return sensor?sensorForm(s,c,cat.key):compForm(s,c,cat.key);
        const id=`acp-${si}-${ki}-${ci}`;
        return (sensor?sensorRow(s,c,id):compRow(s,c,id))+(ACC.details.has(s.name+'/'+c.name)?detailsRow(s,c,sensor,id):'');
      }).join('');
      const adding=F.kind==='comp-add'&&F.sys===s.name&&F.cat===cat.key;
      const editing=F.kind==='comp-edit'&&F.sys===s.name&&cat.components.some(c=>c.name===F.comp);
      // Collapsed by default; open while a form is open in it or the admin opened it.
      const ck=s.name+'/'+cat.key, open=ACC.openCats.has(ck)||adding||editing;
      return `<details class="cat" ${open?'open':''} ontoggle="toggleCat('${jsq(ck)}',this.open)">
        <summary><b>${esc(cat.label)}</b> <span class="badge">${cat.components.length}</span>
          ${admin&&!adding?`<button class="sm" onclick="event.preventDefault();event.stopPropagation();openForm('comp-add','${jsq(s.name)}',null,'${jsq(cat.key)}')">+ add</button>`:''}</summary>
        ${cat.components.length||adding?`<div class="scroll"><table>${sensor?SENSOR_HEAD:COMP_HEAD}
          ${rows}${adding?(sensor?sensorForm(s,null,cat.key):compForm(s,null,cat.key)):''}</table></div>`:'<p class="note">None.</p>'}</details>`;
    }).join('');
    const n=s.categories.reduce((a,c)=>a+c.components.length,0);
    const counts=s.categories.filter(c=>c.components.length).map(c=>`${c.components.length} ${esc(c.label.toLowerCase())}`).join(' · ');
    // Collapsed by default; open while it has a form open or the admin opened it.
    const open=ACC.open.has(s.name)||F.sys===s.name;
    return `<details class="card sys" ${open?'open':''} ontoggle="toggleSystem('${jsq(s.name)}',this.open)">
      <summary><b>${esc(s.name)}</b>
        ${s.site?`<span class="dim">— ${esc(s.site)}</span>`:''}
        ${s.latitude!=null&&s.longitude!=null?`<a class="mono" style="font-size:12px" target="_blank" rel="noopener noreferrer"
          title="open on OpenStreetMap" onclick="event.stopPropagation()"
          href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(s.latitude)}&amp;mlon=${encodeURIComponent(s.longitude)}#map=16/${encodeURIComponent(s.latitude)}/${encodeURIComponent(s.longitude)}"
          >${esc(s.latitude)}, ${esc(s.longitude)}${s.altitude!=null?` · ${esc(s.altitude)} m`:''}</a>`:''}
        <span class="badge">${n} component${n===1?'':'s'}</span>
        <span class="dim" style="font-size:12px">${counts}</span></summary>
      <div class="row" style="margin-top:6px">
        ${s.description?`<span class="note">${esc(s.description)}</span>`:''}
        <span class="grow"></span><button class="sm" onclick="toggleTowerView('${jsq(s.name)}')">${ACC.towerView.has(s.name)?'hide tower view':'tower view'}</button>
        ${admin?`<button class="sm" onclick="openForm('sys-edit','${jsq(s.name)}')">edit system</button>`:''}</div>
      ${ACC.towerView.has(s.name)?towerPlan(s):''}
      ${F.kind==='sys-edit'&&F.sys===s.name?sysForm(s):''}${sections}</details>`;
  }).join('');
  const mins=Math.round(AUTH.edit_seconds/60);
  $('#sec-access').innerHTML=`<div class="card"><h3>System access <span class="dim" style="font-weight:400">— each system's radars, acoustics, cameras and compute, and how to reach them (<code>systems_inventory.yaml</code>)</span>
      ${admin&&editActive()?editBadge():''}
      <span class="grow"></span>${ACC.systems.length?'<button class="sm" onclick="expandAll(true)">expand all</button><button class="sm" onclick="expandAll(false)">collapse all</button>':''}
      ${admin&&F.kind!=='sys-add'?'<button class="sm" onclick="openForm(\'sys-add\')">+ add system</button>':''}</h3>
    ${ACC.error?`<p class="alert">${esc(ACC.error)}</p>`:ACC.inventory_file?'':'<p class="alert warn">There is no systems_inventory.yaml at the repo root yet; adding a system creates it.</p>'}
    <p class="note">${admin?`Secrets are hidden: reveal asks for a code from your authenticator and shows a value for 30 seconds. Your first add or edit asks for a code (or passkey); then editing stays unlocked for ${mins} minutes. A delete always asks. Every change goes in the audit log.`
      :'Systems, components and their plain values are shown; ask an admin for a secret or a change.'}</p></div>
    ${F.kind==='sys-add'?sysForm(null):''}${cards}`;
  Object.entries(keep).forEach(([k,v])=>{ const i=$('#af-'+k); if(i) i.value=v; });
  Object.entries(checks).forEach(([k,v])=>{ const i=$('#af-'+k); if(i) i.checked=v; });
  // Passwords typed in user rows and secret field rows (drawn empty) go back in too.
  if(ACC.form){
    ACC.users.forEach((u,i)=>{ const p=$('#uu-p-'+i); if(p&&u.pw) p.value=u.pw; });
    ACC.rows.forEach((r,i)=>{ const v=$('#ff-v-'+i); if(v&&r.secret&&r.value) v.value=r.value; });
  }
}
function toggleSystem(name,open){ open?ACC.open.add(name):ACC.open.delete(name); }
function toggleCat(key,open){ open?ACC.openCats.add(key):ACC.openCats.delete(key); }
// Every system and every category in it, open or closed. Collapsing also closes what would
// hold them open: a form (as Cancel does) and the tower views.
function expandAll(open){
  ACC.open=new Set(open?ACC.systems.map(s=>s.name):[]);
  ACC.openCats=new Set(open?ACC.systems.flatMap(s=>s.categories.map(c=>s.name+'/'+c.key)):[]);
  if(!open){ ACC.towerView.clear(); ACC.form=null; ACC.rows=[]; ACC.users=[]; }
  renderAccess();
}
function openForm(kind,sys,comp,cat){
  ACC.form={kind,sys,comp,cat}; ACC.fresh=true;
  const f=comp?findComp(sys,comp):null;
  // What the form is in stays open after it closes: you were working there.
  if(sys) ACC.open.add(sys);
  if(sys&&(cat||f)) ACC.openCats.add(sys+'/'+(cat||f.cat));
  ACC.rows=f?[...Object.entries(f.c.fields).map(([name,value])=>({name,value:shownValue(value),secret:false,existing:true,
      origName:name,raw:value})),
    ...f.c.secret_fields.map(x=>({name:x.name,value:'',secret:true,existing:true,isSet:x.set}))]:[];
  ACC.users=f?f.c.users.map(u=>({name:u.name,pw:'',existing:true,isSet:u.set})):[];
  renderAccess(); setTimeout(()=>{ const i=$('#af-name'); if(i&&i.focus) i.focus(); },0);
}
function closeForm(){ ACC.form=null; ACC.rows=[]; ACC.users=[]; renderAccess(); }
// How a text box shows a value: a box can't hold a line break, and the page trims.
const shownValue=v=>String(v??'').replace(/[\r\n]+/g,'').trim();
const formVal=k=>{ const i=$('#af-'+k); return i&&typeof i.value==='string'?i.value.trim():''; };
const checked=k=>{ const i=$('#af-'+k); return !!(i&&i.checked===true); };
// Only what changed, so a field nobody touched is left as it is in the file.
function diffFields(fields,orig){
  const out={};
  fields.forEach(([k])=>{
    const v=formVal(k), was=orig?shownValue(orig[k]):'';
    if(orig&&v===was) return;            // untouched
    if(!orig&&v==='') return;            // a new item: empty fields aren't sent
    if(k==='port'){
      if(v!==''&&!/^\d+$/.test(v)) throw new Error('the port is a number');
      out[k]=v===''?null:Number(v);
    }else out[k]=v;
  });
  return out;
}
// The extra fields as the server wants them: the whole plain set (if it changed), and the
// secret ones that are new, changed or removed.
function fieldChanges(orig){
  syncRows();
  const plain={}, secret={}, seen=new Set();
  for(const r of ACC.rows){
    const name=(r.name||'').trim();
    if(r.removed){ if(r.existing&&r.secret) secret[name]=null; continue; }
    if(!name){ if(r.value) throw new Error('an extra field needs a name'); continue; }
    if(seen.has(name.toLowerCase())) throw new Error(`two fields are called ${name}`);
    seen.add(name.toLowerCase());
    if(r.secret){
      if(r.value) secret[name]=r.value;
      else if(!r.existing) throw new Error(`give the secret field ${name} a value`);
    }else{
      // Untouched, it goes back exactly as the file has it (a line break, padding and all).
      const untouched=r.existing&&name===r.origName&&r.value.trim()===shownValue(r.raw);
      plain[name]=untouched?r.raw:r.value.trim();
    }
  }
  const out={};
  const was=orig?orig.fields:{};
  if(JSON.stringify(Object.entries(plain))!==JSON.stringify(Object.entries(was))) out.fields=plain;
  if(Object.keys(secret).length) out.secret_fields=secret;
  return out;
}
// The users as the server wants them: name -> new password, "" for a new user without one,
// null for one removed. Users nobody touched aren't sent.
function userChanges(){
  syncRows();
  const out={}, seen=new Set();
  for(const u of ACC.users){
    const name=(u.name||'').trim();
    if(u.removed){ if(u.existing) out[name]=null; continue; }
    if(!name){ if(u.pw) throw new Error('a user needs a name'); continue; }
    if(seen.has(name)) throw new Error(`two users are called ${name}`);
    seen.add(name);
    if(!u.existing||u.pw) out[name]=u.pw||'';
  }
  return Object.keys(out).length?{users:out}:{};
}
// The fixed passwords typed, or ticked for removal.
// The passwords typed, or ticked for removal: each box, its "remove" tick, and what it sets.
function passwordChanges(sensor,withSsh){
  const out={}, clear=[];
  const boxes=sensor?[['guipw','clear-gui','gui_password'],['pcwebpw','clear-pcweb','computer_web_password']]:[['webpw','clear-web','web_password'],['rdpw','clear-rd','rustdesk_password']];
  if(!sensor||withSsh) boxes.push(['pw','clear','password']);
  for(const [box,tick,name] of boxes){
    const v=$('#af-'+box), val=v&&typeof v.value==='string'?v.value:'';
    if(val&&checked(tick)) throw new Error('either type a new password or tick “remove”, not both');
    if(val) out[name]=val; else if(checked(tick)) clear.push(name);
  }
  if(clear.length) out.clear=clear;
  return out;
}
// Send a change with the form's code (or the passkey). On success the form closes, and with it
// everything typed into it; on failure it stays as typed, so a mistyped code is retried with
// the next one without typing the rest again.
async function accessCall(method,path,body,done){
  const code=formVal('code');
  try{
    const f=!code&&editActive()?{}:await saveFactor(code);
    if(!f){ endEditWindow(); return; }
    const r=await api('/access/'+path,{method,body:{...body,...f}});
    Object.values(ACC.timers).forEach(clearTimeout);
    ACC.form=null; ACC.rows=[]; ACC.users=[]; ACC.reveal={}; ACC.timers={}; accessState(r); renderAccess();
    toast(done(r),'ok');
  }catch(e){
    const c=$('#af-code'); if(c) c.value='';   // a code is used once either way
    // Asked for a code the page thought it didn't need (the window ended, or the clocks
    // differ): show the code box again.
    if(!c&&ACC.form&&/code|login/i.test(e.message)) endEditWindow();
    toast(e.message,'bad');
  }
}
async function saveSystem(name){
  let body; try{ body=diffFields(SYS_FIELDS,name?ACC.systems.find(s=>s.name===name):null); }
  catch(e){ toast(e.message,'warn'); return; }
  if(!name&&!body.name){ toast('Give the system a name.','warn'); return; }
  if(name&&!Object.keys(body).length){ toast('Nothing changed.'); closeForm(); return; }
  await accessCall(name?'PUT':'POST', name?`system/${encodeURIComponent(name)}`:'system', body,
    r=>{ if(name&&body.name){
        if(ACC.open.delete(name)) ACC.open.add(body.name);
        if(ACC.towerView.delete(name)) ACC.towerView.add(body.name);
        ACC.openCats=new Set([...ACC.openCats].map(k=>k.startsWith(name+'/')?body.name+k.slice(name.length):k));
        renderAccess(); }
      return name?`Saved ${body.name||name}: ${(r.changed||[]).join(', ')||'nothing changed'}.`:`Added system ${body.name}.`; });
}
async function deleteSystem(name){
  if(!confirm(`Delete system ${name}, all its components and the secrets only they hold? This can't be undone here.`)) return;
  await accessCall('DELETE',`system/${encodeURIComponent(name)}`,{},()=>`Deleted system ${name}.`);
}
async function saveComponent(sys,comp){
  const f=comp?findComp(sys,comp):null, orig=f?f.c:null;
  // The form on screen is a sensor's or a computer's by the category it was opened in.
  const sensor=isSensorCat(f?f.cat:ACC.form&&ACC.form.cat);
  let body;
  try{
    const ssh=sensor&&sensorHasSsh(orig);
    body={...diffFields(sensor?[...SENSOR_FIELDS,...(ssh?SENSOR_SSH_FIELDS:[])]:[...COMP_FIELDS,...PC_FIELDS],orig),
      ...fieldChanges(orig),...passwordChanges(sensor,ssh),...(sensor?{}:userChanges())};
  }catch(e){ toast(e.message,'warn'); return; }
  const cat=formVal('category'); if(!f||cat!==f.cat) body.category=cat;
  if(!sensor){ const s=formVal('sensor'); if(s!==(orig&&orig.sensor||'')) body.sensor=s; }
  if(!comp&&!body.name){ toast('Give the component a name.','warn'); return; }
  if(comp&&!Object.keys(body).length){ toast('Nothing changed.'); closeForm(); return; }
  const base=`system/${encodeURIComponent(sys)}/component`;
  await accessCall(comp?'PUT':'POST', comp?`${base}/${encodeURIComponent(comp)}`:base, body,
    r=>comp?`Saved ${sys}/${body.name||comp}: ${(r.changed||[]).join(', ')||'nothing changed'}.`:`Added ${sys}/${body.name}.`);
}
async function deleteComponent(sys,comp){
  if(!confirm(`Delete component ${sys}/${comp}? Its secrets go too, unless another component holds them.`)) return;
  await accessCall('DELETE',`system/${encodeURIComponent(sys)}/component/${encodeURIComponent(comp)}`,{},()=>`Deleted ${sys}/${comp}.`);
}
async function revealAccess(sys,comp,which,retried){
  if(!await ensureStepup()) return;
  const k=akey(sys,comp,which);
  try{
    const r=await api(`/access/system/${encodeURIComponent(sys)}/component/${encodeURIComponent(comp)}/reveal`,
      {method:'POST',body:whichBody(which)});
    ACC.reveal[k]=r.value;
    clearTimeout(ACC.timers[k]); ACC.timers[k]=setTimeout(()=>hideAccess(k),REVEAL_MS);
    paintSecret(k);
  }catch(e){
    if(e.message==='stepup'&&!retried){ AUTH.stepup_until=null; return revealAccess(sys,comp,which,true); }
    toast(e.message,'bad');
  }
}
function hideAccess(k){ clearTimeout(ACC.timers[k]); delete ACC.timers[k]; delete ACC.reveal[k]; paintSecret(k); }

function route(){
  const [t,...rest]=decodeURIComponent(location.hash.slice(1)).split('/'), arg=rest.join('/');
  if(t==='convos'&&arg) CV.open=arg;
  if(t==='cases'&&arg) CASE={slug:arg,loading:true};
  if(t==='systems'&&arg) SITE_OPEN.add(arg);
  showTab(t==='access'?'secrets':TABS.includes(t)?t:'convos');
  if(t==='cases'&&arg) openCase(arg);
}
async function boot(){
  try{ AUTH=await api('/auth/status'); }
  catch(e){ if(e.message!=='login') document.body.innerHTML=`<p class="alert" style="margin:24px">${esc(e.message)}</p>`; return; }
  if(!AUTH.logged_in) return showLogin(AUTH);
  $('#who').textContent=`${AUTH.who} · ${AUTH.role}`;
  $('#logout').hidden=false; $('#pkbtn').hidden=false;
  refreshDeploy();
  api('/selftest').then(showSelftest);
  route();
}
